<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>西洋占星術｜Astrology Chart</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Noto+Serif+JP:wght@300;400&family=Karla:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f8f7f4;
  --white: #ffffff;
  --ink: #1a1a1a;
  --ink-mid: #4a4a4a;
  --ink-light: #9a9a9a;
  --ink-xlight: #d0d0d0;
  --accent: #1a1a1a;
  --fire: #c0392b;
  --earth: #7d6608;
  --air: #1a5276;
  --water: #1a6b5c;
  --border: #e8e6e1;
  --hover: #f0ede8;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'Karla', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

/* Layout */
.page {
  max-width: 800px;
  margin: 0 auto;
  padding: 64px 32px 100px;
}

/* Header */
.header {
  margin-bottom: 64px;
  border-bottom: 1px solid var(--border);
  padding-bottom: 32px;
}

.header-label {
  font-size: 10px;
  letter-spacing: 0.4em;
  color: var(--ink-light);
  text-transform: uppercase;
  margin-bottom: 12px;
  font-weight: 400;
}

.header h1 {
  font-family: 'Playfair Display', serif;
  font-size: clamp(32px, 6vw, 56px);
  font-weight: 400;
  letter-spacing: -0.01em;
  line-height: 1.1;
  color: var(--ink);
  margin-bottom: 8px;
}

.header h1 em {
  font-style: italic;
  color: var(--ink-mid);
}

.header-desc {
  font-size: 13px;
  color: var(--ink-light);
  letter-spacing: 0.05em;
  line-height: 1.7;
}

/* Tab */
.tab-row {
  display: flex;
  gap: 0;
  border-bottom: 1px solid var(--border);
  margin-bottom: 48px;
}

.tab-btn {
  background: none;
  border: none;
  padding: 14px 24px;
  font-family: 'Karla', sans-serif;
  font-size: 13px;
  letter-spacing: 0.08em;
  color: var(--ink-light);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  transition: all 0.2s;
}

.tab-btn:hover { color: var(--ink); }
.tab-btn.active { color: var(--ink); border-bottom-color: var(--ink); }

/* Form */
.form-section { margin-bottom: 40px; }

.form-title {
  font-family: 'Playfair Display', serif;
  font-size: 18px;
  font-weight: 400;
  margin-bottom: 24px;
  color: var(--ink);
  display: flex;
  align-items: center;
  gap: 12px;
}

.form-title::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}

.form-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  margin-bottom: 24px;
}

.form-group { display: flex; flex-direction: column; gap: 6px; }
.form-group.half { grid-column: span 1; }
.form-group.full { grid-column: 1 / -1; }

.form-label {
  font-size: 10px;
  letter-spacing: 0.25em;
  color: var(--ink-light);
  text-transform: uppercase;
  font-weight: 400;
}

.form-input, .form-select {
  background: var(--white);
  border: 1px solid var(--border);
  color: var(--ink);
  font-family: 'Karla', sans-serif;
  font-size: 14px;
  padding: 11px 14px;
  outline: none;
  transition: border-color 0.2s;
  appearance: none;
  border-radius: 0;
}

.form-input:focus, .form-select:focus { border-color: var(--ink); }
.form-input::placeholder { color: var(--ink-xlight); }

/* Divider for compat */
.compat-divider {
  display: flex;
  align-items: center;
  gap: 16px;
  margin: 32px 0;
  color: var(--ink-light);
  font-size: 11px;
  letter-spacing: 0.2em;
}
.compat-divider::before, .compat-divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}

/* Submit */
.submit-btn {
  background: var(--ink);
  border: none;
  color: var(--white);
  font-family: 'Karla', sans-serif;
  font-size: 12px;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  padding: 16px 48px;
  cursor: pointer;
  transition: all 0.2s;
  display: block;
}

.submit-btn:hover { background: var(--ink-mid); }
.submit-btn:disabled { background: var(--ink-xlight); cursor: not-allowed; }

/* Loading */
.loading {
  display: none;
  align-items: center;
  gap: 12px;
  margin-top: 20px;
  font-size: 12px;
  color: var(--ink-light);
  letter-spacing: 0.15em;
}
.loading.show { display: flex; }
.load-bar {
  width: 120px;
  height: 1px;
  background: var(--border);
  position: relative;
  overflow: hidden;
}
.load-bar::after {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 100%; height: 100%;
  background: var(--ink);
  animation: loadSlide 1.5s ease-in-out infinite;
}
@keyframes loadSlide { to { left: 100%; } }

/* Result */
.result-wrap {
  opacity: 0;
  transform: translateY(12px);
  transition: all 0.6s ease;
  pointer-events: none;
}
.result-wrap.show { opacity: 1; transform: translateY(0); pointer-events: auto; }

/* Chart wheel - SVG */
.chart-section {
  margin-bottom: 48px;
  display: flex;
  gap: 40px;
  align-items: flex-start;
  flex-wrap: wrap;
}

.chart-wheel { flex-shrink: 0; }

.chart-legend { flex: 1; min-width: 200px; }

.legend-title {
  font-family: 'Playfair Display', serif;
  font-size: 14px;
  font-weight: 400;
  margin-bottom: 16px;
  color: var(--ink);
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 0;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  transition: background 0.15s;
}
.legend-item:hover { background: var(--hover); margin: 0 -8px; padding: 6px 8px; }

.legend-planet { font-size: 16px; width: 24px; text-align: center; }
.legend-info { flex: 1; }
.legend-name { font-size: 12px; letter-spacing: 0.05em; color: var(--ink); }
.legend-sign { font-size: 11px; color: var(--ink-light); margin-top: 1px; }
.legend-deg { font-size: 11px; color: var(--ink-xlight); font-family: 'Karla', monospace; }

/* Planet detail */
.planet-detail {
  background: var(--white);
  border: 1px solid var(--border);
  padding: 24px;
  margin-bottom: 32px;
  opacity: 0;
  transform: translateY(8px);
  transition: all 0.3s;
  pointer-events: none;
}
.planet-detail.show { opacity: 1; transform: translateY(0); pointer-events: auto; }

.pd-head {
  display: flex;
  align-items: baseline;
  gap: 12px;
  margin-bottom: 16px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
}
.pd-symbol { font-size: 28px; }
.pd-title { font-family: 'Playfair Display', serif; font-size: 20px; font-weight: 400; }
.pd-sign { font-size: 13px; color: var(--ink-light); letter-spacing: 0.1em; }
.pd-house { font-size: 11px; color: var(--ink-xlight); margin-left: auto; letter-spacing: 0.1em; }

.pd-text { font-size: 13px; line-height: 1.9; color: var(--ink-mid); margin-bottom: 12px; }

.pd-keywords {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.pd-kw {
  font-size: 10px;
  letter-spacing: 0.15em;
  color: var(--ink-light);
  border: 1px solid var(--border);
  padding: 3px 10px;
}

/* Sections */
.section { margin-bottom: 48px; }

.section-header {
  display: flex;
  align-items: baseline;
  gap: 16px;
  margin-bottom: 24px;
}

.section-title {
  font-family: 'Playfair Display', serif;
  font-size: 22px;
  font-weight: 400;
}

.section-title em { font-style: italic; color: var(--ink-mid); }

.section-line { flex: 1; height: 1px; background: var(--border); }

/* Element balance */
.element-bars { display: flex; flex-direction: column; gap: 12px; margin-bottom: 32px; }

.el-row { display: flex; align-items: center; gap: 12px; }
.el-label { font-size: 11px; letter-spacing: 0.2em; width: 40px; color: var(--ink-light); }
.el-bar-wrap { flex: 1; height: 3px; background: var(--border); }
.el-bar { height: 100%; transition: width 0.8s ease; }
.el-fire { background: var(--fire); }
.el-earth { background: var(--earth); }
.el-air { background: var(--air); }
.el-water { background: var(--water); }
.el-count { font-size: 11px; color: var(--ink-light); width: 20px; text-align: right; font-family: 'Karla', monospace; }

/* House table */
.house-table { width: 100%; border-collapse: collapse; }
.house-table th {
  font-size: 9px;
  letter-spacing: 0.25em;
  color: var(--ink-light);
  text-transform: uppercase;
  text-align: left;
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
  font-weight: 400;
}
.house-table td {
  font-size: 12px;
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
  color: var(--ink-mid);
  line-height: 1.5;
}
.house-table td:first-child { color: var(--ink-xlight); font-family: 'Karla', monospace; font-size: 11px; }
.house-table td:nth-child(2) { font-weight: 500; color: var(--ink); }
.house-table tr:hover td { background: var(--hover); }

/* Big 3 summary */
.big3 {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1px;
  background: var(--border);
  border: 1px solid var(--border);
  margin-bottom: 32px;
}
.big3-item {
  background: var(--white);
  padding: 20px;
  text-align: center;
}
.big3-label { font-size: 9px; letter-spacing: 0.3em; color: var(--ink-light); text-transform: uppercase; margin-bottom: 8px; }
.big3-symbol { font-size: 28px; margin-bottom: 6px; }
.big3-name { font-family: 'Playfair Display', serif; font-size: 15px; font-weight: 400; margin-bottom: 2px; }
.big3-sign { font-size: 11px; color: var(--ink-light); }

/* Compat */
.compat-score {
  display: flex;
  align-items: center;
  gap: 20px;
  margin-bottom: 32px;
  padding: 24px;
  background: var(--white);
  border: 1px solid var(--border);
}
.compat-num {
  font-family: 'Playfair Display', serif;
  font-size: 56px;
  font-weight: 400;
  line-height: 1;
  color: var(--ink);
}
.compat-unit { font-size: 14px; color: var(--ink-light); align-self: flex-end; margin-bottom: 8px; }
.compat-right { flex: 1; }
.compat-verdict { font-family: 'Playfair Display', serif; font-size: 20px; font-weight: 400; font-style: italic; margin-bottom: 8px; }
.compat-sub { font-size: 12px; color: var(--ink-light); line-height: 1.7; }

.compat-aspects { display: flex; flex-direction: column; gap: 0; }
.compat-aspect-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
  font-size: 12px;
}
.asp-planets { width: 140px; color: var(--ink); font-weight: 500; }
.asp-type { width: 80px; color: var(--ink-light); font-size: 11px; letter-spacing: 0.1em; }
.asp-meaning { flex: 1; color: var(--ink-mid); font-size: 11px; line-height: 1.5; }
.asp-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.asp-trine { background: var(--water); }
.asp-sextile { background: var(--air); }
.asp-square { background: var(--fire); }
.asp-opposition { background: #888; }
.asp-conjunction { background: var(--earth); }

/* Reset */
.reset-btn {
  background: none;
  border: 1px solid var(--border);
  color: var(--ink-light);
  font-family: 'Karla', sans-serif;
  font-size: 11px;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  padding: 12px 32px;
  cursor: pointer;
  transition: all 0.2s;
  display: block;
  margin: 0 auto;
}
.reset-btn:hover { border-color: var(--ink); color: var(--ink); }

.footer-note {
  font-size: 11px;
  color: var(--ink-xlight);
  text-align: center;
  margin-top: 48px;
  letter-spacing: 0.08em;
}

/* Responsive */
@media (max-width: 580px) {
  .page { padding: 40px 20px 80px; }
  .form-grid { grid-template-columns: 1fr 1fr; }
  .big3 { grid-template-columns: 1fr; }
  .chart-section { flex-direction: column; }
  .compat-score { flex-direction: column; text-align: center; }
}
</style>
</head>
<body>
<div class="page">

  <div class="header">
    <div class="header-label">Western Astrology · 西洋占星術</div>
    <h1>Natal Chart<br><em>& Synastry</em></h1>
    <div class="header-desc">生年月日・出生時刻・出生地から10天体・ハウス・相性を読み解きます</div>
  </div>

  <!-- Tab -->
  <div class="tab-row">
    <button class="tab-btn active" onclick="switchTab('natal', this)">個人チャート</button>
    <button class="tab-btn" onclick="switchTab('compat', this)">相性診断</button>
  </div>

  <!-- Natal form -->
  <div id="natalForm">
    <div class="form-section">
      <div class="form-title">出生情報</div>

          <input class="form-input" type="date" id="nDate">

          <div class="form-label">出生時刻</div>
          <input class="form-input" type="time" id="nTime" value="12:00">

        <div class="form-group full">
          <div class="form-label">出生地（都市）</div>
          <select class="form-select" id="nCity">
            <option value="135,35">東京</option>
            <option value="135.5,34.7">大阪</option>

            <option value="141.4,43.1">札幌</option>

            <option value="2.3,48.9">パリ</option>
            <option value="116.4,39.9">北京</option>
          </select>
        </div>
      </div>
      <button class="submit-btn" id="natalBtn" onclick="calcNatal()">チャートを計算する</button>
      <div class="loading" id="natalLoading">
        <div class="load-bar"></div>
        <span>天体の位置を計算中…</span>
      </div>
    </div>
  </div>

  <!-- Compat form -->
  <div id="compatForm" style="display:none">
    <div class="form-section">
      <div class="form-title">Person A</div>
      <div class="form-grid">
        <div class="form-group"><div class="form-label">名前</div><input class="form-input" type="text" id="aName" placeholder="山田花子"></div>
        <div class="form-group"><div class="form-label">生年月日</div><input class="form-input" type="date" id="aDate"></div>
        <div class="form-group"><div class="form-label">出生時刻</div><input class="form-input" type="time" id="aTime" value="12:00"></div>
      </div>
    </div>
    <div class="compat-divider">×</div>
    <div class="form-section">
      <div class="form-title">Person B</div>
      <div class="form-grid">
        <div class="form-group"><div class="form-label">名前</div><input class="form-input" type="text" id="bName" placeholder="鈴木太郎"></div>
        <div class="form-group"><div class="form-label">生年月日</div><input class="form-input" type="date" id="bDate"></div>
        <div class="form-group"><div class="form-label">出生時刻</div><input class="form-input" type="time" id="bTime" value="12:00"></div>
      </div>
    </div>
    <button class="submit-btn" id="compatBtn" onclick="calcCompat()">相性を診断する</button>
    <div class="loading" id="compatLoading">
      <div class="load-bar"></div>
      <span>二人のアスペクトを計算中…</span>
    </div>
  </div>

  <!-- Results -->
  <div class="result-wrap" id="resultWrap"></div>

</div>

<script>
// ===== ASTROLOGY ENGINE =====

const SIGNS = [
  { name:'牡羊座', en:'Aries', symbol:'♈', element:'fire', quality:'cardinal', ruler:'火星', start:0 },

];

  { key:'sun', name:'太陽', en:'Sun', symbol:'☉', color:'#e67e22' },

];

const HOUSES = [
  { num:1, name:'第1ハウス', theme:'自己・外見・始まり', keyword:'アイデンティティ' },
  { num:2, name:'第2ハウス', theme:'財産・価値観・才能', keyword:'所有' },

  { num:11, name:'第11ハウス', theme:'友人・グループ・理想・未来', keyword:'希望' },
  { num:12, name:'第12ハウス', theme:'潜在意識・隠れたもの・精神性', keyword:'解放' }
];

// Planet meanings per sign
const PLANET_SIGN_MEANINGS = {
  sun: {
    '牡羊座':'あなたの太陽は牡羊座に輝いています。牡羊座の太陽は、火のエレメントの先駆者として、この世界に最初の一歩を踏み出すことに使命を感じます。生まれながらのリーダーシップと圧倒的な行動力が最大の武器。他の人がためらっているときに真っ先に動けるのがあなたです。自我が強く、自分のやり方を貫く意志を持ちますが、それがあなたの魅力でもあります。衝動的になりやすいため、一度立ち止まって考える習慣が人生の質を高めます。競争を愛し、挑戦の中でこそ輝く魂です。',
    '牡牛座':'あなたの太陽は牡牛座に輝いています。地のエレメントに属し、安定・忍耐・美的センスを人生の柱とします。感覚的な喜び、五感で感じる豊かさを何より大切にし、本物だけを選ぼうとする審美眼があります。一度決めた目標をゆっくりと着実に達成する底力があり、人から信頼を得やすい。変化を好まず頑固に見られることもありますが、それは確固たる価値観の証。物質的な豊かさと精神的な安定の両方を求め、美しい環境の中でこそ力を発揮する魂です。',
    '双子座':'あなたの太陽は双子座に輝いています。風のエレメントの知の使者として、情報と言葉の世界で生きます。並外れた好奇心と知的俊敏さで、どんな分野にも素早く馴染める柔軟性があります。コミュニケーション能力が高く、人々をつなぐ架け橋となる才能がある。ただし、多方向に興味が分散しやすく、一つのことを深めることが課題になりやすい。表と裏の二面性があり、状況に応じて異なる顔を見せることも。変化と刺激の中で最もいきいきと輝く魂です。',
    '蟹座':'あなたの太陽は蟹座に輝いています。水のエレメントに属し、感情・直感・記憶を人生の羅針盤とします。深い共感力と保護本能を持ち、大切な人を守ることに真の喜びを見出します。過去への想いが強く、故郷・家族・思い出をとても大切にします。感受性が非常に豊かで、周囲の感情や空気感を敏感に察知します。傷つきやすい繊細さがありますが、その感受性こそが人の心に寄り添える力の源。安心できる「巣」を持つことで本来の力を最大限に発揮できる魂です。',
    '獅子座':'あなたの太陽は獅子座に輝いています。火のエレメントの王として、創造・表現・輝きを使命とします。生まれながらのカリスマ性と存在感があり、どこにいても自然と注目を集めます。人々を照らし、鼓舞し、楽しませることに喜びを見出す太陽的な魂。承認欲求が強い面もありますが、それは「最高の自分で在りたい」という純粋な向上心の表れです。愛情豊かで気前が良く、大切な人には惜しみなく与えます。舞台の中心で輝くとき、あなたは最も美しく強い。',
    '乙女座':'あなたの太陽は乙女座に輝いています。地のエレメントに属し、分析・改善・奉仕を人生の主軸とします。細部への鋭い観察眼と批判的思考力を持ち、物事を完璧に近づけようとする姿勢があります。誰かの役に立つことに深い充足感を感じ、縁の下の力持ちとして組織を支える力があります。完璧主義が自己批判に向くと苦しくなるため、「十分に良い」を受け入れる練習が大切。健康・日常・実用性に強い関心を持ち、地道な努力で本物の専門性を身につけられる魂です。',
    '天秤座':'あなたの太陽は天秤座に輝いています。風のエレメントに属し、美・調和・公正を人生の根幹とします。対人関係に卓越した才能を持ち、異なる意見の間に橋を架けて調和を生み出す力があります。美的センスが高く、デザイン・ファッション・芸術の分野に天性の素質があります。決断が苦手な面がありますが、それは全ての側面を公正に見ようとするがゆえ。一人ではなくパートナーシップの中で輝く魂です。関係性を通じて自己を深め、互いを高め合う絆を育てることに真の使命があります。',
    '蠍座':'あなたの太陽は蠍座に輝いています。水のエレメントの深淵を司り、変容・洞察・再生を使命とします。表面には現れない物事の本質を見抜く鋭い直感力と、心理的な洞察力が際立っています。一度決意したことへの集中力と執念は他の追随を許さない。感情を表に出しにくいですが、内側には誰よりも深い感情の海を持っています。信頼する相手には深く忠誠を捧げますが、裏切りには敏感です。幾度もの試練と再生を経て魂が強くなる、フェニックスのような存在です。',
    '射手座':'あなたの太陽は射手座に輝いています。火のエレメントの哲学者として、自由・真実・拡大を求めて旅を続けます。生まれながらの楽観主義と冒険心があり、未知の世界に躊躇なく飛び込める勇気があります。哲学・宗教・文化・教育など、知の地平を広げることに強い引力を感じます。大きなビジョンを持ちますが、細部や継続性が課題になることも。自由を束縛されることを何より嫌い、精神的・物理的な広がりの中でこそ本来の力が開花する魂です。人々に希望と可能性を示す、矢のような存在。',
    '山羊座':'あなたの太陽は山羊座に輝いています。地のエレメントの頂点を目指す者として、目標・責任・成熟を人生の柱とします。長期的な視野と粘り強い実行力で、人生の山を一歩一歩着実に登っていく力があります。若い頃は苦労が多くても、年を重ねるごとに力が増していく「逆成長」の傾向があります。責任感が強く、社会的な役割に誠実に向き合います。感情を内に秘める分、孤独を感じやすい面も。しかし真の実力と権威を築き、時間をかけて山の頂点から世界を見渡す魂です。',
    '水瓶座':'あなたの太陽は水瓶座に輝いています。風のエレメントの革命家として、革新・自由・人類愛を使命とします。時代の一歩先を行く独創的な思考力と、既存の枠に収まらない個性があります。人類全体の福祉や未来に対する強い関心を持ち、社会変革への情熱があります。個人よりも集団・社会への関心が強い反面、親密な関係では感情的な距離を置きがちです。独立心が非常に強く、自分のやり方を貫きます。常識を疑い、新しいパラダイムを創造することに使命を感じる、時代の先駆者です。',
    '魚座':'あなたの太陽は魚座に輝いています。水のエレメントの最終到達地として、共感・精神性・無境界の愛を体現します。12星座の中で最も霊的な感受性と直感力を持ち、言葉にならないものを感じ取る力があります。芸術・音楽・詩・癒しの世界に類まれな才能を持つことが多い。自他の境界が曖昧なため、他者の感情や苦しみを吸収しやすい繊細さがあります。現実と夢想の狭間で生きるため、グラウンディングが重要です。無条件の愛と慈悲で世界を包む、宇宙的な魂です。'
  },
  moon: {
    '牡羊座':'月は感情・本能・無意識のニーズを司ります。牡羊座の月を持つあなたは、感情の反応が瞬発的で素直です。怒りや喜びが即座に体に現れ、感情を隠すのが苦手なタイプ。独立心が強く、感情的に依存されることを嫌います。子どもの頃から自立を求められた可能性があります。安心感を得るには「自分が先頭に立てる環境」「自分のペースを尊重されること」が鍵。感情の波が速く過ぎ去るため、根に持たないさっぱりとした性格でもあります。',
    '牡牛座':'月は感情・本能・無意識のニーズを司ります。牡牛座の月を持つあなたは、情緒的な安定と感覚的な快適さを最も必要とします。好きな食べ物・場所・人との時間が心の栄養になります。変化やサプライズが苦手で、ルーティンの中に安心を感じます。感情の変化はゆっくりですが、怒りが爆発すると手がつけられないことも。物や人への執着が強く、手放すことが心の大きな課題となることがあります。五感を大切にした生活設計が、心の健康の鍵です。',
    '双子座':'月は感情・本能・無意識のニーズを司ります。双子座の月を持つあなたは、言葉・情報・コミュニケーションで感情を処理します。気持ちを誰かに話すことで心が整理され、書くことも癒しになります。感情の移り変わりが早く、さっきまで泣いていたのに笑っているということも。安心感を得るには「知的な刺激」「気軽に話せる友人」が必要です。感情を論理化しようとする癖があり、深い部分での感情処理に時間がかかることも。多様な人との交流が心の豊かさになります。',
    '蟹座':'月は感情・本能・無意識のニーズを司ります。月は蟹座を支配する天体であり、ここに月がある人は感受性が非常に豊かです。他者の感情や空気感を皮膚感覚で察知し、共感力が際立っています。家族・故郷・過去への想いが人一倍強く、安心できる「巣」の存在が精神的支柱となります。傷つきやすく繊細ですが、その深い感受性が人の心に寄り添える力の源です。感情の満ち引きが月の満ち欠けのように周期的に変化します。大切な人を守ることに魂の充足感を覚えます。',
    '獅子座':'月は感情・本能・無意識のニーズを司ります。獅子座の月を持つあなたは、愛情と承認の中で心が満たされます。「あなたが一番大切」と感じさせてくれる関係に深い安心感を覚えます。感情表現が劇的で豊かであり、喜びも悲しみも全力で体験します。子どもの頃に十分に認められなかった経験が自己表現の課題として現れることがあります。創造的な活動・舞台・人前で輝く場面が心の栄養になります。愛する人に惜しみなく与え、同じように受け取ることを必要とする魂です。',
    '乙女座':'月は感情・本能・無意識のニーズを司ります。乙女座の月を持つあなたは、役に立つこと・整理整頓・ルーティンの中に安心感を見出します。感情を直接表現するより、実用的なサポートで愛情を示すタイプ。心配性な面があり、頭の中でネガティブなシナリオを繰り返す癖があります。体と感情が強く連動しており、感情的なストレスが身体症状として現れやすい。完璧でなくても「今の自分で十分」と認める練習が心の健康の鍵。奉仕することで充足感を感じる魂です。',
    '天秤座':'月は感情・本能・無意識のニーズを司ります。天秤座の月を持つあなたは、調和・公正・美しい環境の中で感情的に安定します。対立や争いを極端に嫌い、関係性のバランスを保つことに多くのエネルギーを使います。感情的なニーズを直接伝えることが苦手で、相手に察してもらおうとする傾向があります。一人でいると感情が不安定になりやすく、信頼できるパートナーの存在が心の錨となります。美しいもの・芸術・洗練された空間が心の癒しになります。',
    '蠍座':'月は感情・本能・無意識のニーズを司ります。蠍座の月を持つあなたは、感情の深度と強度が他の追随を許しません。感情を表に出すことは少ないですが、内側では常に深く感じています。信頼と裏切りへの感受性が極めて鋭く、一度傷ついた心は長く影響します。感情的な変容と再生のサイクルを人生の中で何度も経験します。秘密・神秘・心理の深淵に惹かれる傾向があります。全てを知り、全てを共有できる深い絆を求めます。表面的な関係では満たされない、深い感情の海を持つ魂です。',
    '射手座':'月は感情・本能・無意識のニーズを司ります。射手座の月を持つあなたは、自由・冒険・精神的な拡がりの中で感情的に満たされます。感情を哲学的・楽観的に捉える傾向があり、落ち込んでも素早く立ち直る回復力があります。束縛や義務感を感じると感情が不安定になります。旅・学び・新しい体験が心の栄養です。感情的な重さを嫌い、軽やかな関係を好みますが、深みが生まれにくい面もあります。笑いとユーモアが感情の安定装置となる、太陽のような明るい魂です。',
    '山羊座':'月は感情・本能・無意識のニーズを司ります。山羊座の月を持つあなたは、感情を内に秘め、実用的・現実的に対処しようとします。感情表現が苦手で「弱さ」を見せることへの抵抗感があります。幼少期に感情より責任や義務を優先することを覚えた可能性があります。達成感・社会的な認知・具体的な成果の中に安心感を見出します。感情を表に出す練習と、脆弱性を受け入れることが深い人間関係の鍵。年齢を重ねるほど感情的な成熟と柔軟性が増し、真の豊かさを受け取れるようになります。',
    '水瓶座':'月は感情・本能・無意識のニーズを司ります。水瓶座の月を持つあなたは、感情よりも理性・論理・客観性を優先する傾向があります。感情から一歩引いて観察する姿勢があり、他者には「冷たい」と映ることも。安心感を得るには「一定の自由と空間」が不可欠です。人類全体への博愛的な感情は豊かですが、特定の個人との深い感情的な絆を築くことが課題になることがあります。ユニークな友人関係・革新的なコミュニティの中で心が満たされます。感情と理性を統合することが魂の成長です。',
    '魚座':'月は感情・本能・無意識のニーズを司ります。魚座の月を持つあなたは、12星座の中で最も共感力が深く、霊的な感受性が高い。自他の感情的な境界が曖昧なため、他者の痛みや喜びをまるで自分のものとして感じます。芸術・音楽・詩・自然の中で深く癒されます。現実の厳しさに傷つきやすく、逃避の傾向が出ることも。夢・直感・シンクロニシティを大切にする生活が心の健康を保ちます。境界線を学び、自分を守ることで、より深く他者を愛せる魂です。'
  },
  mercury: {
    '牡羊座':'水星はコミュニケーション・思考スタイル・学習方法を司ります。牡羊座の水星を持つあなたの思考は稲妻のように速く、直感で先を読む力があります。言葉が率直で歯に衣着せない表現スタイルは、交渉や議論で威力を発揮します。考えながら話す「ストリーム・オブ・コンシャスネス」型で、新しいアイデアへの反応が速い。ただし熟考する前に結論を出しがちなため、重要な決断は一晩置く習慣が助けになります。ディベートと知的競争を楽しむ、アイデアの開拓者です。',
    '牡牛座':'水星はコミュニケーション・思考スタイル・学習方法を司ります。牡牛座の水星を持つあなたの思考はゆっくりと着実で、一度理解したことは深く定着します。記憶力に優れ、実用的・具体的な問題解決を得意とします。抽象論より現実に根ざした情報を好み、結論を急かされることが最も苦手。発言する前に十分に考えるため、言葉の重みと信頼感があります。音楽・芸術・グルメなど感覚的な領域での表現にも才能があります。一度決めた考えを変えにくい頑固さが弱点になることも。',
    '双子座':'水星はコミュニケーション・思考スタイル・学習方法を司ります。水星は双子座を支配する天体であり、ここに水星がある人は知性と言語の天才的な資質があります。情報処理が驚異的に速く、複数の話題を同時に追える知的柔軟性があります。言葉の機転が利き、人を惹きつける会話術があります。読書・執筆・教育・メディアに強い縁があります。ただし思考が広がりすぎて収集がつかなくなることも。深みよりも広さを好む傾向があり、専門性を磨くことが長期的な課題です。',
    '蟹座':'水星はコミュニケーション・思考スタイル・学習方法を司ります。蟹座の水星を持つあなたの思考は感情と記憶に深く根ざしています。過去の経験・思い出・感情的な印象から物事を判断する直感的な知性があります。言葉を選ぶときに相手の感情を細やかに配慮し、人の心に響くコミュニケーションができます。論理より感情的文脈を重視するため、客観的な分析が必要な場面では意識的に感情を切り離す練習が助けになります。詩・物語・感情的な表現に豊かな才能があります。',
    '獅子座':'水星はコミュニケーション・思考スタイル・学習方法を司ります。獅子座の水星を持つあなたは、表現力と存在感ある語り口で人を惹きつけます。ストーリーテリングの才能があり、プレゼンテーションや舞台での言葉が輝きます。自分のアイデアへの自信と情熱があり、人を鼓舞するスピーチができます。承認欲求が思考にも表れ、「賞賛されたい」という動機が発言に影響することも。創造的な分野での思考・表現は特に輝きます。子どもや生徒を教えることにも天性の才があります。',
    '乙女座':'水星はコミュニケーション・思考スタイル・学習方法を司ります。水星は乙女座も支配する天体であり、ここに水星がある人は分析・整理・批判的思考の達人です。細部を見逃さない観察眼と、複雑な情報を整理して実用的な解決策に変換する能力があります。言葉の正確さにこだわり、あいまいな表現を嫌います。文章力・編集力・データ分析に特に優れています。批判的思考が強いため、自己批判や他者批判が過剰になることも。「完璧でなくても良い」という柔軟性が表現をさらに豊かにします。',
    '天秤座':'水星はコミュニケーション・思考スタイル・学習方法を司ります。天秤座の水星を持つあなたは、公平・バランス・美しさを思考の軸とします。あらゆる側面を検討してから判断する客観的な知性があり、弁護士や調停者のような論理展開が得意です。言葉が洗練されており、人を傷つけない表現方法を自然に選びます。優柔不断に見える決断の遅さは、全ての可能性を公平に評価しようとするがゆえです。芸術・美学・デザインについての深い審美眼と語彙を持ちます。',
    '蠍座':'水星はコミュニケーション・思考スタイル・学習方法を司ります。蠍座の水星を持つあなたは、表面の言葉の裏にある意図や感情を読み取る洞察力があります。心理学・オカルト・犯罪・権力構造など、隠されたものへの知的好奇心が強い。沈黙を戦略的に使い、少ない言葉で最大の影響を与えます。観察力が鋭く、嘘を見抜く直感があります。研究・調査・心理療法・探偵的な思考に向いています。秘密を守る力があり、深く信頼された人にのみ本音を見せます。',
    '射手座':'水星はコミュニケーション・思考スタイル・学習方法を司ります。射手座の水星を持つあなたの思考は大きな絵を描くビジョナリー型です。哲学・宗教・文化・法律・高等教育など、広大な知の領域を旅します。細部より全体像を重視し、楽観的な見通しで物事を語ります。言語習得・異文化理解・海外との知的交流に才能があります。細かい事実やデータを見落とす傾向があるため、専門家との連携が強みを活かす鍵になります。人々に可能性と希望を語る、インスピレーションの語り手です。',
    '山羊座':'水星はコミュニケーション・思考スタイル・学習方法を司ります。山羊座の水星を持つあなたの思考は構造的・現実的・長期的です。感情や直感より論理と実績を重視し、根拠のない主張を信用しません。言葉は慎重で、話す前に十分考えます。その分、発言の信頼性と重みがあります。ビジネス・政治・法律・工学などの実用的な分野での知性が光ります。ユーモアが控えめでまじめに見られることが多いですが、内側にはドライなウィットを持っています。',
    '水瓶座':'水星はコミュニケーション・思考スタイル・学習方法を司ります。水瓶座の水星を持つあなたは、時代の10年先を行く独創的な思考力を持ちます。常識の枠の外から問題を見る能力があり、誰も思いつかないような解決策を提案します。テクノロジー・科学・社会改革・人文科学への知的関心が強い。個人より集団・社会への思考の向き方が特徴的です。会話では突拍子もないアイデアを展開することがあり、周囲を驚かせます。未来を語るとき最も生き生きとする、ビジョナリーな知性です。',
    '魚座':'水星はコミュニケーション・思考スタイル・学習方法を司ります。魚座の水星を持つあなたの思考は論理より直感・イメージ・象徴で動きます。言語化しにくいものを詩・音楽・芸術・比喩で表現する才能があります。霊的・神秘的なテーマへの知的親和性が高く、スピリチュアルな洞察力があります。現実的な情報処理が苦手なことがあり、締め切りや細かいルールの管理が課題になることも。深い共感から生まれる言葉は人の心に直接触れる力を持ちます。夢からインスピレーションを受けることも多い。'
  },
  venus: {
    '牡羊座':'金星は愛・美・価値観・人間関係のスタイルを司ります。牡羊座の金星を持つあなたは恋愛において真っ先に動く勇敢な愛の戦士です。一目惚れしやすく、情熱的に追いかけることに恋の醍醐味を感じます。追われるより追う側に充実感を感じるため、関係が安定するとときめきが薄れることも。自分の欲求に正直で、気持ちを隠すのが苦手です。独占欲と嫉妬心もあります。パートナーにはあなたへの情熱と積極性を同じく求めます。恋愛に駆け引きを持ち込むより、素直な感情表現が関係を深めます。',
    '牡牛座':'金星は愛・美・価値観・人間関係のスタイルを司ります。金星は牡牛座を支配する天体であり、ここに金星がある人は愛と美の本質的な感覚を持っています。感覚的な喜び——美味しい食事・心地よい触感・音楽・自然の美しさ——を愛情と同様に大切にします。安定した愛を求め、ゆっくりと時間をかけて関係を深めます。物質的な豊かさと審美眼があり、本物だけを選ぶこだわりがあります。嫉妬心と独占欲が強い面がありますが、それは深い愛情の証です。一度愛したら長く誠実に愛し続けます。',
    '双子座':'金星は愛・美・価値観・人間関係のスタイルを司ります。双子座の金星を持つあなたは、知的な刺激と会話の妙を愛情の核心に置きます。頭が良くて面白い人に惹かれ、話していて飽きないパートナーを求めます。恋愛においても軽やかな変化と自由を愛し、束縛や重さを嫌います。複数の人を同時に好きになる浮気っぽい面がありますが、悪意はなく、ただ可能性に敏感なのです。友情から始まる恋愛が長続きしやすい。言葉・メッセージ・テキストが愛情表現の主要な手段です。',
    '蟹座':'金星は愛・美・価値観・人間関係のスタイルを司ります。蟹座の金星を持つあなたは、保護し包み込むような深い愛情スタイルを持ちます。パートナーのために料理を作る・環境を整える・感情的に寄り添うことが自然な愛情表現です。安心できる「家庭」的な関係を理想とし、感情的な安全が最も重要です。過去の恋愛の傷が現在の関係に影響しやすく、傷への防衛として殻に閉じこもることがあります。家族への愛情が深く、パートナーを「家族」として迎え入れるような愛し方をします。',
    '獅子座':'金星は愛・美・価値観・人間関係のスタイルを司ります。獅子座の金星を持つあなたの愛は劇的でロマンチック、映画のワンシーンのようです。パートナーを王様・女王様のように扱い、同じように特別な存在として大切にされることを求めます。称賛・プレゼント・サプライズ・ドラマチックな演出が愛情の言語です。プライドが高く、恥をかかされることを嫌います。惜しみなく愛情を与えますが、感謝と敬意が返ってこないと傷つきます。舞台のある場所——パーティー・レストラン・ドレスアップした空間——での恋愛が輝きます。',
    '乙女座':'金星は愛・美・価値観・人間関係のスタイルを司ります。乙女座の金星を持つあなたの愛情表現は細やかな気遣いと奉仕です。相手の健康を気にかける・スケジュールを調整する・実用的なサポートをする——こうした行動が最高の愛情の証です。理想が高く、パートナーに対して批判的になりすぎることが課題になることがあります。完璧な関係を追い求めるがゆえに、今目の前にある愛の良さを見落とすことも。身体的な清潔感・誠実さ・知的なやり取りが愛情の基盤となります。',
    '天秤座':'金星は愛・美・価値観・人間関係のスタイルを司ります。金星は天秤座を支配する天体であり、ここに金星がある人は美と愛に天性の感性を持ちます。調和・美しさ・対等なパートナーシップを恋愛の根幹に置きます。洗練された環境・芸術・音楽の中でロマンスが花開きます。公正で思いやりある関係を理想とし、一方的な負担や争いを嫌います。優柔不断に見えることもありますが、それはすべての可能性と相手の気持ちを配慮しているがゆえです。美しく調和のとれた愛の関係を創造する天性の才があります。',
    '蠍座':'金星は愛・美・価値観・人間関係のスタイルを司ります。蠍座の金星を持つあなたの愛は深く・激しく・全てを賭けるものです。全てか無か——中途半端な関係では満足できません。パートナーの魂の最も深い部分と繋がることを求めます。強い嫉妬心と独占欲がありますが、それは愛の深さの裏返しです。一度傷ついた信頼を取り戻すことは非常に困難です。性的な魅力と神秘的なオーラで相手を強く惹きつけます。愛と憎しみが表裏一体の、変容的な愛のエネルギーを持つ魂です。',
    '射手座':'金星は愛・美・価値観・人間関係のスタイルを司ります。射手座の金星を持つあなたは恋愛においても冒険者であり、哲学的な対話ができるパートナーを求めます。一緒に旅をし・学び・世界の見方を広げ合える関係が理想です。自由を束縛されることを何より嫌い、コミットメントに対して慎重になることがあります。明るく楽観的な愛情スタイルで、パートナーに笑いと冒険をもたらします。長距離恋愛や異文化のパートナーとの縁が生まれやすい。精神的な成長をもたらす関係に最も深い充足感を覚えます。',
    '山羊座':'金星は愛・美・価値観・人間関係のスタイルを司ります。山羊座の金星を持つあなたは愛において誠実・責任感・長期的コミットメントを最も重視します。恋愛は慎重に進め、簡単に心を開きません。しかし一度信頼した相手には深く誠実に愛し続けます。パートナーへの愛情は言葉より行動と実績で示すスタイルです。社会的な地位・安定・将来性をパートナー選びの基準に置くことがあります。年上・経験豊かな人に惹かれやすい傾向があります。時間とともに深まる、建築物のような愛の関係を築きます。',
    '水瓶座':'金星は愛・美・価値観・人間関係のスタイルを司ります。水瓶座の金星を持つあなたは友情を愛の基盤とし、知的な刺激と精神的な自由を最も重視します。「親友でもある恋人」が理想のパートナー像です。感情的な密着よりも、互いの個性と自由を尊重し合う関係を好みます。ユニークで個性的な人・社会的なビジョンを持つ人に惹かれます。感情表現が客観的で冷たく見られることもありますが、誰よりも人類と未来を愛する博愛的な心を持っています。型破りな恋愛形態にも抵抗がありません。',
    '魚座':'金星は愛・美・価値観・人間関係のスタイルを司ります。魚座の金星を持つあなたの愛は詩のように繊細で無条件です。スピリチュアルな繋がり・夢のようなロマンス・魂の深いところでの共鳴を求めます。恋愛において自己犠牲的になりやすく、相手を救おうとする「救済者願望」が出ることがあります。境界線を持つことを学ぶことが、健全な愛の鍵です。音楽・詩・映画・海辺などロマンチックな環境で恋が花開きます。幻想を現実に重ねてしまい傷つくことがありますが、その純粋さこそが最大の魅力です。'
  },
  mars: {
    '牡羊座':'火星は行動力・闘争心・欲求・セクシャリティを司ります。火星は牡羊座を支配しており、ここに火星がある人は生命エネルギーが最も純粋な形で表れます。圧倒的な行動力と瞬発力があり、思い立ったら即行動です。競争に燃え、困難な状況ほど闘志が湧きます。短期集中型で、長期の継続が課題になることも。怒りが爆発しやすいですが後を引きません。スポーツ・起業・緊急対応など、スピードと勇気が求められる場面で真価を発揮します。',
    '牡牛座':'火星は行動力・闘争心・欲求・セクシャリティを司ります。牡牛座の火星を持つあなたのエネルギーはゆっくりと確実に、しかし圧倒的な持続力を持ちます。一度動き出したら岩のように止まりません。物質的な豊かさ・快適な環境・肉体的な喜びに強い動機を感じます。怒りは溜め込みやすく、爆発すると手がつけられないほど激しくなります（「牛が暴れる」ように）。地道な積み重ねで着実に成果を出す能力があり、長期プロジェクトで真価を発揮します。',
    '双子座':'火星は行動力・闘争心・欲求・セクシャリティを司ります。双子座の火星を持つあなたのエネルギーは言葉・情報・知的競争を通じて表現されます。複数のプロジェクトを同時に走らせ、頭脳的に勝負する能力があります。言葉が武器であり、ディベートや交渉で力を発揮します。ただしエネルギーが分散しやすく、一つのことへの集中が課題です。アイデアの量は圧倒的で、スピーディな問題解決が得意。コミュニケーション・メディア・教育の分野で闘志を発揮します。',
    '蟹座':'火星は行動力・闘争心・欲求・セクシャリティを司ります。蟹座の火星を持つあなたの行動力は感情と直感によって駆動されます。大切な人や価値観を守るときに最大の闘志が湧き出ます。直接的な対立を好まず、間接的・戦略的に目標を達成します。感情状態が行動力に大きく影響し、感情が安定しているときほど効率的に動けます。家庭・育児・ケア・食に関わる仕事でエネルギーを発揮しやすい。過去へのこだわりを手放すことがエネルギーを解放します。',
    '獅子座':'火星は行動力・闘争心・欲求・セクシャリティを司ります。獅子座の火星を持つあなたのエネルギーは創造・表現・リーダーシップに向かいます。舞台の中心で輝き、人々を率いることに最大の動機を感じます。プライドが行動の重要なエンジンとなり、認められることで力が倍増します。劇的な表現とカリスマ性があり、人々を鼓舞するのが得意です。プライドが傷つくと過剰反応することも。創造的な競争・芸術・パフォーマンス・子育てに情熱的なエネルギーを注ぎます。',
    '乙女座':'火星は行動力・闘争心・欲求・セクシャリティを司ります。乙女座の火星を持つあなたのエネルギーは分析・改善・完成度の追求に向かいます。細部への注意と効率的な方法を常に探し、職人のような精度で仕事に取り組みます。批判的な目で問題を見つけ出す能力が強みですが、完璧主義が自分にも他者にも厳しくなることも。縁の下の力持ちとして組織を支え、地道に結果を積み上げます。健康管理・日常のルーティン・分析的な作業に最も適したエネルギーを持ちます。',
    '天秤座':'火星は行動力・闘争心・欲求・セクシャリティを司ります。天秤座の火星を持つあなたは直接的な対立を避け、外交的・戦略的に目標を達成します。公正さと正義感が行動の動機となり、不公正な状況に直面したときに真の闘志が湧きます。パートナーシップや協力関係を通じてエネルギーを発揮します。決断が遅くなる傾向がありますが、いったん決断するとバランスの取れた行動をとります。美・芸術・関係性に関わる分野で行動力が輝きます。',
    '蠍座':'火星は行動力・闘争心・欲求・セクシャリティを司ります。火星は伝統的に蠍座を支配しており、ここに火星がある人は深く・強烈で・戦略的な行動力を持ちます。秘密裏に計画を立て、圧倒的な集中力で目標を達成します。諦めという言葉を知らず、どんな障害も意志の力で乗り越えます。怒りを内に秘め、適切な時に解放します。性的なエネルギーと心理的な洞察力が強力な武器となります。変容・研究・心理・秘密の領域で最大の力を発揮します。',
    '射手座':'火星は行動力・闘争心・欲求・セクシャリティを司ります。射手座の火星を持つあなたのエネルギーは自由・冒険・理想の実現に向かって矢のように飛びます。大きな目標と楽観的なビジョンが行動の燃料です。哲学・旅・教育・スポーツ・異文化への情熱的なエネルギーがあります。細部と継続性が弱点になることがありますが、大局を動かす力は誰にも負けません。スタートのエネルギーが特に強く、先陣を切ることに向いています。笑いとユーモアを武器にする、楽観的な戦士です。',
    '山羊座':'火星は行動力・闘争心・欲求・セクシャリティを司ります。山羊座の火星を持つあなたは規律・持続・野心を行動の基盤とします。短期的な感情より長期的な目標を優先し、着実に階段を登っていく粘り強さがあります。プロフェッショナリズムへの誇りがあり、仕事への献身は他の追随を許しません。感情的なエネルギーの発散が少なく、静かに燃え続けるタイプ。権威・地位・社会的な認知を手に入れることで動機が高まります。時間とともに着実に結果を積み上げる、最強の長期戦士です。',
    '水瓶座':'火星は行動力・闘争心・欲求・セクシャリティを司ります。水瓶座の火星を持つあなたのエネルギーは革命・革新・集団への奉仕に向かいます。個人の利益より社会全体の変革に闘志を燃やします。既成概念や権威への反発心が行動の動機となることが多い。予測不可能なエネルギーの発散があり、突然行動を起こすことがあります。テクノロジー・社会運動・科学・人道支援の分野でエネルギーを最大限に発揮します。',
    '魚座':'火星は行動力・闘争心・欲求・セクシャリティを司ります。魚座の火星を持つあなたのエネルギーは直接的な行動より、直感・感情・精神的な衝動によって動きます。境界のない共感力が行動の動機となり、誰かを癒したい・助けたいという思いが最大の闘志を生み出します。芸術・音楽・精神的な実践・癒しの仕事でエネルギーが輝きます。明確な目標設定と計画が弱点になりやすいため、サポーターとの協力が力を引き出します。見えない世界の力を行動に変える、霊的な戦士です。'

// ===== CALCULATION ENGINE =====

function julianDay(year, month, day, hour=12) {
  if (month <= 2) { year--; month += 12; }
  const A = Math.floor(year / 100);
  const B = 2 - A + Math.floor(A / 4);
  return Math.floor(365.25 * (year + 4716)) + Math.floor(30.6001 * (month + 1)) + day + hour/24 + B - 1524.5;
}

function getSignFromDeg(deg) {
  const d = ((deg % 360) + 360) % 360;
  const idx = Math.floor(d / 30);
  return { sign: SIGNS[idx], degree: d % 30, index: idx };
}

function calcPlanetPositions(dateStr, timeStr, lonStr) {
  const [year, month, day] = dateStr.split('-').map(Number);
  const [h, m] = timeStr.split(':').map(Number);
  const [lon, lat] = lonStr.split(',').map(Number);
  const hour = h + m/60 - 9; // JST to UT
  const jd = julianDay(year, month, day, hour);
  const T = (jd - 2451545.0) / 36525; // Julian centuries from J2000

  // Simplified planet positions (mean longitude approximations)
  const planets = {};

  // Sun
  const L0 = 280.46646 + 36000.76983 * T;
  const M0 = 357.52911 + 35999.05029 * T - 0.0001537 * T * T;
  const Mrad = M0 * Math.PI / 180;
  const C = (1.914602 - 0.004817 * T) * Math.sin(Mrad) + 0.019993 * Math.sin(2*Mrad);
  planets.sun = ((L0 + C) % 360 + 360) % 360;

  // Moon (simplified)
  const Lm = 218.3165 + 481267.8813 * T;
  planets.moon = ((Lm + 6.289 * Math.sin((134.9634 + 477198.8676 * T) * Math.PI/180)) % 360 + 360) % 360;

  // Mercury
  planets.mercury = ((252.2509 + 149472.6746 * T) % 360 + 360) % 360;
  // Venus
  planets.venus = ((181.9798 + 58517.8156 * T) % 360 + 360) % 360;
  // Mars
  planets.mars = ((355.433 + 19140.2993 * T) % 360 + 360) % 360;
  // Jupiter
  planets.jupiter = ((34.351 + 3034.9057 * T) % 360 + 360) % 360;
  // Saturn
  planets.saturn = ((50.0774 + 1222.1138 * T) % 360 + 360) % 360;
  // Uranus
  planets.uranus = ((314.055 + 428.4748 * T) % 360 + 360) % 360;
  // Neptune
  planets.neptune = ((304.348 + 218.4862 * T) % 360 + 360) % 360;
  // Pluto (approximate)
  planets.pluto = ((238.928 + 144.9600 * T) % 360 + 360) % 360;

  // ASC calculation (simplified - based on sidereal time and latitude)
  const GMST = (280.46061837 + 360.98564736629 * (jd - 2451545)) % 360;
  const LMST = ((GMST + lon) % 360 + 360) % 360;
  const latRad = lat * Math.PI / 180;
  const e = 23.4393 * Math.PI / 180;
  const RAMCrad = LMST * Math.PI / 180;
  const ascRad = Math.atan2(Math.cos(RAMCrad), -(Math.sin(RAMCrad) * Math.cos(e) + Math.tan(latRad) * Math.sin(e)));
  planets.asc = ((ascRad * 180 / Math.PI) % 360 + 360) % 360;

  // Houses (Placidus simplified - equal house from ASC)
  planets.houses = [];
  for (let i = 0; i < 12; i++) {
    planets.houses.push(((planets.asc + i * 30) % 360 + 360) % 360);
  }

  return planets;
}

function getHouseNum(planetDeg, houses) {
  for (let i = 0; i < 12; i++) {
    const start = houses[i];
    const end = houses[(i+1) % 12];
    const pDeg = ((planetDeg % 360) + 360) % 360;
    if (start < end) {
      if (pDeg >= start && pDeg < end) return i + 1;
    } else {
      if (pDeg >= start || pDeg < end) return i + 1;
    }
  }
  return 1;
}

function calcAspects(p1, p2) {
  const aspects = [];
  const aspectDefs = [
    { name:'コンジャンクション', en:'Conjunction', orb:8, type:'conjunction', score:3 },
    { name:'トライン', en:'Trine', angle:120, orb:6, type:'trine', score:3 },
    { name:'セクスタイル', en:'Sextile', angle:60, orb:4, type:'sextile', score:2 },
    { name:'スクエア', en:'Square', angle:90, orb:6, type:'square', score:-2 },
    { name:'オポジション', en:'Opposition', angle:180, orb:8, type:'opposition', score:-1 }
  ];

  const planetKeys = ['sun','moon','mercury','venus','mars','jupiter','saturn'];

  planetKeys.forEach(pk => {
    planetKeys.forEach(pk2 => {
      if (pk === pk2) return;
      const deg1 = p1[pk];
      const deg2 = p2[pk2];
      if (deg1 === undefined || deg2 === undefined) return;

      aspectDefs.forEach(asp => {
        const angle = asp.angle || 0;
        const diff = Math.abs(((deg1 - deg2 + 180) % 360) - 180);
        const orb = Math.abs(diff - angle);
        if (orb <= asp.orb) {
          aspects.push({
            p1: pk, p2: pk2,
            aspect: asp, orb: orb.toFixed(1), score: asp.score
          });
        }
      });
    });
  });

  return aspects.slice(0, 12);
}

function renderWheel(pos) {
  const cx=120, cy=120, r=110, r2=85, r3=60;
  let svg = `<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">`;

  // Background
  svg += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="white" stroke="#e8e6e1" stroke-width="1"/>`;
  svg += `<circle cx="${cx}" cy="${cy}" r="${r2}" fill="none" stroke="#e8e6e1" stroke-width="0.5"/>`;
  svg += `<circle cx="${cx}" cy="${cy}" r="${r3}" fill="none" stroke="#e8e6e1" stroke-width="0.5"/>`;
  svg += `<circle cx="${cx}" cy="${cy}" r="4" fill="#1a1a1a"/>`;

  // 12 divisions
  for (let i=0; i<12; i++) {
    const angle = (i*30 - 90) * Math.PI/180;
    svg += `<line x1="${cx+r3*Math.cos(angle)}" y1="${cy+r3*Math.sin(angle)}" x2="${cx+r*Math.cos(angle)}" y2="${cy+r*Math.sin(angle)}" stroke="#e8e6e1" stroke-width="0.5"/>`;
    // Sign symbol
    const midAngle = ((i+0.5)*30-90)*Math.PI/180;
    const tx = cx+(r2+12)*Math.cos(midAngle);
    const ty = cy+(r2+12)*Math.sin(midAngle)+4;
    svg += `<text x="${tx}" y="${ty}" text-anchor="middle" font-size="10" fill="#9a9a9a">${SIGNS[i].symbol}</text>`;
  }

  // Planet positions
  const ascDeg = pos.asc;
  PLANETS.forEach(p => {
    const pDeg = pos[p.key];
    const angleDeg = pDeg - ascDeg - 90;
    const angleRad = angleDeg * Math.PI/180;
    const px = cx + (r3-18)*Math.cos(angleRad);
    const py = cy + (r3-18)*Math.sin(angleRad);
    svg += `<text x="${px}" y="${py+4}" text-anchor="middle" font-size="11" fill="${p.color}">${p.symbol}</text>`;
  });

  svg += '</svg>';
  return svg;
}

    </div>
    <div class="pd-text">${meaning}</div>
    <div style="background:rgba(0,0,0,0.03);border-left:3px solid ${planet.color};padding:12px 14px;margin-bottom:14px;border-radius:0 4px 4px 0;">
      <div style="font-size:11px;font-weight:700;color:#4a4a4a;margin-bottom:5px;letter-spacing:.1em;">第${house}ハウス（${houseInfo.theme}）での表現</div>
      <div style="font-size:13px;color:#5a5a5a;line-height:1.8;">${houseDetail}</div>
    </div>
    <div class="pd-keywords">
      ${signInfo?.element ? `<div class="pd-kw">${signInfo.element}エレメント</div>` : ''}
      ${signInfo?.modality ? `<div class="pd-kw">${signInfo.modality}</div>` : ''}
      <div class="pd-kw">第${house}H · ${houseInfo.keyword}</div>
      <div class="pd-kw">${planet.name}</div>
    </div>
  `;
  detail.classList.add('show');
  detail.scrollIntoView({behavior:'smooth', block:'nearest'});
}

function renderCompat(nameA, nameB, posA, posB) {
  const aspects = calcAspects(posA, posB);
  const totalScore = aspects.reduce((sum, a) => sum + a.score, 0);
  const maxScore = aspects.length * 3;
  const compatPct = Math.min(100, Math.max(20, Math.round(50 + (totalScore / Math.max(maxScore, 1)) * 50)));

  const verdicts = [
    [85, '魂の伴侶', '深い運命的な繋がり。天体レベルで共鳴し合っています。'],
    [70, '深い縁', '強い引き合いと相互理解がある関係。長期的な絆を築けます。'],
    [55, '成長し合う関係', '刺激し合い、互いを高め合う関係。努力で深められます。'],
    [40, '学びの関係', '課題はありますが、それが成長の糧になります。'],
    [0, '挑戦的な縁', '違いが大きいが、乗り越えることで強い絆が生まれます。']
  ];
  const [, verdict, desc] = verdicts.find(([threshold]) => compatPct >= threshold);

  const sunA = getSignFromDeg(posA.sun);
  const sunB = getSignFromDeg(posB.sun);
  const moonA = getSignFromDeg(posA.moon);
  const moonB = getSignFromDeg(posB.moon);

  const aspectMeanings = {
    conjunction: '同じエネルギーで強く共鳴します',
    trine: '自然なハーモニーと相互理解',
    sextile: '互いを支え合う友好的な関係',
    square: '刺激と緊張。成長を促す課題',
    opposition: '引き合いつつも視点の違いがある'
  };

  let html = `
    <div class="section">
      <div class="section-header">
        <div class="section-title">${nameA} <em>×</em> ${nameB}</div>
        <div class="section-line"></div>
      </div>
      <div class="compat-score">
        <div class="compat-num">${compatPct}</div>
        <div class="compat-unit">%</div>
        <div class="compat-right">
          <div class="compat-verdict">${verdict}</div>
          <div class="compat-sub">${desc}</div>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-header">
        <div class="section-title">Big 3 <em>Comparison</em></div>
        <div class="section-line"></div>
      </div>
      <div class="big3" style="grid-template-columns:1fr 1fr;margin-bottom:32px">
        <div class="big3-item">
          <div class="big3-label">${nameA} · 太陽</div>
          <div class="big3-symbol">${sunA.sign.symbol}</div>
          <div class="big3-name">${sunA.sign.name}</div>
        </div>
        <div class="big3-item">
          <div class="big3-label">${nameB} · 太陽</div>
          <div class="big3-symbol">${sunB.sign.symbol}</div>
          <div class="big3-name">${sunB.sign.name}</div>
        </div>
        <div class="big3-item">
          <div class="big3-label">${nameA} · 月</div>
          <div class="big3-symbol">${moonA.sign.symbol}</div>
          <div class="big3-name">${moonA.sign.name}</div>
        </div>
        <div class="big3-item">
          <div class="big3-label">${nameB} · 月</div>
          <div class="big3-symbol">${moonB.sign.symbol}</div>
          <div class="big3-name">${moonB.sign.name}</div>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-header">
        <div class="section-title">Synastry <em>Aspects</em></div>
        <div class="section-line"></div>
      </div>
      <div class="compat-aspects">
        ${aspects.length === 0 ? '<div style="padding:20px;color:#9a9a9a;font-size:13px">主要なアスペクトは見つかりませんでした。</div>' :
          aspects.map(a => {
            const p1 = PLANETS.find(p => p.key === a.p1);
            const p2 = PLANETS.find(p => p.key === a.p2);
            return `<div class="compat-aspect-row">
              <div class="asp-dot asp-${a.aspect.type}"></div>
              <div class="asp-planets">${p1.symbol}${p1.name} × ${p2.symbol}${p2.name}</div>
              <div class="asp-type">${a.aspect.name}</div>
              <div class="asp-meaning">${aspectMeanings[a.aspect.type]}</div>
            </div>`;
          }).join('')
        }
      </div>
    </div>

    <button class="reset-btn" onclick="resetResult()">— Reset —</button>
    <div class="footer-note">※ 出生時刻が不明な場合は12:00で計算しています。シナストリーは参考値です。</div>
  `;

  document.getElementById('resultWrap').innerHTML = html;
}

function resetResult() {
  document.getElementById('resultWrap').classList.remove('show');
  document.getElementById('resultWrap').innerHTML = '';
  window.scrollTo({ top:0, behavior:'smooth' });
}
</script>
</body>
</html>
