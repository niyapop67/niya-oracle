<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>タロット占い｜Tarot Oracle</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=M+PLUS+Rounded+1c:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f5f0e8;
  --bg2: #ede8dc;
  --frost: #1a0f00;
  --frost2: #2a1a00;
  --ink: #0f0800;
  --ink-mid: #3a2800;
  --ink-light: #5a4010;
  --silver: #4a3800;
  --silver-light: #3a2800;
  --silver-dim: rgba(80,60,20,0.15);
  --rune-gold: #7a5800;
  --ice: #e8f0dc;
  --border: rgba(120,90,30,0.35);
  --parchment: #1a0f00;
  --parchment2: #2a1800;
  --gold: #7a5800;
  --gold-light: #9a7010;
  --gold-dim: rgba(122,88,0,0.15);
  --red: #8b1a1a;
  --red-light: #c03020;
  --cream: #f5f0e8;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: var(--bg);
  color: var(--frost);
  font-family: 'Noto Sans JP', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px),
    repeating-linear-gradient(90deg, transparent, transparent 2px, rgba(0,0,0,0.02) 2px, rgba(0,0,0,0.02) 4px);
  pointer-events: none;
  z-index: 100;
}

.bg-wrap {
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 70% 50% at 50% 0%, rgba(201,151,58,0.12) 0%, transparent 60%),
    radial-gradient(ellipse 40% 60% at 10% 100%, rgba(139,26,26,0.1) 0%, transparent 60%),
    radial-gradient(ellipse 40% 40% at 90% 80%, rgba(201,151,58,0.06) 0%, transparent 60%),
    var(--bg);
  z-index: 0;
  pointer-events: none;
}

.container {
  position: relative;
  z-index: 1;
  max-width: 760px;
  margin: 0 auto;
  padding: 52px 24px 80px;
}

.header { text-align: center; margin-bottom: 40px; }
.header-emblem { font-size: 48px; margin-bottom: 16px; animation: floatEmb 5s ease-in-out infinite; display: block; }
@keyframes floatEmb { 0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);} }
.header-rule { display: flex; align-items: center; gap: 0; margin: 0 auto 16px; width: 320px; }
.rule-line { flex:1; height:1px; background: linear-gradient(to right, transparent, var(--gold)); }
.rule-line.r { background: linear-gradient(to left, transparent, var(--gold)); }
.rule-center { padding: 0 14px; font-family: 'M PLUS Rounded 1c', sans-serif; font-size: 18px; color: var(--gold); }
h1 { font-family: 'Space Grotesk', sans-serif; font-size: clamp(26px, 6vw, 44px); color: var(--gold-light); letter-spacing: 0.12em; line-height: 1.2; margin-bottom: 8px; text-shadow: 0 0 40px rgba(232,192,104,0.3); }
.header-sub { font-family: 'Space Grotesk', sans-serif; font-style: italic; font-size: 14px; color: var(--ink-light); letter-spacing: 0.04em; }

.section-heading { font-family: 'M PLUS Rounded 1c', sans-serif; font-size: 11px; letter-spacing: 0.35em; color: var(--gold); text-transform: uppercase; text-align: center; margin-bottom: 16px; opacity: 0.8; }

/* Consultation form */
.consult-section { margin-bottom: 32px; background: rgba(255,252,245,0.85); border: 1px solid var(--border); padding: 24px 22px; }
.field-group { margin-bottom: 20px; }
.field-group:last-child { margin-bottom: 0; }
.q-label { font-family: 'M PLUS Rounded 1c', sans-serif; font-size: 11px; letter-spacing: 0.08em; color: var(--gold); text-transform: uppercase; margin-bottom: 10px; opacity: 0.9; display:block; }
.theme-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px,1fr)); gap: 8px; }
.theme-btn { background: rgba(255,255,255,0.7); border: 1px solid var(--border); color: var(--ink); font-family: 'Noto Sans JP', sans-serif; font-size: 12.5px; padding: 10px 8px; cursor: pointer; transition: all 0.2s; border-radius: 4px; text-align: center; }
.theme-btn:hover { border-color: var(--gold); }
.theme-btn.active { background: var(--gold-dim); border-color: var(--gold); color: var(--gold-light); font-weight: 700; }
textarea, input[type=text] { width: 100%; background: rgba(255,255,255,0.7); border: 1px solid var(--border); color: var(--frost); font-family: 'Noto Sans JP', sans-serif; font-size: 14px; padding: 14px 16px; resize: vertical; outline: none; line-height: 1.8; transition: border-color 0.3s; border-radius: 4px; }
textarea { min-height: 90px; }
textarea::placeholder, input::placeholder { color: var(--ink-light); opacity:0.7; }
textarea:focus, input:focus { border-color: rgba(122,88,0,0.6); }
.optional-note { font-size: 11px; color: var(--ink-light); margin-top: 6px; opacity:0.75; }
.form-error { font-size: 12px; color: var(--red-light); margin-top: 8px; display:none; }
.form-error.show { display:block; }

.draw-wrap { text-align: center; margin-bottom: 40px; }
.draw-btn { background: transparent; border: 1px solid var(--gold); color: var(--gold-light); font-family: 'Space Grotesk', sans-serif; font-size: 16px; letter-spacing: 0.04em; padding: 18px 72px; cursor: pointer; position: relative; overflow: hidden; transition: all 0.4s; }
.draw-btn::before { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(201,151,58,0.2), rgba(139,26,26,0.2)); transform: scaleX(0); transform-origin: left; transition: transform 0.4s; }
.draw-btn:hover::before { transform: scaleX(1); }
.draw-btn:hover { box-shadow: 0 0 30px rgba(201,151,58,0.2); }
.draw-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.draw-btn span { position: relative; z-index: 1; }

.shuffling { display: none; flex-direction: column; align-items: center; gap: 12px; margin: 16px 0; }
.shuffling.show { display: flex; }
.shuffle-cards { display: flex; gap: -8px; }
.sh-card { width: 28px; height: 44px; background: linear-gradient(135deg, var(--bg2), rgba(201,151,58,0.1)); border: 1px solid var(--border); border-radius: 2px; animation: shuffle 0.8s ease-in-out infinite; margin: 0 2px; }
.sh-card:nth-child(2) { animation-delay: 0.15s; }
.sh-card:nth-child(3) { animation-delay: 0.3s; }
@keyframes shuffle { 0%,100%{transform:translateY(0) rotate(0deg);} 25%{transform:translateY(-8px) rotate(-5deg);} 75%{transform:translateY(-4px) rotate(3deg);} }
.shuffle-text { font-family: 'Space Grotesk', sans-serif; font-style: italic; font-size: 13px; color: var(--ink-light); letter-spacing: 0.02em; }

.result-wrap { opacity: 0; transform: translateY(20px); transition: all 0.8s ease; pointer-events: none; }
.result-wrap.show { opacity: 1; transform: translateY(0); pointer-events: auto; }

.question-echo { background: rgba(26,18,8,0.06); border-left: 3px solid var(--gold); padding: 12px 16px; margin-bottom: 24px; font-size: 13px; color: var(--ink-mid); line-height:1.7; }
.question-echo b { color: var(--gold-light); background: rgba(26,18,8,0.85); padding:1px 6px; border-radius:3px; font-weight:600; }

.spread-layout { display: flex; flex-direction: column; gap: 8px; margin-bottom: 28px; }
.card-list-item { display: flex; align-items: center; gap: 14px; background: rgba(255,252,245,0.8); border: 1px solid var(--border); border-radius: 6px; padding: 14px 18px; cursor: pointer; transition: all 0.2s; }
.card-list-item:hover { background: rgba(201,151,58,0.08); border-color: var(--gold); }
.card-list-item.selected { background: rgba(201,151,58,0.12); border-color: var(--gold); border-left: 3px solid var(--gold); }
.card-list-position { font-size: 11px; color: var(--gold); font-weight: 700; letter-spacing: 0.05em; min-width: 60px; flex-shrink: 0; }
.card-list-name { font-family: 'Noto Serif JP', serif; font-size: 17px; color: var(--ink); font-weight: 500; flex: 1; }
.card-list-sub { font-size: 11px; color: var(--ink-mid); font-style: italic; }
.card-list-rev { font-size: 11px; color: #7a5800; background: rgba(201,151,58,0.15); border: 1px solid rgba(201,151,58,0.4); border-radius: 3px; padding: 1px 8px; flex-shrink: 0; font-weight: 600; }
.card-list-arrow { font-size: 14px; color: var(--gold); flex-shrink: 0; opacity: 0.6; }

.card-detail { background: rgba(250,246,238,0.97); border: 1px solid var(--border); padding: 32px; margin-bottom: 16px; position: relative; }
.card-detail::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(to right, transparent, var(--gold), transparent); }
.card-detail::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 2px; background: linear-gradient(to right, transparent, var(--gold), transparent); }
.detail-head { margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid rgba(201,151,58,0.3); }
.detail-position { font-family: 'M PLUS Rounded 1c', sans-serif; font-size: 10px; letter-spacing: 0.08em; color: var(--gold); margin-bottom: 6px; text-transform: uppercase; font-weight: 700; }
.detail-card-title { font-family: 'Space Grotesk', sans-serif; font-size: 20px; color: var(--gold-light); margin-bottom: 4px; letter-spacing: 0.05em; }
.detail-card-sub { font-family: 'Space Grotesk', sans-serif; font-style: italic; font-size: 13px; color: var(--ink-mid); letter-spacing: 0.01em; }
.reversed-label { display: inline-block; margin-top: 6px; font-family: 'Space Grotesk', sans-serif; font-style: italic; font-size: 12px; color: #6b4c00; background: rgba(201,151,58,0.15); border: 1px solid rgba(201,151,58,0.5); padding: 2px 10px; border-radius: 3px; }
.detail-keywords { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
.kw-tag { font-family: 'Space Grotesk', sans-serif; font-size: 12px; color: #5a3c00; background: rgba(201,151,58,0.1); border: 1px solid rgba(201,151,58,0.4); padding: 4px 12px; border-radius: 4px; letter-spacing: 0.01em; font-weight: 600; }
.kw-tag.rev { color: var(--red-light); border-color: rgba(192,57,43,0.3); }
.detail-sec-label { font-family: 'M PLUS Rounded 1c', sans-serif; font-size: 10px; letter-spacing: 0.08em; color: var(--gold); text-transform: uppercase; font-weight: 700; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
.detail-sec-label::after { content: ''; flex: 1; height: 1px; background: linear-gradient(to right, rgba(201,151,58,0.2), transparent); }
.detail-text { font-size: 14px; line-height: 2; color: var(--ink); margin-bottom: 20px; }
.oracle-box { background: linear-gradient(135deg, rgba(201,151,58,0.08), rgba(139,26,26,0.08)); border: 1px solid rgba(201,151,58,0.2); border-left: 3px solid var(--gold); padding: 18px 20px; margin-top: 4px; }
.oracle-text { font-family: 'Space Grotesk', sans-serif; font-style: italic; font-size: 15px; line-height: 1.9; color: var(--frost); }

.summary-card { background: rgba(26,18,8,0.92); border: 1px solid var(--border); padding: 28px 32px; margin-bottom: 20px; }
.summary-title { font-family: 'Space Grotesk', sans-serif; font-size: 16px; color: var(--gold-light); letter-spacing: 0.01em; margin-bottom: 16px; text-align: center; }
.summary-text { font-size: 14px; line-height: 2.1; color: rgba(245,230,200,0.9); }
.summary-block { margin-bottom: 16px; }
.summary-block:last-child { margin-bottom: 0; }
.summary-block-label { font-family: 'M PLUS Rounded 1c', sans-serif; font-size: 10.5px; letter-spacing: 0.1em; color: var(--gold-light); text-transform: uppercase; margin-bottom: 6px; opacity: 0.9; }
.advice-list { list-style: none; padding: 0; }
.advice-list li { padding: 4px 0 4px 18px; position: relative; color: rgba(245,230,200,0.9); font-size: 14px; line-height: 1.9; }
.advice-list li::before { content: '✦'; position: absolute; left: 0; color: var(--gold-light); font-size: 11px; }

.again-wrap { text-align: center; margin-top: 28px; }
.again-btn { background: none; border: 1px solid var(--border); color: var(--ink-light); font-family: 'M PLUS Rounded 1c', sans-serif; font-size: 13px; letter-spacing: 0.04em; padding: 12px 40px; cursor: pointer; transition: all 0.3s; }
.again-btn:hover { border-color: var(--gold); color: var(--gold); }
.meta-note { font-family: 'Space Grotesk', sans-serif; font-size: 10px; color: var(--ink-light); text-align: center; margin-top: 14px; opacity: 0.5; }

.footer-note { font-family: 'Space Grotesk', sans-serif; font-style: italic; font-size: 11px; color: var(--ink-light); text-align: center; margin-top: 48px; opacity: 0.5; letter-spacing: 0.01em; }

@media (max-width: 540px) {
  .card-detail { padding: 20px 16px; }
  .summary-card { padding: 20px; }
}
</style>
</head>
<body>

<div class="bg-wrap"></div>

<div class="container">

  <div class="header">
    <span class="header-emblem">🔮</span>
    <div class="header-rule">
      <div class="rule-line"></div>
      <div class="rule-center">✦</div>
      <div class="rule-line r"></div>
    </div>
    <h1>Tarot Oracle</h1>
    <div class="header-sub">タロット神託 · 過去・現在・未来の3枚が語る、あなたの相談への答え</div>
  </div>

  <div class="consult-section" id="consultSection">
    <div class="section-heading">— Consultation · 相談内容 —</div>

    <div class="field-group">
      <label class="q-label">テーマを選ぶ（必須）</label>
      <div class="theme-grid" id="themeGrid"></div>
    </div>

    <div class="field-group">
      <label class="q-label">質問内容（必須）</label>
      <textarea id="questionInput" placeholder="例：最近LINEの返信が遅くなりました。相手は私をどう思っていますか？"></textarea>
    </div>

    <div class="field-group">
      <label class="q-label">補足（任意）</label>
      <input type="text" id="contextInput" placeholder="関係性や背景など、あれば">
      <div class="optional-note">相談の判断に必要な範囲で構いません。無理に入力する必要はありません。</div>
    </div>

    <div class="form-error" id="formError">テーマの選択と質問内容の入力が必要です。</div>
  </div>

  <div class="draw-wrap">
    <button class="draw-btn" id="drawBtn" onclick="handleDraw()">
      <span>✦ カードを引く ✦</span>
    </button>
    <div class="shuffling" id="shuffling">
      <div class="shuffle-cards">
        <div class="sh-card"></div><div class="sh-card"></div><div class="sh-card"></div>
        <div class="sh-card"></div><div class="sh-card"></div>
      </div>
      <div class="shuffle-text">カードをシャッフルしています…</div>
    </div>
  </div>

  <div class="result-wrap" id="resultWrap">
    <div class="question-echo" id="questionEcho"></div>
    <div class="spread-layout" id="spreadLayout"></div>
    <div id="detailArea"></div>
    <div class="summary-card" id="summaryCard"></div>
    <div class="again-wrap">
      <button class="again-btn" onclick="resetReading()">✦ Reset · 新しい相談で引き直す ✦</button>
    </div>
    <div class="meta-note" id="metaNote"></div>
  </div>

  <div class="footer-note">タロットは内なる知恵を引き出す鏡です。断定ではなく、気づきのための道具として受け取ってください。</div>
</div>

<script>
/* =========================================================
   NIYA ORACLE — TAROT ENGINE (rule-based contextual layer)
   Spec version: 01_TAROT_ENGINE_IMPLEMENTATION_SPEC v1.1
   Scope of this pass:
     - consultation intake (theme + question, required)
     - deterministic seeded draw (reading is immutable once drawn)
     - position/theme-aware contextual interpretation
       (template composition over existing keyword/base-text data,
        NOT hand-authored 78-card TarotMeaning objects — see spec §36)
     - three-card relationship synthesis
     - direct-answer structure (結論 → 理由 → どうするか)
   Out of scope for this pass (unchanged from spec §32):
     - Celtic Cross / Love spread / other multi-card spreads
     - true AI-generated interpretation (spec §04) — this is the
       deterministic template layer that would sit *underneath* it
     - PDF generation, human review workflow, Coconala delivery
   ========================================================= */

// ---------- MVP THEMES (spec §10) ----------
const THEMES = [
  { id: 'love', label: '恋愛' },
  { id: 'unrequited_love', label: '片思い' },
  { id: 'reconciliation', label: '復縁' },
  { id: 'feelings', label: '相手の気持ち' },
  { id: 'relationship', label: '人間関係' },
  { id: 'work', label: '仕事' },
  { id: 'career_change', label: '転職' },
  { id: 'future_direction', label: '今後の方向性' },
  { id: 'self_understanding', label: '自己理解' },
  { id: 'other', label: 'その他' },
];

let selectedTheme = null;

function renderThemeGrid() {
  const grid = document.getElementById('themeGrid');
  grid.innerHTML = THEMES.map(t =>
    `<button type="button" class="theme-btn" data-theme="${t.id}" onclick="selectTheme('${t.id}', this)">${t.label}</button>`
  ).join('');
}

function selectTheme(id, btn) {
  selectedTheme = id;
  document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('formError').classList.remove('show');
}

// ---------- CARD MASTER DATA ----------
// id scheme: stable slug (spec §3 / §5). Position/orientation are
// NOT stored on the card — they belong to the drawn result (spec §22).

const majorArcana = [
  { id:'the_fool', name:'愚者', en:'The Fool', suit:'major', symbol:'🌟',
    keywords:['新しい始まり','自由','冒険','無邪気さ'],
    revKeywords:['無謀','無責任','方向性の欠如'],
    upright:'新たな出発を告げるカード。純粋な心で一歩を踏み出す時が来ています。恐れを手放し、直感を信じて進みましょう。過去の経験や常識にとらわれず、白紙の状態で物事を見ることが重要です。',
    reversed:'方向性を見失っている状態。無謀な行動や無責任さへの警告。今は立ち止まり、本当に進むべき道を見直す時です。',
    oracle:'宇宙はあなたの新しい冒険を支援しています。軽やかな心で歩み出しなさい。'
  },
  { id:'the_magician', name:'魔術師', en:'The Magician', suit:'major', symbol:'⚡',
    keywords:['意志力','スキル','創造力','行動'],
    revKeywords:['未熟さ','操作','スキル不足'],
    upright:'あなたはすべての道具を持っています。意志と行動力で夢を現実に変える時です。あなたの能力と才能は今まさに開花しようとしています。目標を明確にして動きましょう。',
    reversed:'才能が活かしきれていない、または操作的な行動への警告。誠実に自分の力を使うことが大切です。',
    oracle:'あなたの中に全ての力があります。今こそその力を解き放つ時です。'
  },
  { id:'the_high_priestess', name:'女教皇', en:'The High Priestess', suit:'major', symbol:'🌙',
    keywords:['直感','神秘','内なる知恵','秘密'],
    revKeywords:['隠された真実','直感無視','表面的判断'],
    upright:'深い直感と内なる知恵が答えを持っています。今は外よりも内側に目を向ける時。静寂の中に真実があります。他者の意見より自分の内なる声を信頼してください。',
    reversed:'表面的な情報に惑わされている。直感を無視することへの警告。真実が隠されている可能性があります。',
    oracle:'月の光のように、真実は闇の中にこそ輝いています。静かに耳を澄ませなさい。'
  },
  { id:'the_empress', name:'女帝', en:'The Empress', suit:'major', symbol:'🌺',
    keywords:['豊かさ','創造性','母性','自然'],
    revKeywords:['停滞','依存','創造力の枯渇'],
    upright:'豊かさと創造の最高の時。あなたの愛と創造力が花開いています。新しいプロジェクト、妊娠、芸術活動など実りある展開が訪れます。自然の流れに従い、愛を注いでください。',
    reversed:'創造的なエネルギーが枯渇している状態。過保護や依存関係にも注意が必要です。',
    oracle:'大地のように豊かに、花のように咲き誇りなさい。あなたは愛そのものです。'
  },
  { id:'the_emperor', name:'皇帝', en:'The Emperor', suit:'major', symbol:'👑',
    keywords:['権威','秩序','安定','リーダーシップ'],
    revKeywords:['専制','硬直','権力乱用'],
    upright:'安定と秩序を象徴するカード。計画を立て、規律を持って行動する時です。リーダーシップを発揮し、しっかりとした基盤を築いてください。論理的で戦略的なアプローチが成功をもたらします。',
    reversed:'権威の乱用や頑固さへの警告。柔軟性を持ち、他者の意見も聞き入れましょう。',
    oracle:'強固な意志と穏やかな心。真のリーダーシップとはこの二つを兼ね備えることです。'
  },
  { id:'the_hierophant', name:'教皇', en:'The Hierophant', suit:'major', symbol:'⛪',
    keywords:['伝統','教育','信念','精神的指導'],
    revKeywords:['因習打破','反抗','自由な思想'],
    upright:'伝統と精神的な教えに従う時。師や先人の知恵を借りることが重要です。信念体系を確認し、精神的な基盤を固めてください。信頼できるアドバイザーに相談することも吉です。',

// ---------- SEEDED RNG (spec §27 — seed + deck = same three cards) ----------
function mulberry32(seed) {
  return function() {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function seededShuffle(arr, rng) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ---------- READING STATE (immutable once drawn — spec §28/29) ----------
let currentReading = null; // { readingId, seed, consultation, cards: [{position, card, reversed}] }
let selectedCardIndex = 0;

function makeReadingId() {
  return 'rd_' + Date.now().toString(36) + '_' + Math.floor(Math.random()*1e6).toString(36);
}

function handleDraw() {
  const question = document.getElementById('questionInput').value.trim();
  const context = document.getElementById('contextInput').value.trim();
  const errEl = document.getElementById('formError');

  if (!selectedTheme || !question) {
    errEl.classList.add('show');
    errEl.scrollIntoView({ behavior:'smooth', block:'center' });
    return;
  }
  errEl.classList.remove('show');

  const btn = document.getElementById('drawBtn');
  const shuf = document.getElementById('shuffling');
  const wrap = document.getElementById('resultWrap');
  btn.disabled = true;
  shuf.classList.add('show');
  wrap.classList.remove('show');

  setTimeout(() => {
    // CREATED -> DRAWN (spec §29): the draw is the source of truth and
    // is never regenerated by the interpretation layer (spec §28/31).
    const seed = Math.floor(Math.random() * 2147483647);
    const rng = mulberry32(seed);
    const shuffled = seededShuffle(allCards, rng);

    const cards = SPREAD_POSITIONS.map((pos, i) => ({
      position: pos.key,
      positionLabel: pos.label,
      cardId: shuffled[i].id,
      card: shuffled[i],
      orientation: rng() < 0.3 ? 'reversed' : 'upright'
    }));

    currentReading = {
      readingId: makeReadingId(),
      seed,
      consultation: { theme: selectedTheme, question, context },
      cards,
      createdAt: new Date().toISOString()
    };
    selectedCardIndex = 0;

    renderQuestionEcho();
    renderSpread();
    renderDetail(0);
    renderSynthesis();

    shuf.classList.remove('show');
    wrap.classList.add('show');
    btn.disabled = false;
    document.getElementById('metaNote').textContent =
      `reading ${currentReading.readingId} · seed ${seed} · この結果は固定されており、引き直すまで変わりません`;
    wrap.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, 2200);
}

function renderQuestionEcho() {
  const { theme, question, context } = currentReading.consultation;
  const themeLabel = THEMES.find(t => t.id === theme)?.label || theme;
  document.getElementById('questionEcho').innerHTML =
    `テーマ：<b>${themeLabel}</b><br>ご相談：${escapeHtml(question)}` +
    (context ? `<br>補足：${escapeHtml(context)}` : '');
}

function renderSpread() {
  const layout = document.getElementById('spreadLayout');
  layout.innerHTML = currentReading.cards.map((dc, i) => `
    <div class="card-list-item ${i === 0 ? 'selected' : ''}" onclick="selectCard(${i})">
      <div class="card-list-position">${dc.positionLabel}</div>
      <div class="card-list-name">${dc.card.name}</div>
      <div class="card-list-sub">${dc.card.en}</div>
      ${dc.orientation === 'reversed' ? '<div class="card-list-rev">逆位置</div>' : ''}
      <div class="card-list-arrow">›</div>

}

function selectCard(i) {
  selectedCardIndex = i;
  document.querySelectorAll('.card-list-item').forEach((el, idx) => {
    el.classList.toggle('selected', idx === i);
  });
  renderDetail(i);
}

// ---------- CONTEXTUAL INTERPRETATION (spec §12 — "here", not "generally") ----------
function buildContextualInterpretation(dc, theme) {
  const c = dc.card;
  const rev = dc.orientation === 'reversed';
  const base = rev ? c.reversed : c.upright;
  const posPhrase = POSITION_PHRASES[dc.position][rev ? 'reversed' : 'upright'];
  const domainLabel = THEME_DOMAIN_LABEL[theme] || '今回の相談';

  return `${posPhrase}${domainLabel}について、このカードは${rev ? 'その根底にある' : ''}次のような状態を映し出しています。${base}`;
}

function renderDetail(i) {
  const dc = currentReading.cards[i];
  const c = dc.card;
  const rev = dc.orientation === 'reversed';
  const detail = document.getElementById('detailArea');
  const contextual = buildContextualInterpretation(dc, currentReading.consultation.theme);

  detail.innerHTML = `
    <div class="card-detail">
      <div class="detail-head">
        <div class="detail-position">${dc.positionLabel} · ${c.suit === 'major' ? '大アルカナ' : c.suitName}</div>

      </div>

// ---------- THREE-CARD SYNTHESIS (spec §16/18) ----------
function detectFlowType(cards) {
  const revFlags = cards.map(c => c.orientation === 'reversed');
  const revCount = revFlags.filter(Boolean).length;

  if (revCount === 0) return 'escalation';       // 全て正位置 → 素直な発展
  if (revCount === 3) return 'warning';          // 全て逆位置 → 強い警告
  if (revFlags[0] && !revFlags[2]) return 'resolution'; // 過去が重く未来が正 → 解決に向かう
  if (!revFlags[0] && revFlags[2]) return 'contrast';   // 過去が正で未来が逆 → 現状への警告
  return 'shift'; // その他は転換
}

function suitCounts(cards) {
  const counts = {};
  cards.forEach(dc => {
    const s = dc.card.suit;
    if (s === 'major') return;
    counts[s] = (counts[s] || 0) + 1;
  });
  return counts;
}

    feelings: ['相手の気持ちを断定するより、次に自然に確認できる場面を一つ想定しておいてください。', '相手の態度の変化を、あなた自身の状態と切り離して観察してみましょう。'],
    relationship: ['相手を変えようとするより、自分がどこまで関わるかの境界線を先に決めておくと楽になります。', '一度、相手に直接伝えるべきことと、伝えなくてもいいことを分けてみてください。'],
    work: ['感情的な判断を急がず、まず現状の事実関係（役割・評価・条件）を書き出してみてください。', '相談できる相手が社内・社外にいるか、選択肢を狭める前に確認しておきましょう。'],
    career_change: ['今の職場に足りないものと、転職先に本当に求めるものを分けて書き出してみてください。', '結論を急がず、まず情報収集（求人・面談など）を1つだけ具体的に動かしてみましょう。'],
    future_direction: ['遠い将来より、直近1〜3ヶ月で試せる小さな一歩を一つ決めてみてください。', '「正解」を探すより、今の選択肢の中で一番後悔が少なそうなものから動いてみましょう。'],
    self_understanding: ['答えを急がず、今回のカードで気になった言葉を一つ選び、数日反芻してみてください。', '誰かに相談する前に、まず自分の言葉でこの状況を書き出してみることをお勧めします。'],
    other: ['今回のカードの中で一番引っかかった言葉を一つ選び、それについて数日考えてみてください。', '結論を急がず、状況が動くまで小さな観察を続けることも一つの選択です。']
  };
  const list = (base[theme] || base.other).slice(0, 2);
  if (flowType === 'warning') list.push('急いで結論を出すより、今回は一呼吸置くこと自体がアドバイスです。');
  return list;
}

function buildDirectAnswer(theme, flowType, cards) {
  const domainLabel = THEME_DOMAIN_LABEL[theme] || '今回の相談';
  const conclusion = {
    escalation: `${domainLabel}は、今の流れのまま進んでいく可能性が高い状況です。`,
    warning: `${domainLabel}には、まだ表に出ていない不安や葛藤が影響している可能性があります。`,
    resolution: `${domainLabel}は、過去の重さから少しずつ抜け出していく方向にあります。`,
    contrast: `${domainLabel}は一見順調に見えても、どこかで立ち止まって見直す必要がありそうです。`,
    shift: `${domainLabel}には、これまでと同じではいられない転換点が近づいています。`
  }[flowType];

  const reason = `過去（${cards[0].card.name}${cards[0].orientation==='reversed'?'・逆位置':''}）→現在（${cards[1].card.name}${cards[1].orientation==='reversed'?'・逆位置':''}）→未来（${cards[2].card.name}${cards[2].orientation==='reversed'?'・逆位置':''}）という並びが、${FLOW_TEXT[flowType]}`;

  const action = {
    escalation: '今の方向性を大きく変える必要はなく、今のペースを保つことが結果につながります。',
    warning: 'まずは状況を急いで動かそうとせず、何が引っかかっているのかを言語化することから始めてください。',
    resolution: '過去の出来事にこれ以上時間を使うより、今できる小さな一歩に意識を向けてください。',
    contrast: '順調に見える今こそ、一度立ち止まって前提を確認しておくことをお勧めします。',
    shift: 'どちらに転ぶかは今後の行動次第なので、まず自分がどうしたいかを明確にすることが最初の一歩です。'
  }[flowType];

  return { conclusion, reason, action };
}

function renderSynthesis() {
  const cards = currentReading.cards;
  const theme = currentReading.consultation.theme;
  const flowType = detectFlowType(cards);
  const counts = suitCounts(cards);
  const dominantSuit = Object.entries(counts).find(([,n]) => n >= 2)?.[0];

  const { conclusion, reason, action } = buildDirectAnswer(theme, flowType, cards);
  const advice = buildAdvice(theme, flowType);

  let flowBlock = `<div class="summary-block"><div class="summary-block-label">3枚の流れ</div>` +
    `<div class="summary-text">${FLOW_TEXT[flowType]}` +
    (dominantSuit ? `<br>${SUIT_PATTERN_TEXT[dominantSuit]}` : '') +
    `</div></div>`;

  let answerBlock = `<div class="summary-block"><div class="summary-block-label">今回の答え</div>` +
    `<div class="summary-text">${conclusion}<br><br>${reason}<br><br>${action}</div></div>`;

  let adviceBlock = `<div class="summary-block"><div class="summary-block-label">アドバイス</div>` +
    `<ul class="advice-list">${advice.map(a => `<li>${a}</li>`).join('')}</ul></div>`;

  document.getElementById('summaryCard').innerHTML =
    `<div class="summary-title">✦ 統合リーディング ✦</div>` + flowBlock + answerBlock + adviceBlock;
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function resetReading() {
  currentReading = null;
  document.getElementById('resultWrap').classList.remove('show');
  document.getElementById('questionInput').value = '';
  document.getElementById('contextInput').value = '';
  selectedTheme = null;
  document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ---------- INIT ----------
renderThemeGrid();
</script>
