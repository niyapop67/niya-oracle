<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>四柱推命｜命式鑑定</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;500;700&family=Noto+Sans+JP:wght@300;400;500&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #fafaf8;
  --white: #ffffff;
  --ink: #1c1c1c;
  --ink-mid: #4c4c4c;
  --ink-light: #8c8c8c;
  --ink-xlight: #c8c8c8;
  --red: #c0392b;
  --red-light: #e74c3c;
  --red-pale: rgba(192,57,43,0.08);
  --red-dim: rgba(192,57,43,0.2);
  --teal: #1a7a6b;
  --gold: #b8860b;
  --border: #e4e2dc;
  --surface: #f4f2ec;
  --wood: #2d6a4f;
  --fire2: #c0392b;
  --earth: #8b6914;
  --metal: #5d6d7e;
  --water: #1a4a7a;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'Noto Sans JP', sans-serif;
  min-height: 100vh;
}

.page {
  max-width: 820px;
  margin: 0 auto;
  padding: 56px 28px 100px;
}

/* Header */
.header {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  margin-bottom: 48px;
  padding-bottom: 24px;
  border-bottom: 2px solid var(--ink);
}

.header-left {}

.header-jp {
  font-family: 'Noto Serif JP', serif;
  font-size: clamp(28px, 6vw, 48px);
  font-weight: 700;
  letter-spacing: 0.15em;
  line-height: 1;
  margin-bottom: 6px;
}

.header-en {
  font-family: 'Libre Baskerville', serif;
  font-style: italic;
  font-size: 13px;
  color: var(--ink-light);
  letter-spacing: 0.15em;
}

.header-badge {
  font-size: 10px;
  letter-spacing: 0.2em;
  color: var(--red);
  border: 1px solid var(--red-dim);
  padding: 6px 14px;
  font-family: 'Noto Sans JP', sans-serif;
  background: var(--red-pale);
}

/* Form card */
.form-card {
  background: var(--white);
  border: 1px solid var(--border);
  padding: 36px;
  margin-bottom: 36px;
}

.form-card-title {
  font-family: 'Noto Serif JP', serif;
  font-size: 14px;
  font-weight: 500;
  letter-spacing: 0.2em;
  margin-bottom: 24px;
  color: var(--ink);
  display: flex;
  align-items: center;
  gap: 12px;
}

.form-card-title::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}

.form-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  margin-bottom: 20px;
}

.form-group { display: flex; flex-direction: column; gap: 6px; }
.form-group.span2 { grid-column: span 2; }

.form-label {
  font-size: 10px;
  letter-spacing: 0.25em;
  color: var(--ink-light);
  font-family: 'Noto Sans JP', sans-serif;
  font-weight: 300;
}

.form-input, .form-select {
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--ink);
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 14px;
  padding: 10px 12px;
  outline: none;
  transition: border-color 0.2s, background 0.2s;
  appearance: none;
  border-radius: 0;
}

.form-input:focus, .form-select:focus {
  border-color: var(--red);
  background: var(--white);
}

.form-input::placeholder { color: var(--ink-xlight); }

.calc-btn {
  background: var(--ink);
  border: none;
  color: var(--white);
  font-family: 'Noto Serif JP', serif;
  font-size: 14px;
  letter-spacing: 0.3em;
  padding: 16px 48px;
  cursor: pointer;
  transition: background 0.2s;
  display: block;
}

.calc-btn:hover { background: var(--red); }
.calc-btn:disabled { background: var(--ink-xlight); cursor: not-allowed; }

/* Loading */
.loading {
  display: none;
  align-items: center;
  gap: 12px;
  margin-top: 16px;
  font-size: 12px;
  color: var(--ink-light);
  letter-spacing: 0.15em;
}
.loading.show { display: flex; }
.load-dots { display: flex; gap: 4px; }
.ld { width: 5px; height: 5px; background: var(--red); border-radius: 50%; animation: ldot 1.2s ease-in-out infinite; }
.ld:nth-child(2) { animation-delay: 0.2s; }
.ld:nth-child(3) { animation-delay: 0.4s; }
@keyframes ldot { 0%,100%{opacity:0.2;transform:scale(1);}50%{opacity:1;transform:scale(1.3);} }

/* Result */
.result-wrap {
  opacity: 0;
  transform: translateY(16px);
  transition: all 0.7s ease;
  pointer-events: none;
}
.result-wrap.show { opacity: 1; transform: translateY(0); pointer-events: auto; }

/* Section */
.section { margin-bottom: 40px; }

.sec-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 20px;
}

.sec-num {
  font-family: 'Libre Baskerville', serif;
  font-size: 11px;
  color: var(--red);
  letter-spacing: 0.1em;
  width: 24px;
}

.sec-title {
  font-family: 'Noto Serif JP', serif;
  font-size: 16px;
  font-weight: 500;
  letter-spacing: 0.15em;
  color: var(--ink);
}

.sec-line { flex: 1; height: 1px; background: var(--border); }

/* Shiju chart - THE CORE */
.shiju-wrap {
  background: var(--white);
  border: 1px solid var(--border);
  padding: 28px;
  margin-bottom: 24px;
}

.shiju-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1px;
  background: var(--border);
  border: 1px solid var(--border);
}

.pillar {
  background: var(--white);
  display: flex;
  flex-direction: column;
  align-items: center;
}

.pillar-label {
  background: var(--ink);
  color: var(--white);
  width: 100%;
  text-align: center;
  padding: 8px 4px;
  font-size: 11px;
  letter-spacing: 0.2em;
  font-family: 'Noto Serif JP', serif;
}

.pillar-label.active { background: var(--red); }

.pillar-kan {
  padding: 20px 16px;
  text-align: center;
  border-bottom: 1px solid var(--border);
  width: 100%;
}

.kan-char {
  font-family: 'Noto Serif JP', serif;
  font-size: 36px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 4px;
}

.kan-read {
  font-size: 10px;
  color: var(--ink-light);
  letter-spacing: 0.1em;
}

.kan-element {
  font-size: 9px;
  padding: 2px 8px;
  border-radius: 20px;
  margin-top: 6px;
  display: inline-block;
  letter-spacing: 0.1em;
}

.el-wood { background: rgba(45,106,79,0.1); color: var(--wood); border: 1px solid rgba(45,106,79,0.2); }
.el-fire { background: rgba(192,57,43,0.1); color: var(--fire2); border: 1px solid rgba(192,57,43,0.2); }
.el-earth { background: rgba(139,105,20,0.1); color: var(--earth); border: 1px solid rgba(139,105,20,0.2); }
.el-metal { background: rgba(93,109,126,0.1); color: var(--metal); border: 1px solid rgba(93,109,126,0.2); }
.el-water { background: rgba(26,74,122,0.1); color: var(--water); border: 1px solid rgba(26,74,122,0.2); }

.pillar-shi {
  padding: 20px 16px;
  text-align: center;
  width: 100%;
}

.shi-char {
  font-family: 'Noto Serif JP', serif;
  font-size: 28px;
  font-weight: 500;
  line-height: 1;
  margin-bottom: 4px;
}

.shi-read { font-size: 10px; color: var(--ink-light); letter-spacing: 0.1em; }
.shi-zodiac { font-size: 10px; color: var(--ink-xlight); margin-top: 4px; }

/* Jusshin */
.jusshin-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-bottom: 20px;
}

.js-card {
  background: var(--white);
  border: 1px solid var(--border);
  padding: 16px;
  cursor: pointer;
  transition: all 0.2s;
}

.js-card:hover { border-color: var(--red); }
.js-card.active { border-color: var(--red); background: var(--red-pale); }

.js-pillar { font-size: 9px; letter-spacing: 0.2em; color: var(--ink-light); margin-bottom: 6px; }
.js-name { font-family: 'Noto Serif JP', serif; font-size: 16px; font-weight: 500; color: var(--ink); margin-bottom: 4px; }
.js-meaning { font-size: 10px; color: var(--ink-light); }

.js-detail {
  background: var(--white);
  border: 1px solid var(--red-dim);
  border-left: 3px solid var(--red);
  padding: 20px 24px;
  margin-bottom: 20px;
  display: none;
}
.js-detail.show { display: block; }
.js-detail-title { font-family: 'Noto Serif JP', serif; font-size: 16px; font-weight: 500; margin-bottom: 10px; color: var(--ink); }
.js-detail-text { font-size: 13px; line-height: 2; color: var(--ink-mid); }

/* Daun table */
.daun-table {
  width: 100%;
  border-collapse: collapse;
  background: var(--white);
  border: 1px solid var(--border);
}

.daun-table th {
  background: var(--ink);
  color: var(--white);
  font-size: 10px;
  letter-spacing: 0.2em;
  padding: 10px 12px;
  text-align: center;
  font-weight: 400;
  font-family: 'Noto Serif JP', serif;
}

.daun-table td {
  padding: 12px;
  text-align: center;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
  color: var(--ink-mid);
  font-family: 'Noto Serif JP', serif;
}

.daun-table tr:hover td { background: var(--red-pale); }
.daun-table .daun-char { font-size: 18px; color: var(--ink); font-weight: 500; }
.daun-table .current-row td { background: var(--red-pale); color: var(--red); font-weight: 500; }

/* Komon */
.komon-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 16px;
}

.komon-card {
  background: var(--white);
  border: 1px solid var(--border);
  padding: 16px;
  text-align: center;
  position: relative;
}

.komon-palace { font-size: 9px; letter-spacing: 0.2em; color: var(--ink-light); margin-bottom: 6px; }
.komon-dir { font-size: 18px; margin-bottom: 6px; }
.komon-name { font-family: 'Noto Serif JP', serif; font-size: 14px; color: var(--ink); margin-bottom: 4px; }
.komon-element { font-size: 10px; margin-top: 6px; }
.komon-auspicious { border-top: 2px solid var(--red); }
.komon-inauspicious { border-top: 2px solid var(--ink-xlight); }

/* Five elements balance */
.five-el {
  display: flex;
  gap: 8px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}

.five-el-item {
  flex: 1;
  min-width: 60px;
  background: var(--white);
  border: 1px solid var(--border);
  padding: 12px 8px;
  text-align: center;
}

.five-el-char { font-family: 'Noto Serif JP', serif; font-size: 18px; font-weight: 500; margin-bottom: 4px; }
.five-el-count { font-size: 11px; color: var(--ink-light); }
.five-el-bar { height: 3px; margin: 6px 4px 0; border-radius: 2px; }

/* Coconala CTA */
.cta-card {
  background: var(--ink);
  color: var(--white);
  padding: 32px 36px;
  margin-top: 48px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  flex-wrap: wrap;
}

.cta-left {}
.cta-label { font-size: 10px; letter-spacing: 0.3em; color: var(--ink-xlight); margin-bottom: 8px; }
.cta-title { font-family: 'Noto Serif JP', serif; font-size: 20px; font-weight: 500; letter-spacing: 0.1em; margin-bottom: 8px; }
.cta-desc { font-size: 12px; color: var(--ink-xlight); line-height: 1.7; }

.cta-btn {
  background: var(--red);
  color: var(--white);
  border: none;
  font-family: 'Noto Serif JP', serif;
  font-size: 13px;
  letter-spacing: 0.2em;
  padding: 16px 32px;
  cursor: pointer;
  transition: background 0.2s;
  white-space: nowrap;
  text-decoration: none;
  display: inline-block;
}

.cta-btn:hover { background: var(--red-light); }

/* Reset */
.reset-btn {
  background: none;
  border: 1px solid var(--border);
  color: var(--ink-light);
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 11px;
  letter-spacing: 0.2em;
  padding: 10px 28px;
  cursor: pointer;
  transition: all 0.2s;
  display: block;
  margin: 32px auto 0;
}
.reset-btn:hover { border-color: var(--ink); color: var(--ink); }

.footer-note {
  font-size: 11px;
  color: var(--ink-xlight);
  text-align: center;
  margin-top: 32px;
  letter-spacing: 0.05em;
  line-height: 1.8;
}

@media (max-width: 600px) {
  .page { padding: 36px 16px 80px; }
  .form-row { grid-template-columns: 1fr 1fr; }
  .shiju-grid { grid-template-columns: repeat(2, 1fr); }
  .jusshin-grid { grid-template-columns: repeat(2, 1fr); }
  .komon-grid { grid-template-columns: repeat(2, 1fr); }
  .header { flex-direction: column; align-items: flex-start; gap: 12px; }
  .cta-card { flex-direction: column; }
  .five-el { }
}
</style>
</head>
<body>
<div class="page">

  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <div class="header-jp">四柱推命</div>
      <div class="header-en">Four Pillars of Destiny · 命式鑑定</div>
    </div>
    <div class="header-badge">本格命式計算</div>
  </div>

  <!-- Form -->
  <div class="form-card">
    <div class="form-card-title">生年月日時を入力</div>

    <!-- 入力方式切り替え -->
    <div style="display:flex;gap:0;margin-bottom:20px;border:1px solid var(--border);width:fit-content">
      <button id="modeNum" onclick="switchMode('num')"
        style="background:var(--ink);color:var(--white);border:none;font-family:'Noto Sans JP',sans-serif;font-size:11px;letter-spacing:0.15em;padding:8px 20px;cursor:pointer;transition:all 0.2s">
        数字で入力
      </button>
      <button id="modeCal" onclick="switchMode('cal')"
        style="background:var(--white);color:var(--ink-light);border:none;font-family:'Noto Sans JP',sans-serif;font-size:11px;letter-spacing:0.15em;padding:8px 20px;cursor:pointer;transition:all 0.2s">
        カレンダーで入力
      </button>
    </div>

    <div class="form-row">
      <div class="form-group">
        <div class="form-label">お名前</div>
        <input class="form-input" type="text" id="myName" placeholder="山田花子">
      </div>

      <!-- 数字入力モード -->
      <div id="numInputs" style="display:contents">
        <div class="form-group">
          <div class="form-label">年（西暦）</div>
          <input class="form-input" type="number" id="inputYear" placeholder="1990" min="1900" max="2100"
            style="appearance:textfield" oninput="syncFromNum()">
        </div>
        <div class="form-group">
          <div class="form-label">月</div>
          <input class="form-input" type="number" id="inputMonth" placeholder="1" min="1" max="12"
            style="appearance:textfield" oninput="syncFromNum()">
        </div>
        <div class="form-group">
          <div class="form-label">日</div>
          <input class="form-input" type="number" id="inputDay" placeholder="1" min="1" max="31"
            style="appearance:textfield" oninput="syncFromNum()">
        </div>
      </div>

      <!-- カレンダー入力モード -->
      <div id="calInputs" style="display:none;grid-column:span 3">
        <div class="form-group">
          <div class="form-label">生年月日</div>
          <input class="form-input" type="date" id="myDate" style="width:100%" onchange="syncFromCal()">
        </div>
      </div>
    </div>

    <!-- 時刻・性別 -->
    <div class="form-row" style="margin-top:0">
      <div class="form-group" style="grid-column:1">
        <div class="form-label">出生時刻</div>
        <input class="form-input" type="time" id="myTime" value="12:00">
      </div>
      <div class="form-group" style="grid-column:2">
        <div class="form-label">性別</div>
        <select class="form-select" id="myGender">
          <option value="female">女性</option>
          <option value="male">男性</option>
        </select>
      </div>
      <div class="form-group" style="grid-column:3/5">
        <div class="form-label">入力確認</div>
        <div id="datePreview" style="font-family:'Noto Serif JP',serif;font-size:13px;color:var(--ink-mid);padding:10px 12px;background:var(--surface);border:1px solid var(--border);letter-spacing:0.05em;min-height:41px">
          —
        </div>
      </div>
    </div>

    <button class="calc-btn" id="calcBtn" onclick="calculate()">命式を鑑定する</button>
    <div class="loading" id="loading">
      <div class="load-dots"><div class="ld"></div><div class="ld"></div><div class="ld"></div></div>
      <span>命式を計算しています…</span>
    </div>
  </div>

  <!-- Result -->
  <div class="result-wrap" id="resultWrap"></div>

</div>

<script>
// ===== FOUR PILLARS DATA =====

const TIAN_GAN = [
  { char:'甲', read:'きのえ', element:'wood', yin:false, meaning:'陽木・成長・指導力' },
  { char:'乙', read:'きのと', element:'wood', yin:true,  meaning:'陰木・柔軟・協調性' },
  { char:'丙', read:'ひのえ', element:'fire', yin:false, meaning:'陽火・情熱・明朗' },
  { char:'丁', read:'ひのと', element:'fire', yin:true,  meaning:'陰火・繊細・芸術性' },
  { char:'戊', read:'つちのえ', element:'earth', yin:false, meaning:'陽土・安定・包容力' },
  { char:'己', read:'つちのと', element:'earth', yin:true,  meaning:'陰土・誠実・慎重' },
  { char:'庚', read:'かのえ', element:'metal', yin:false, meaning:'陽金・決断・正義感' },
  { char:'辛', read:'かのと', element:'metal', yin:true,  meaning:'陰金・繊細・美意識' },
  { char:'壬', read:'みずのえ', element:'water', yin:false, meaning:'陽水・知性・行動力' },
  { char:'癸', read:'みずのと', element:'water', yin:true,  meaning:'陰水・直感・思いやり' },
];

const DI_ZHI = [
  { char:'子', read:'ね', zodiac:'🐭 鼠', element:'water', hour:'23-1', month:11 },
  { char:'丑', read:'うし', zodiac:'🐮 牛', element:'earth', hour:'1-3', month:12 },
  { char:'寅', read:'とら', zodiac:'🐯 虎', element:'wood', hour:'3-5', month:1 },
  { char:'卯', read:'う', zodiac:'🐰 兎', element:'wood', hour:'5-7', month:2 },
  { char:'辰', read:'たつ', zodiac:'🐲 龍', element:'earth', hour:'7-9', month:3 },
  { char:'巳', read:'み', zodiac:'🐍 蛇', element:'fire', hour:'9-11', month:4 },
  { char:'午', read:'うま', zodiac:'🐴 馬', element:'fire', hour:'11-13', month:5 },
  { char:'未', read:'ひつじ', zodiac:'🐑 羊', element:'earth', hour:'13-15', month:6 },
  { char:'申', read:'さる', zodiac:'🐒 猿', element:'metal', hour:'15-17', month:7 },
  { char:'酉', read:'とり', zodiac:'🐓 鶏', element:'metal', hour:'17-19', month:8 },
  { char:'戌', read:'いぬ', zodiac:'🐕 犬', element:'earth', hour:'19-21', month:9 },
  { char:'亥', read:'い', zodiac:'🐗 猪', element:'water', hour:'21-23', month:10 },
];

const JUSSHIN = {
  '比肩': {
    meaning:'比肩は日主と同じ五行・同じ陰陽を持つ星です。自分と同質のエネルギーを象徴し、自立心・競争心・強い個性・友人との縁を表します。命式に比肩が強い人は独立独歩の精神が旺盛で、他者に頼らず自分の力で道を切り拓こうとする気概があります。一方で、強すぎると頑固さや協調性の欠如として現れることも。仲間を大切にしながらも自分の信念を持って歩む「一匹狼」的な魅力を持ちます。',
    love:'対等なパートナーシップを最も重視します。支配されることも従属することも好まず、お互いを尊重し高め合える関係を理想とします。友人から恋人へと発展するパターンが多く、長い時間をかけて信頼を築いた相手と深い絆を結びます。嫉妬や依存は苦手ですが、いったん信頼した相手には揺るぎない忠誠を誓います。',
    work:'独立開業・フリーランス・個人事業主として才能を発揮します。組織の中でも自分のペースで動ける環境が最適。競争の激しい分野で粘り強く戦い抜く力があります。スポーツ・営業・クリエイター・起業家として大きな実績を残せる星です。'

// ===== CALCULATION =====

function getYearPillar(year) {
  // 甲子年を基準 (1984)
  const base = 1984;
  const diff = ((year - base) % 60 + 60) % 60;
  return { tg: TIAN_GAN[diff % 10], dz: DI_ZHI[diff % 12] };
}

function getMonthPillar(year, month) {
  // 月柱 (簡易計算 - 寅月=1月基準)
  const yearTgIdx = ((year - 1984) % 10 + 10) % 10;
  const monthBase = [2,4,6,8,0,2,4,6,8,0,2,4]; // 年干に基づく月干の起算
  const startTg = [2,4,6,8,0][Math.floor(yearTgIdx/2) % 5];
  const monthIdx = (month - 1 + 2) % 12; // 寅月=1月
  const tgIdx = (startTg + monthIdx) % 10;
  const dzIdx = (monthIdx + 2) % 12;
  return { tg: TIAN_GAN[tgIdx], dz: DI_ZHI[dzIdx] };
}

function getDayPillar(year, month, day) {
  // ユリウス日から六十干支を計算
  const jd = Math.floor(365.25*(year+4716)) + Math.floor(30.6001*(month+1)) + day - 1524;
  const diff = ((jd - 11) % 60 + 60) % 60;
  return { tg: TIAN_GAN[diff % 10], dz: DI_ZHI[diff % 12] };
}

function getHourPillar(hour, dayTgIdx) {
  const dzIdx = Math.floor(((hour + 1) % 24) / 2);
  const startTg = [0,2,4,6,8][dayTgIdx % 5];
  const tgIdx = (startTg + dzIdx) % 10;
  return { tg: TIAN_GAN[tgIdx], dz: DI_ZHI[dzIdx] };
}

function getJusshin(dayTg, targetTg) {
  const rel = ((targetTg.element === dayTg.element) ? 'same' :
    isGenerating(dayTg.element, targetTg.element) ? 'gen_by_day' :
    isGenerating(targetTg.element, dayTg.element) ? 'gen_day' :
    isControlling(dayTg.element, targetTg.element) ? 'ctrl_by_day' :
    'ctrl_day');

  const yin = targetTg.yin;
  const dayYin = dayTg.yin;

  if (rel === 'same') return yin === dayYin ? '比肩' : '劫財';
  if (rel === 'gen_by_day') return yin ? '食神' : '傷官'; // 日干が生む
  if (rel === 'gen_day') return yin ? '偏印' : '印綬'; // 日干を生む
  if (rel === 'ctrl_by_day') return yin ? '偏財' : '正財'; // 日干が剋す
  return yin ? '偏官' : '正官'; // 日干を剋す
}

function isGenerating(from, to) {
  const chain = { wood:'fire', fire:'earth', earth:'metal', metal:'water', water:'wood' };
  return chain[from] === to;
}

function isControlling(from, to) {
  const chain = { wood:'earth', earth:'water', water:'fire', fire:'metal', metal:'wood' };
  return chain[from] === to;
}

function getDaun(yearPillar, month, gender, isYin) {
  // 大運起算年数計算（簡易）
  const forward = (isYin && gender==='female') || (!isYin && gender==='male');
  const startAge = forward ? (12 - month % 12) % 10 + 3 : (month % 12) + 3;
  const result = [];
  const yearTgIdx = TIAN_GAN.indexOf(yearPillar.tg);
  const yearDzIdx = DI_ZHI.indexOf(yearPillar.dz);

  for (let i = 0; i < 8; i++) {
    const dir = forward ? 1 : -1;
    const tgIdx = ((yearTgIdx + (i+1)*dir) % 10 + 10) % 10;
    const dzIdx = ((yearDzIdx + (i+1)*dir) % 12 + 12) % 12;
    result.push({
      age: startAge + i*10,
      endAge: startAge + (i+1)*10 - 1,
      tg: TIAN_GAN[tgIdx],
      dz: DI_ZHI[dzIdx]
    });
  }
  return result;
}

function updatePreview() {

  const [y,m,d] = val.split('-').map(Number);
  const weekdays = ['日','月','火','水','木','金','土'];
  const w = weekdays[new Date(y,m-1,d).getDay()];
  preview.textContent = `${y}年 ${m}月 ${d}日（${w}）`;
  preview.style.color = 'var(--ink)';
}

    const age = currentYear - year;

    // Komon
    const komon = getKomon(dayP);

    renderResult(name, year, age, yearP, monthP, dayP, hourP, jusshin, elCount, daun, age, komon);

    btn.disabled = false;
    loading.classList.remove('show');
    document.getElementById('resultWrap').classList.add('show');
    document.getElementById('resultWrap').scrollIntoView({ behavior:'smooth', block:'start' });
  }, 1600);
}

function renderPillar(pillar, label, isDay=false) {
  const tg = pillar.tg;
  const dz = pillar.dz;
  return `
    <div class="pillar">
      <div class="pillar-label ${isDay ? 'active' : ''}">${label}</div>
      <div class="pillar-kan">
        <div class="kan-char" style="color:${ELEMENTS_COLOR[tg.element]}">${tg.char}</div>
        <div class="kan-read">${tg.read}</div>
        <div class="kan-element ${ELEMENTS_CLASS[tg.element]}">${ELEMENTS_JP[tg.element]}（${tg.yin?'陰':'陽'}）</div>
      </div>
      <div class="pillar-shi">
        <div class="shi-char">${dz.char}</div>
        <div class="shi-read">${dz.read}</div>
        <div class="shi-zodiac">${dz.zodiac}</div>
        <div class="kan-element ${ELEMENTS_CLASS[dz.element]}" style="margin-top:6px">${ELEMENTS_JP[dz.element]}</div>
      </div>
    </div>`;
}

function showJusshin(name, pillarName) {
  const data = JUSSHIN[name];
  if (!data) return;
  const detail = document.getElementById('jusshinDetail');
  detail.innerHTML = `
    <div class="js-detail-title">${name}（${pillarName}）</div>
    <div class="js-detail-text">
      <div style="margin-bottom:14px;">
        <div style="font-size:10px;letter-spacing:0.2em;color:var(--ink-light);margin-bottom:6px;">◈ 星の意味・特性</div>
        <div style="font-size:13px;line-height:1.9;color:var(--ink-mid);">${data.meaning}</div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
        <div style="background:var(--red-pale);border:1px solid rgba(180,60,60,0.15);border-radius:4px;padding:12px;">
          <div style="font-size:10px;letter-spacing:0.15em;color:var(--red);margin-bottom:6px;">💕 恋愛・人間関係</div>
          <div style="font-size:12px;line-height:1.8;color:var(--ink-mid);">${data.love}</div>
        </div>
        <div style="background:rgba(60,100,180,0.04);border:1px solid rgba(60,100,180,0.12);border-radius:4px;padding:12px;">
          <div style="font-size:10px;letter-spacing:0.15em;color:#3a64b4;margin-bottom:6px;">💼 仕事・使命</div>
          <div style="font-size:12px;line-height:1.8;color:var(--ink-mid);">${data.work}</div>
        </div>
      </div>
    </div>`;
  detail.classList.add('show');
  document.querySelectorAll('.js-card').forEach(c => c.classList.remove('active'));
  event.currentTarget.classList.add('active');
}

function renderResult(name, birthYear, age, yearP, monthP, dayP, hourP, jusshin, elCount, daun, currentAge, komon) {
  const maxEl = Math.max(...Object.values(elCount)) || 1;

  const html = `

        <div class="sec-line"></div>
      </div>

        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px">

          ${renderPillar(yearP, '年柱')}

        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border);border:1px solid var(--border);margin-top:1px">
          ${['year','month','day','hour'].map((k,i) => `
            <div style="background:${k==='day'?'var(--red-pale)':'var(--white)'};padding:10px;text-align:center">
              <div style="font-size:9px;letter-spacing:0.2em;color:var(--ink-light);margin-bottom:4px">十神</div>
              <div style="font-family:'Noto Serif JP',serif;font-size:13px;color:${k==='day'?'var(--red)':'var(--ink)'}">
                ${jusshin[k]}

            </div>`).join('')}
        </div>
      </div>
    </div>

    <!-- 五行バランス -->
    <div class="section">
      <div class="sec-header">
        <div class="sec-num">02</div>
        <div class="sec-title">五行バランス</div>
        <div class="sec-line"></div>

      <div class="five-el">

    <div class="section">
      <div class="sec-header">
        <div class="sec-num">03</div>
        <div class="sec-title">十神解釈</div>
        <div class="sec-line"></div>
      </div>
      <div class="jusshin-grid">
        ${[['year','年柱',jusshin.year],['month','月柱',jusshin.month],['hour','時柱',jusshin.hour]].map(([k,lbl,js]) => `
          <div class="js-card" onclick="showJusshin('${js}','${lbl}')">
            <div class="js-pillar">${lbl}</div>
            <div class="js-name">${js}</div>
            <div class="js-meaning">${JUSSHIN[js]?.meaning.slice(0,20)}…</div>

      </div>
      <div class="js-detail" id="jusshinDetail"></div>
    </div>

    <!-- 大運・小運 -->
    <div class="section">
      <div class="sec-header">
        <div class="sec-num">04</div>
        <div class="sec-title">大運・小運</div>
        <div class="sec-line"></div>
      </div>
      <table class="daun-table">
        <thead>
          <tr>
            <th>年齢</th>
            <th>天干</th>
            <th>地支</th>

        <tbody>
          ${daun.map(d => {

              <td>${d.age}〜${d.endAge}歳${isCurrent?' ◀ 現在':''}</td>

              <td><div class="daun-char">${d.dz.char}</div><div style="font-size:10px;color:var(--ink-light)">${d.dz.read}</div></td>
              <td><span class="kan-element ${ELEMENTS_CLASS[d.tg.element]}">${ELEMENTS_JP[d.tg.element]}</span></td>
              <td style="text-align:left;font-size:12px;line-height:1.8;padding:10px 8px;">${getDaunTheme(d.tg, d.dz)}</td>

          }).join('')}

      </table>

    <div class="section">
      <div class="sec-header">

      </div>
      <div style="background:var(--surface);border:1px solid var(--border);padding:14px 18px;margin-bottom:16px;font-size:12px;color:var(--ink-light);letter-spacing:0.05em;line-height:1.8">
        日主「${dayP.tg.char}（${ELEMENTS_JP[dayP.tg.element]}）」の気質から導く吉方位・凶方位。移転・旅行・重要な行動の方向選びにご活用ください。
      </div>
      <div class="komon-grid">
        ${komon.map(k => `

            <div style="font-size:10px;color:var(--ink-light);margin-top:8px;line-height:1.6">${k.meaning}</div>

    <div class="cta-card">

          恋愛・仕事・人生の転機など、詳しくお読み解きします。
        </div>
      </div>
      <a class="cta-btn" href="https://coconala.com" target="_blank" rel="noopener">
        ココナラで鑑定を依頼する →
      </a>

    <button class="reset-btn" onclick="resetResult()">もう一度入力する</button>
    <div class="footer-note">
      ※ 本アプリは簡易計算による参考値です。正確な鑑定はプロ占い師にご依頼ください。<br>
      ※ 大運の起算年は生まれ月と性別・年干の陰陽により変わります。

  `;

  document.getElementById('resultWrap').innerHTML = html;
}

function getFiveElAnalysis(elCount) {
  const sorted = Object.entries(elCount).sort((a,b) => b[1]-a[1]);
  const strongest = sorted[0];
  const weakest = sorted[sorted.length-1];
  const elName = { wood:'木', fire:'火', earth:'土', metal:'金', water:'水' };
  const elTraits = {
    wood:'成長・向上心・リーダーシップ',
    fire:'情熱・表現力・直感',
    earth:'安定・誠実・包容力',
    metal:'決断力・完璧主義・正義感',
    water:'知性・適応力・感受性'
  };
  const elNeeds = {
    wood:'柔軟性と協調性を意識すると◎',
    fire:'冷静さと継続力を育てると◎',
    earth:'変化への対応力を磨くと◎',
    metal:'感情表現と柔らかさを加えると◎',
    water:'行動力と積極性を意識すると◎'
  };

  return `
    最も強い気は <strong style="color:${ELEMENTS_COLOR[strongest[0]]}">${elName[strongest[0]]}（${elTraits[strongest[0]]}）</strong>。
    ${elName[strongest[0]]}の気質があなたの個性の核となっています。<br>
    一方、<strong>${elName[weakest[0]]}</strong>の気が少なめ。${elNeeds[weakest[0]]}。
  `;
}

function getDaunTheme(tg, dz) {
  const tgThemes = {
    wood: '木運：成長と拡大の10年。人脈が広がり、新しいことを始めるのに向いた時期。学業・独立・引越しなど「始まり」に関するテーマが多い。',
    fire: '火運：情熱と表現の10年。才能が開花し、表舞台に出るチャンスが訪れる。恋愛・結婚・転職・起業など人生の転機が多い時期。',
    earth: '土運：安定と蓄積の10年。焦らずコツコツ積み上げることで確実な成果が出る。不動産・資産形成・健康管理が鍵となる時期。',
    metal: '金運：変革と収穫の10年。過去の努力が実る一方、不要なものを断ち切る決断も必要。昇進・財運・結婚など実りのある出来事が多い。',
    water: '水運：内省と深化の10年。外より内側を磨く時期。精神的な成長・学習・スピリチュアルな探求が深まる。次の大運の準備期間でもある。'
  };
  const dzThemes = {
    子:'子の大運：智恵と人脈。知識の吸収と情報収集に優れた時期。',
    丑:'丑の大運：忍耐と蓄積。地道な努力が確実に実る10年。',
    寅:'寅の大運：挑戦と変化。大きな動きと転機が訪れる時期。',
    卯:'卯の大運：縁と発展。良縁・出会い・成長のチャンス。',
    辰:'辰の大運：蓄財と変革。財が動き、大きな変化がある時期。',
    巳:'巳の大運：才能の開花。潜在的な才能が表面に出てくる。',
    午:'午の大運：情熱と名誉。社会的な活躍と認知が高まる時期。',
    未:'未の大運：人情と安定。人間関係が豊かになる穏やかな10年。',
    申:'申の大運：変化と決断。環境の変化が多く、決断を迫られる時期。',
    酉:'酉の大運：収穫と完成。努力が実を結び、物事が完成に向かう。',
    戌:'戌の大運：変革と浄化。古いものが終わり、新しいものが始まる。',
    亥:'亥の大運：準備と内省。次のステージへの準備と精神的な深化の時期。'
  };
  const t1 = tgThemes[tg.element] || '';
  const t2 = dzThemes[dz.char] || '';
  return t1 + (t2 ? '<br><span style="font-size:11px;color:var(--ink-light)">'+t2+'</span>' : '');
}

function resetResult() {
  document.getElementById('resultWrap').classList.remove('show');
  document.getElementById('resultWrap').innerHTML = '';
  window.scrollTo({ top:0, behavior:'smooth' });
}
