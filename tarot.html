<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>タロット占い｜Tarot Oracle</title>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Noto+Serif+JP:wght@300;400;500&family=Uncial+Antiqua&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #1a1208;
  --bg2: #221a0a;
  --parchment: #f5e6c8;
  --parchment2: #ede0b8;
  --ink: #2a1f0a;
  --ink-mid: #5c4a1e;
  --ink-light: #8b7340;
  --gold: #c9973a;
  --gold-light: #e8c068;
  --gold-dim: rgba(201,151,58,0.2);
  --red: #8b1a1a;
  --red-light: #c0392b;
  --cream: #fdf6e3;
  --border: rgba(201,151,58,0.3);
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: var(--bg);
  color: var(--parchment);
  font-family: 'Noto Serif JP', serif;
  min-height: 100vh;
  overflow-x: hidden;
}

/* Texture overlay */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px),
    repeating-linear-gradient(90deg, transparent, transparent 2px, rgba(0,0,0,0.02) 2px, rgba(0,0,0,0.02) 4px);
  pointer-events: none;
  z-index: 100;
}

.bg-wrap {
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 70% 50% at 50% 0%, rgba(201,151,58,0.12) 0%, transparent 60%),
    radial-gradient(ellipse 40% 60% at 10% 100%, rgba(139,26,26,0.1) 0%, transparent 60%),
    radial-gradient(ellipse 40% 40% at 90% 80%, rgba(201,151,58,0.06) 0%, transparent 60%),
    var(--bg);
  z-index: 0;
  pointer-events: none;
}

.container {
  position: relative;
  z-index: 1;
  max-width: 760px;
  margin: 0 auto;
  padding: 52px 24px 80px;
}

/* Header */
.header {
  text-align: center;
  margin-bottom: 48px;
}

.header-emblem {
  font-size: 48px;
  margin-bottom: 16px;
  animation: floatEmb 5s ease-in-out infinite;
  display: block;
}
@keyframes floatEmb { 0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);} }

.header-rule {
  display: flex;
  align-items: center;
  gap: 0;
  margin: 0 auto 16px;
  width: 320px;
}
.rule-line { flex:1; height:1px; background: linear-gradient(to right, transparent, var(--gold)); }
.rule-line.r { background: linear-gradient(to left, transparent, var(--gold)); }
.rule-center {
  padding: 0 14px;
  font-family: 'IM Fell English', serif;
  font-size: 18px;
  color: var(--gold);
}

h1 {
  font-family: 'Uncial Antiqua', cursive;
  font-size: clamp(26px, 6vw, 44px);
  color: var(--gold-light);
  letter-spacing: 0.12em;
  line-height: 1.2;
  margin-bottom: 8px;
  text-shadow: 0 0 40px rgba(232,192,104,0.3);
}

.header-sub {
  font-family: 'EB Garamond', serif;
  font-style: italic;
  font-size: 14px;
  color: var(--ink-light);
  letter-spacing: 0.2em;
}

/* Spread selector */
.spread-section {
  margin-bottom: 36px;
}

.section-heading {
  font-family: 'IM Fell English', serif;
  font-size: 11px;
  letter-spacing: 0.35em;
  color: var(--gold);
  text-transform: uppercase;
  text-align: center;
  margin-bottom: 16px;
  opacity: 0.8;
}

.spread-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.spread-btn {
  background: rgba(26,18,8,0.8);
  border: 1px solid var(--border);
  color: var(--parchment);
  font-family: 'IM Fell English', serif;
  font-size: 14px;
  padding: 16px 20px;
  cursor: pointer;
  text-align: left;
  transition: all 0.3s;
  position: relative;
  overflow: hidden;
}
.spread-btn::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, var(--gold-dim), rgba(139,26,26,0.1));
  opacity: 0;
  transition: opacity 0.3s;
}
.spread-btn:hover::before, .spread-btn.active::before { opacity: 1; }
.spread-btn.active { border-color: var(--gold); }

.spread-btn-title { font-size: 14px; margin-bottom: 3px; position:relative;z-index:1; }
.spread-btn-desc {
  font-family: 'Noto Serif JP', serif;
  font-size: 11px;
  color: var(--ink-light);
  letter-spacing: 0.05em;
  position:relative;z-index:1;
}
.spread-btn.active .spread-btn-title { color: var(--gold-light); }

/* Question */
.question-wrap {
  margin-bottom: 28px;
}

.q-label {
  font-family: 'IM Fell English', serif;
  font-size: 11px;
  letter-spacing: 0.3em;
  color: var(--gold);
  text-transform: uppercase;
  margin-bottom: 10px;
  opacity: 0.8;
}

textarea {
  width: 100%;
  background: rgba(26,18,8,0.7);
  border: 1px solid var(--border);
  color: var(--parchment);
  font-family: 'Noto Serif JP', serif;
  font-size: 14px;
  padding: 14px 18px;
  resize: none;
  outline: none;
  line-height: 1.8;
  transition: border-color 0.3s;
}
textarea::placeholder { color: var(--ink-light); }
textarea:focus { border-color: rgba(201,151,58,0.5); }

/* Draw button */
.draw-wrap {
  text-align: center;
  margin-bottom: 40px;
}

.draw-btn {
  background: transparent;
  border: 1px solid var(--gold);
  color: var(--gold-light);
  font-family: 'Uncial Antiqua', cursive;
  font-size: 16px;
  letter-spacing: 0.2em;
  padding: 18px 72px;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: all 0.4s;
}
.draw-btn::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(201,151,58,0.2), rgba(139,26,26,0.2));
  transform: scaleX(0);
  transform-origin: left;
  transition: transform 0.4s;
}
.draw-btn:hover::before { transform: scaleX(1); }
.draw-btn:hover { box-shadow: 0 0 30px rgba(201,151,58,0.2); }
.draw-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.draw-btn span { position: relative; z-index: 1; }

/* Shuffling */
.shuffling {
  display: none;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  margin: 16px 0;
}
.shuffling.show { display: flex; }
.shuffle-cards {
  display: flex;
  gap: -8px;
}
.sh-card {
  width: 28px; height: 44px;
  background: linear-gradient(135deg, var(--bg2), rgba(201,151,58,0.1));
  border: 1px solid var(--border);
  border-radius: 2px;
  animation: shuffle 0.8s ease-in-out infinite;
  margin: 0 2px;
}
.sh-card:nth-child(2) { animation-delay: 0.15s; }
.sh-card:nth-child(3) { animation-delay: 0.3s; }
.sh-card:nth-child(4) { animation-delay: 0.45s; }
.sh-card:nth-child(5) { animation-delay: 0.6s; }
@keyframes shuffle {
  0%,100%{transform:translateY(0) rotate(0deg);}
  25%{transform:translateY(-8px) rotate(-5deg);}
  75%{transform:translateY(-4px) rotate(3deg);}
}
.shuffle-text {
  font-family: 'EB Garamond', serif;
  font-style: italic;
  font-size: 13px;
  color: var(--ink-light);
  letter-spacing: 0.15em;
}

/* Result */
.result-wrap {
  opacity: 0;
  transform: translateY(20px);
  transition: all 0.8s ease;
  pointer-events: none;
}
.result-wrap.show { opacity: 1; transform: translateY(0); pointer-events: auto; }

/* Spread layout */
.spread-layout {
  display: flex;
  gap: 16px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 36px;
}

/* Card */
.tarot-card-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  transition: transform 0.3s;
}
.tarot-card-wrap:hover { transform: translateY(-4px); }
.tarot-card-wrap.selected .tarot-card { border-color: var(--gold); box-shadow: 0 0 24px rgba(201,151,58,0.4); }

.tarot-card {
  width: 100px;
  height: 160px;
  background: linear-gradient(160deg, #1e1406, #2d1f08);
  border: 1px solid var(--border);
  border-radius: 4px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
  transition: all 0.3s;
  padding: 8px;
}

.tarot-card::before {
  content: '';
  position: absolute;
  inset: 4px;
  border: 1px solid rgba(201,151,58,0.15);
  border-radius: 2px;
  pointer-events: none;
}

.card-symbol {
  font-size: 32px;
  margin-bottom: 6px;
  filter: drop-shadow(0 0 8px rgba(201,151,58,0.4));
}
.card-symbol.reversed { transform: rotate(180deg); }

.card-num {
  font-family: 'IM Fell English', serif;
  font-size: 10px;
  color: var(--gold);
  letter-spacing: 0.2em;
  opacity: 0.7;
  margin-bottom: 4px;
}

.card-name-on {
  font-family: 'IM Fell English', serif;
  font-size: 9px;
  color: var(--parchment2);
  text-align: center;
  line-height: 1.3;
  opacity: 0.9;
}

.card-reversed-badge {
  position: absolute;
  bottom: 4px;
  right: 4px;
  font-size: 8px;
  color: var(--red-light);
  font-family: 'EB Garamond', serif;
  font-style: italic;
  opacity: 0.8;
}

.card-position-label {
  font-family: 'IM Fell English', serif;
  font-size: 10px;
  color: var(--ink-light);
  letter-spacing: 0.1em;
  text-align: center;
}

/* Detail */
.card-detail {
  background: rgba(26,18,8,0.9);
  border: 1px solid var(--border);
  padding: 32px;
  margin-bottom: 16px;
  position: relative;
}
.card-detail::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(to right, transparent, var(--gold), transparent);
}
.card-detail::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(to right, transparent, var(--gold), transparent);
}

.detail-head {
  display: flex;
  gap: 20px;
  align-items: flex-start;
  margin-bottom: 24px;
  padding-bottom: 20px;
  border-bottom: 1px solid rgba(201,151,58,0.1);
}

.detail-symbol-big {
  font-size: 52px;
  flex-shrink: 0;
  filter: drop-shadow(0 0 12px rgba(201,151,58,0.3));
}
.detail-symbol-big.reversed { transform: rotate(180deg); }

.detail-title-group { flex: 1; }
.detail-position {
  font-family: 'IM Fell English', serif;
  font-size: 10px;
  letter-spacing: 0.3em;
  color: var(--gold);
  opacity: 0.7;
  margin-bottom: 6px;
  text-transform: uppercase;
}
.detail-card-title {
  font-family: 'Uncial Antiqua', cursive;
  font-size: 20px;
  color: var(--gold-light);
  margin-bottom: 4px;
  letter-spacing: 0.05em;
}
.detail-card-sub {
  font-family: 'EB Garamond', serif;
  font-style: italic;
  font-size: 13px;
  color: var(--ink-light);
  letter-spacing: 0.1em;
}
.reversed-label {
  display: inline-block;
  margin-top: 6px;
  font-family: 'EB Garamond', serif;
  font-style: italic;
  font-size: 12px;
  color: var(--red-light);
  border: 1px solid rgba(192,57,43,0.4);
  padding: 2px 10px;
}

.detail-keywords {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 20px;
}
.kw-tag {
  font-family: 'EB Garamond', serif;
  font-size: 12px;
  color: var(--gold);
  border: 1px solid var(--border);
  padding: 4px 12px;
  letter-spacing: 0.1em;
}
.kw-tag.rev { color: var(--red-light); border-color: rgba(192,57,43,0.3); }

.detail-sec-label {
  font-family: 'IM Fell English', serif;
  font-size: 10px;
  letter-spacing: 0.3em;
  color: var(--gold);
  text-transform: uppercase;
  opacity: 0.7;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.detail-sec-label::after {
  content: '';
  flex: 1;
  height: 1px;
  background: linear-gradient(to right, rgba(201,151,58,0.2), transparent);
}
.detail-text {
  font-size: 14px;
  line-height: 2;
  color: rgba(245,230,200,0.85);
  margin-bottom: 20px;
}

.oracle-box {
  background: linear-gradient(135deg, rgba(201,151,58,0.08), rgba(139,26,26,0.08));
  border: 1px solid rgba(201,151,58,0.2);
  border-left: 3px solid var(--gold);
  padding: 18px 20px;
  margin-top: 4px;
}
.oracle-text {
  font-family: 'EB Garamond', serif;
  font-style: italic;
  font-size: 15px;
  line-height: 1.9;
  color: var(--parchment);
}

/* Summary */
.summary-card {
  background: rgba(26,18,8,0.9);
  border: 1px solid var(--border);
  padding: 28px 32px;
  margin-bottom: 24px;
}
.summary-title {
  font-family: 'Uncial Antiqua', cursive;
  font-size: 16px;
  color: var(--gold-light);
  letter-spacing: 0.1em;
  margin-bottom: 16px;
  text-align: center;
}
.summary-text {
  font-size: 14px;
  line-height: 2;
  color: rgba(245,230,200,0.8);
}

/* Again */
.again-wrap { text-align: center; margin-top: 28px; }
.again-btn {
  background: none;
  border: 1px solid var(--border);
  color: var(--ink-light);
  font-family: 'IM Fell English', serif;
  font-size: 13px;
  letter-spacing: 0.2em;
  padding: 12px 40px;
  cursor: pointer;
  transition: all 0.3s;
}
.again-btn:hover { border-color: var(--gold); color: var(--gold); }

.footer-note {
  font-family: 'EB Garamond', serif;
  font-style: italic;
  font-size: 11px;
  color: var(--ink-light);
  text-align: center;
  margin-top: 48px;
  opacity: 0.5;
  letter-spacing: 0.1em;
}

@media (max-width: 540px) {
  .spread-grid { grid-template-columns: 1fr; }
  .tarot-card { width: 80px; height: 128px; }
  .card-symbol { font-size: 24px; }
  .card-detail { padding: 20px 16px; }
  .detail-head { flex-direction: column; }
  .summary-card { padding: 20px; }
}
</style>
</head>
<body>

<div class="bg-wrap"></div>

<div class="container">

  <div class="header">
    <span class="header-emblem">🔮</span>
    <div class="header-rule">
      <div class="rule-line"></div>
      <div class="rule-center">✦</div>
      <div class="rule-line r"></div>
    </div>
    <h1>Tarot Oracle</h1>
    <div class="header-sub">タロット神託 · 78枚のカードが語る真実</div>
  </div>

  <div class="spread-section">
    <div class="section-heading">— Spread · スプレッドを選ぶ —</div>
    <div class="spread-grid">
      <button class="spread-btn active" onclick="selectSpread('one', this)">
        <div class="spread-btn-title">✦ One Card</div>
        <div class="spread-btn-desc">1枚引き｜今日のメッセージ</div>
      </button>
      <button class="spread-btn" onclick="selectSpread('three', this)">
        <div class="spread-btn-title">✦ Three Cards</div>
        <div class="spread-btn-desc">3枚引き｜過去・現在・未来</div>
      </button>
      <button class="spread-btn" onclick="selectSpread('celtic', this)">
        <div class="spread-btn-title">✦ Celtic Cross</div>
        <div class="spread-btn-desc">5枚引き｜ケルト十字（簡易）</div>
      </button>
      <button class="spread-btn" onclick="selectSpread('love', this)">
        <div class="spread-btn-title">✦ Love Spread</div>
        <div class="spread-btn-desc">恋愛専用｜2人の関係を読む</div>
      </button>
    </div>
  </div>

  <div class="question-wrap">
    <div class="q-label">— Question · 問いを立てる —</div>
    <textarea id="questionInput" rows="2" placeholder="心に問いを思い浮かべてください。例：この恋は成就するのか。仕事の転換期はいつか。"></textarea>
  </div>

  <div class="draw-wrap">
    <button class="draw-btn" id="drawBtn" onclick="drawCards()">
      <span>✦ カードを引く ✦</span>
    </button>
    <div class="shuffling" id="shuffling">
      <div class="shuffle-cards">
        <div class="sh-card"></div><div class="sh-card"></div><div class="sh-card"></div>
        <div class="sh-card"></div><div class="sh-card"></div>
      </div>
      <div class="shuffle-text">カードをシャッフルしています…</div>
    </div>
  </div>

  <div class="result-wrap" id="resultWrap">
    <div class="spread-layout" id="spreadLayout"></div>
    <div id="detailArea"></div>
    <div class="summary-card" id="summaryCard"></div>
    <div class="again-wrap">
      <button class="again-btn" onclick="resetReading()">✦ Reset · もう一度引く ✦</button>
    </div>
  </div>

  <div class="footer-note">タロットは内なる知恵を引き出す鏡です。カードをクリックすると詳細が表示されます。</div>
</div>

<script>
// ===== TAROT DATA =====
const majorArcana = [
  { id:0, name:'愚者', en:'The Fool', suit:'major', symbol:'🌟',
    keywords:['新しい始まり','自由','冒険','無邪気さ'],
    revKeywords:['無謀','無責任','方向性の欠如'],
    upright:'新たな出発を告げるカード。純粋な心で一歩を踏み出す時が来ています。恐れを手放し、直感を信じて進みましょう。過去の経験や常識にとらわれず、白紙の状態で物事を見ることが重要です。',
    reversed:'方向性を見失っている状態。無謀な行動や無責任さへの警告。今は立ち止まり、本当に進むべき道を見直す時です。',
    oracle:'宇宙はあなたの新しい冒険を支援しています。軽やかな心で歩み出しなさい。'

  { id:1, name:'魔術師', en:'The Magician', suit:'major', symbol:'⚡',
    keywords:['意志力','スキル','創造力','行動'],
    revKeywords:['未熟さ','操作','スキル不足'],
    upright:'あなたはすべての道具を持っています。意志と行動力で夢を現実に変える時です。あなたの能力と才能は今まさに開花しようとしています。目標を明確にして動きましょう。',
    reversed:'才能が活かしきれていない、または操作的な行動への警告。誠実に自分の力を使うことが大切です。',
    oracle:'あなたの中に全ての力があります。今こそその力を解き放つ時です。'
  },
  { id:2, name:'女教皇', en:'The High Priestess', suit:'major', symbol:'🌙',
    keywords:['直感','神秘','内なる知恵','秘密'],
    revKeywords:['隠された真実','直感無視','表面的判断'],
    upright:'深い直感と内なる知恵が答えを持っています。今は外よりも内側に目を向ける時。静寂の中に真実があります。他者の意見より自分の内なる声を信頼してください。',
    reversed:'表面的な情報に惑わされている。直感を無視することへの警告。真実が隠されている可能性があります。',

  { id:3, name:'女帝', en:'The Empress', suit:'major', symbol:'🌺',

    revKeywords:['停滞','依存','創造力の枯渇'],
    upright:'豊かさと創造の最高の時。あなたの愛と創造力が花開いています。新しいプロジェクト、妊娠、芸術活動など実りある展開が訪れます。自然の流れに従い、愛を注いでください。',
    reversed:'創造的なエネルギーが枯渇している状態。過保護や依存関係にも注意が必要です。',
    oracle:'大地のように豊かに、花のように咲き誇りなさい。あなたは愛そのものです。'
  },
  { id:4, name:'皇帝', en:'The Emperor', suit:'major', symbol:'👑',
    keywords:['権威','秩序','安定','リーダーシップ'],
    revKeywords:['専制','硬直','権力乱用'],
    upright:'安定と秩序を象徴するカード。計画を立て、規律を持って行動する時です。リーダーシップを発揮し、しっかりとした基盤を築いてください。論理的で戦略的なアプローチが成功をもたらします。',
    reversed:'権威の乱用や頑固さへの警告。柔軟性を持ち、他者の意見も聞き入れましょう。',

  },

  const suitKey = suit.name === 'ワンド' ? 'wands' : suit.name === 'カップ' ? 'cups' : suit.name === 'ソード' ? 'swords' : 'pentacles';
  const data = themes[suit.name][ri];

  return {
    keywords: data.k,
    revKeywords: data.rk,

const allCards = [...majorArcana, ...minorArcana];

// Spreads
const spreads = {
  one: { name:'ワンカード', positions: ['今日のメッセージ'] },
  three: { name:'スリーカード', positions: ['過去', '現在', '未来'] },
  celtic: { name:'ケルティック（簡易）', positions: ['現状', '障害', 'アドバイス', '結果', '隠れた影響'] },
  love: { name:'ラブスプレッド', positions: ['あなたの気持ち', '相手の気持ち', '二人の関係', '障害', '未来の可能性'] }
};

let currentSpread = 'one';
let drawnCards = [];
let selectedCardIndex = 0;

function selectSpread(type, btn) {
  document.querySelectorAll('.spread-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentSpread = type;
}

function shuffleArray(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function drawCards() {
  const btn = document.getElementById('drawBtn');
  const shuf = document.getElementById('shuffling');
  const wrap = document.getElementById('resultWrap');

  btn.disabled = true;
  shuf.classList.add('show');
  wrap.classList.remove('show');

  setTimeout(() => {
    const spread = spreads[currentSpread];
    const shuffled = shuffleArray(allCards);
    drawnCards = spread.positions.map((pos, i) => ({
      card: shuffled[i],
      position: pos,
      reversed: Math.random() < 0.3
    }));
    selectedCardIndex = 0;

    renderSpread();
    renderDetail(0);
    renderSummary();

    shuf.classList.remove('show');
    wrap.classList.add('show');
    btn.disabled = false;
    wrap.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, 2400);
}

function renderSpread() {
  const layout = document.getElementById('spreadLayout');
  layout.innerHTML = drawnCards.map((dc, i) => `
    <div class="tarot-card-wrap ${i === 0 ? 'selected' : ''}" onclick="selectCard(${i})">
      <div class="tarot-card">
        <div class="card-symbol ${dc.reversed ? 'reversed' : ''}">${dc.card.symbol}</div>
        <div class="card-num">${dc.card.suit === 'major' ? `大アルカナ ${dc.card.id}` : dc.card.suit}</div>
        <div class="card-name-on">${dc.card.name}</div>
        ${dc.reversed ? '<div class="card-reversed-badge">逆位置</div>' : ''}
      </div>
      <div class="card-position-label">${dc.position}</div>
    </div>
  `).join('');
}

function selectCard(i) {
  selectedCardIndex = i;
  document.querySelectorAll('.tarot-card-wrap').forEach((el, idx) => {
    el.classList.toggle('selected', idx === i);
  });
  renderDetail(i);
}

function renderDetail(i) {
  const dc = drawnCards[i];
  const c = dc.card;
  const rev = dc.reversed;
  const detail = document.getElementById('detailArea');

  detail.innerHTML = `
    <div class="card-detail">
      <div class="detail-head">
        <div class="detail-symbol-big ${rev ? 'reversed' : ''}">${c.symbol}</div>
        <div class="detail-title-group">
          <div class="detail-position">${dc.position} · ${c.suit === 'major' ? '大アルカナ' : c.suit}</div>
          <div class="detail-card-title">${c.name}</div>
          <div class="detail-card-sub">${c.en}</div>
          ${rev ? '<div class="reversed-label">逆位置</div>' : ''}
        </div>
      </div>

      <div class="detail-keywords">
        ${(rev ? c.revKeywords : c.keywords).map(k => `<div class="kw-tag ${rev ? 'rev' : ''}">${k}</div>`).join('')}
      </div>

      <div class="detail-sec-label">Reading · 解釈</div>
      <div class="detail-text">${rev ? c.reversed : c.upright}</div>

      <div class="oracle-box">
        <div class="detail-sec-label" style="margin-bottom:8px;">Oracle · 神託の言葉</div>
        <div class="oracle-text">${c.oracle}</div>
      </div>
    </div>
  `;
}

function renderSummary() {
  const spread = spreads[currentSpread];
  const summaries = {
    one: `今日のカードが示すメッセージを受け取ってください。このカードはあなたの潜在意識が最も必要としているテーマを映し出しています。`,
    three: `過去のカードが現在に影響を与え、現在の選択が未来を形作ります。三枚のカードの流れ全体から、あなたの道筋が見えてきます。`,
    celtic: `五枚のカードが多角的な視点からあなたの状況を照らし出しています。特に障害とアドバイスのカードに注目してください。`,
    love: `二人の感情と関係性の深層が五枚のカードに映し出されています。障害を理解し、未来の可能性に向かって歩んでください。`
  };

  document.getElementById('summaryCard').innerHTML = `
    <div class="summary-title">✦ ${spread.name} · 総合リーディング ✦</div>
    <div class="summary-text">${summaries[currentSpread]}<br><br>
    ${drawnCards.map(dc => `<strong>${dc.position}</strong>：${dc.card.name}${dc.reversed ? '（逆位置）' : ''}`).join(' ／ ')}
    </div>
  `;
}

function resetReading() {
  document.getElementById('resultWrap').classList.remove('show');
  document.getElementById('questionInput').value = '';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
