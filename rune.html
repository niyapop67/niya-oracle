<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ルーン占い｜Rune Oracle</title>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Noto+Serif+JP:wght@300;400;500&family=Cinzel:wght@400;600&family=EB+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0e1218;
  --bg2: #141a22;
  --frost: #e8f0f8;
  --frost2: #d0dce8;
  --ink: #0a1020;
  --ink-mid: #2a3a50;
  --ink-light: #506070;
  --silver: #a8b8c8;
  --silver-light: #c8d8e8;
  --silver-dim: rgba(168,184,200,0.2);
  --rune-gold: #c9b37e;
  --ice: #e0eeff;
  --border: rgba(168,184,200,0.25);
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: var(--bg);
  color: var(--frost);
  font-family: 'Noto Serif JP', serif;
  min-height: 100vh;
  overflow-x: hidden;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(168,184,200,0.02) 3px, rgba(168,184,200,0.02) 6px),
    repeating-linear-gradient(90deg, transparent, transparent 3px, rgba(168,184,200,0.015) 3px, rgba(168,184,200,0.015) 6px);
  pointer-events: none;
  z-index: 100;
}

.bg-wrap {
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 80% 40% at 50% 0%, rgba(100,140,200,0.12) 0%, transparent 60%),
    radial-gradient(ellipse 40% 60% at 0% 80%, rgba(80,120,180,0.08) 0%, transparent 60%),
    radial-gradient(ellipse 50% 50% at 100% 20%, rgba(168,184,200,0.06) 0%, transparent 60%),
    var(--bg);
  z-index: 0;
  pointer-events: none;
}

/* 星のきらめき */
.stars {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  overflow: hidden;
}
.star {
  position: absolute;
  width: 2px;
  height: 2px;
  background: var(--silver-light);
  border-radius: 50%;
  animation: twinkle var(--dur, 3s) ease-in-out infinite;
  animation-delay: var(--delay, 0s);
  opacity: 0;
}
@keyframes twinkle {
  0%,100% { opacity: 0; transform: scale(1); }
  50% { opacity: 0.7; transform: scale(1.5); }
}

.container {
  position: relative;
  z-index: 1;
  max-width: 720px;
  margin: 0 auto;
  padding: 52px 24px 80px;
}

/* ヘッダー */
.header { text-align: center; margin-bottom: 52px; }

.header-rune {
  font-size: 64px;
  margin-bottom: 12px;
  display: block;
  animation: floatRune 6s ease-in-out infinite;
  color: var(--rune-gold);
  font-family: 'EB Garamond', serif;
  text-shadow: 0 0 30px rgba(201,179,126,0.4);
}
@keyframes floatRune { 0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);} }

.header-title {
  font-family: 'Cinzel', serif;
  font-size: clamp(22px, 5vw, 34px);
  font-weight: 600;
  letter-spacing: 0.15em;
  color: var(--silver-light);
  margin-bottom: 6px;
}
.header-sub {
  font-family: 'IM Fell English', serif;
  font-size: 14px;
  color: var(--silver);
  letter-spacing: 0.2em;
  font-style: italic;
  margin-bottom: 20px;
}
.header-divider {
  display: flex;
  align-items: center;
  gap: 12px;
  justify-content: center;
  margin-bottom: 16px;
}
.header-divider span { font-size: 10px; color: var(--silver); letter-spacing: 0.3em; text-transform: uppercase; }
.header-divider::before, .header-divider::after {
  content: '';
  flex: 1;
  max-width: 80px;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--border), transparent);
}
.header-desc {
  font-size: 13px;
  color: var(--ink-light);
  line-height: 1.8;
  max-width: 480px;
  margin: 0 auto;
  color: #7090a8;
}

/* 質問エリア */
.question-section {
  background: linear-gradient(135deg, rgba(168,184,200,0.06), rgba(100,140,200,0.04));
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 32px;
  margin-bottom: 32px;
  backdrop-filter: blur(4px);
}
.question-label {
  font-size: 12px;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: var(--silver);
  margin-bottom: 14px;
  font-family: 'Cinzel', serif;
}
.question-input {
  width: 100%;
  background: rgba(168,184,200,0.06);
  border: 1px solid rgba(168,184,200,0.2);
  border-radius: 10px;
  padding: 14px 18px;
  color: var(--frost);
  font-family: 'Noto Serif JP', serif;
  font-size: 15px;
  resize: none;
  outline: none;
  transition: border-color 0.3s;
  min-height: 80px;
}
.question-input:focus { border-color: rgba(168,184,200,0.5); }
.question-input::placeholder { color: #405060; }

/* キャスト方法選択 */
.cast-methods {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 28px;
}
.cast-btn {
  background: rgba(168,184,200,0.06);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px 10px;
  cursor: pointer;
  text-align: center;
  transition: all 0.3s;
  color: var(--frost2);
}
.cast-btn:hover { background: rgba(168,184,200,0.12); border-color: rgba(168,184,200,0.4); }
.cast-btn.active {
  background: rgba(201,179,126,0.15);
  border-color: rgba(201,179,126,0.5);
  color: var(--rune-gold);
}
.cast-btn-icon { font-size: 22px; margin-bottom: 6px; }
.cast-btn-name { font-size: 13px; font-weight: 500; margin-bottom: 3px; }
.cast-btn-desc { font-size: 11px; color: var(--silver); line-height: 1.4; }

/* 詠唱ボタン */
.cast-action {
  text-align: center;
  margin-bottom: 40px;
}
.btn-cast {
  background: linear-gradient(135deg, rgba(201,179,126,0.2), rgba(168,184,200,0.1));
  border: 1px solid rgba(201,179,126,0.4);
  color: var(--rune-gold);
  font-family: 'Cinzel', serif;
  font-size: 15px;
  letter-spacing: 0.2em;
  padding: 16px 48px;
  border-radius: 50px;
  cursor: pointer;
  transition: all 0.4s;
  position: relative;
  overflow: hidden;
}
.btn-cast::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(201,179,126,0.15), transparent);
  opacity: 0;
  transition: opacity 0.3s;
}
.btn-cast:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(201,179,126,0.2); }
.btn-cast:hover::before { opacity: 1; }
.btn-cast:active { transform: translateY(0); }

/* ルーンストーン投擲アニメーション */
.casting-area {
  display: none;
  text-align: center;
  padding: 60px 0;
}
.casting-area.active { display: block; }
.casting-stones {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin-bottom: 24px;
}
.casting-stone {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  background: linear-gradient(135deg, #2a3a50, #1a2a40);
  border: 2px solid rgba(201,179,126,0.4);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  color: var(--rune-gold);
  animation: stoneFloat 0.8s ease-in-out infinite alternate;
}
.casting-stone:nth-child(2) { animation-delay: 0.2s; }
.casting-stone:nth-child(3) { animation-delay: 0.4s; }
@keyframes stoneFloat { from{transform:translateY(0) rotate(-5deg);} to{transform:translateY(-16px) rotate(5deg);} }
.casting-text { color: var(--silver); font-size: 14px; letter-spacing: 0.2em; animation: pulse 1.5s ease-in-out infinite; }
@keyframes pulse { 0%,100%{opacity:0.5;} 50%{opacity:1;} }

/* 結果エリア */
.result-area { display: none; }
.result-area.active { display: block; }

/* ルーン石の表示 */
.runes-display {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin-bottom: 48px;
  flex-wrap: wrap;
}

.rune-stone {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  animation: stoneReveal 0.8s ease-out forwards;
  opacity: 0;
  cursor: pointer;
}
.rune-stone:nth-child(2) { animation-delay: 0.3s; }
.rune-stone:nth-child(3) { animation-delay: 0.6s; }
@keyframes stoneReveal {
  from { opacity: 0; transform: translateY(30px) scale(0.8); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

.stone-circle {
  width: 100px;
  height: 100px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #2a3a50, #0e1a28);
  border: 2px solid rgba(201,179,126,0.35);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  box-shadow: 0 4px 24px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05);
  transition: transform 0.3s, box-shadow 0.3s;
}
.stone-circle:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 32px rgba(201,179,126,0.2), inset 0 1px 0 rgba(255,255,255,0.08);
}
.stone-circle.reversed { transform: rotate(180deg); }
.stone-circle.reversed:hover { transform: rotate(180deg) scale(1.05); }

/* SVGルーン描画エリア */
.stone-svg {
  width: 52px;
  height: 52px;
}

.stone-position {
  font-size: 11px;
  color: var(--silver);
  letter-spacing: 0.15em;
  text-transform: uppercase;
  font-family: 'Cinzel', serif;
}
.stone-name-ja { font-size: 14px; color: var(--frost); font-weight: 500; }
.stone-reversed-badge {
  font-size: 10px;
  color: #e07060;
  letter-spacing: 0.1em;
  display: none;
}
.stone-reversed-badge.show { display: block; }

/* 区切り */
.section-divider {
  display: flex;
  align-items: center;
  gap: 16px;
  margin: 36px 0 28px;
}
.section-divider::before, .section-divider::after {
  content: ''; flex: 1; height: 1px;
  background: linear-gradient(90deg, transparent, var(--border), transparent);
}
.section-divider-label {
  font-family: 'Cinzel', serif;
  font-size: 11px;
  letter-spacing: 0.3em;
  color: var(--silver);
  text-transform: uppercase;
  white-space: nowrap;
}

/* 各ルーンの解釈カード */
.reading-cards { display: flex; flex-direction: column; gap: 24px; margin-bottom: 40px; }

.reading-card {
  background: linear-gradient(135deg, rgba(168,184,200,0.06), rgba(100,140,200,0.03));
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 28px;
  animation: cardReveal 0.6s ease-out forwards;
  opacity: 0;
}
.reading-card:nth-child(1) { animation-delay: 0.8s; }
.reading-card:nth-child(2) { animation-delay: 1.1s; }
.reading-card:nth-child(3) { animation-delay: 1.4s; }
@keyframes cardReveal { from{opacity:0;transform:translateX(-16px);} to{opacity:1;transform:translateX(0);} }

.card-header {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 20px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
}
.card-rune-symbol {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #2a3a50, #0e1a28);
  border: 1px solid rgba(201,179,126,0.3);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.card-rune-svg { width: 28px; height: 28px; }
.card-title-block {}
.card-position { font-size: 11px; color: var(--silver); letter-spacing: 0.2em; text-transform: uppercase; font-family: 'Cinzel', serif; margin-bottom: 3px; }
.card-name { font-size: 20px; color: var(--frost); font-weight: 500; }
.card-name-en { font-size: 13px; color: var(--silver); font-family: 'EB Garamond', serif; font-style: italic; }
.card-reversed { font-size: 11px; color: #e07060; margin-left: 8px; }

.card-keywords {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 16px;
}
.keyword-tag {
  font-size: 11px;
  padding: 4px 12px;
  border-radius: 20px;
  border: 1px solid rgba(201,179,126,0.25);
  color: var(--rune-gold);
  background: rgba(201,179,126,0.07);
  letter-spacing: 0.05em;
}

.card-reading {
  font-size: 14px;
  line-height: 2;
  color: var(--frost2);
}

/* 総合リーディング */
.overall-section {
  background: linear-gradient(135deg, rgba(201,179,126,0.08), rgba(168,184,200,0.04));
  border: 1px solid rgba(201,179,126,0.25);
  border-radius: 16px;
  padding: 32px;
  margin-bottom: 40px;
  animation: cardReveal 0.6s ease-out 1.8s forwards;
  opacity: 0;
}
.overall-title {
  font-family: 'Cinzel', serif;
  font-size: 13px;
  letter-spacing: 0.25em;
  color: var(--rune-gold);
  text-transform: uppercase;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.overall-title::before {
  content: '᛭';
  font-size: 18px;
}
.overall-text {
  font-size: 15px;
  line-height: 2.1;
  color: var(--frost);
}

/* やり直しボタン */
.reset-area { text-align: center; }
.btn-reset {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--silver);
  font-family: 'Cinzel', serif;
  font-size: 13px;
  letter-spacing: 0.2em;
  padding: 12px 36px;
  border-radius: 50px;
  cursor: pointer;
  transition: all 0.3s;
}
.btn-reset:hover { border-color: rgba(168,184,200,0.5); color: var(--frost); }

/* ルーンSVG描画関数用 */
.rune-svg-container { display: block; }

/* レスポンシブ */
@media (max-width: 480px) {
  .cast-methods { grid-template-columns: 1fr; }
  .runes-display { gap: 14px; }
  .stone-circle { width: 80px; height: 80px; }
  .stone-svg { width: 40px; height: 40px; }
}
</style>
</head>
<body>

<div class="bg-wrap"></div>
<div class="stars" id="stars"></div>

<div class="container">

  <!-- ヘッダー -->
  <header class="header">
    <span class="header-rune">ᚠ</span>
    <div class="header-title">Rune Oracle</div>
    <div class="header-sub">Ancient Wisdom of the Elder Futhark</div>
    <div class="header-divider"><span>ルーン占い</span></div>
    <p class="header-desc">古代ノルドの知恵が刻まれたルーン文字。<br>石を投げ、運命の声に耳を傾けましょう。</p>
  </header>

  <!-- 質問・設定エリア -->
  <div id="inputSection">
    <div class="question-section">
      <div class="question-label">あなたの問い</div>
      <textarea class="question-input" id="questionInput" placeholder="今日の運勢、仕事、恋愛、人間関係… 心に浮かんだことを入力してください。"></textarea>
    </div>

    <!-- キャスト方法 -->
    <div class="cast-methods">
      <div class="cast-btn active" data-method="1" onclick="selectMethod(this, 1)">
        <div class="cast-btn-icon">ᚠ</div>
        <div class="cast-btn-name">1ルーン引き</div>
        <div class="cast-btn-desc">今この瞬間のメッセージ</div>
      </div>
      <div class="cast-btn" data-method="3" onclick="selectMethod(this, 3)">
        <div class="cast-btn-icon">ᚠ ᚢ ᚦ</div>
        <div class="cast-btn-name">3ルーン展開</div>
        <div class="cast-btn-desc">過去・現在・未来</div>
      </div>
      <div class="cast-btn" data-method="norns" onclick="selectMethod(this, 'norns')">
        <div class="cast-btn-icon">ᚾ</div>
        <div class="cast-btn-name">ノルンの紡ぎ</div>
        <div class="cast-btn-desc">状況・障害・助言</div>
      </div>
    </div>

    <div class="cast-action">
      <button class="btn-cast" onclick="startCasting()">
        ᚱᚢᚾᛖ — ルーンを投げる
      </button>
    </div>
  </div>

  <!-- 詠唱中アニメーション -->
  <div class="casting-area" id="castingArea">
    <div class="casting-stones">
      <div class="casting-stone">ᚠ</div>
      <div class="casting-stone">ᚢ</div>
      <div class="casting-stone">ᚦ</div>
    </div>
    <div class="casting-text">ルーンが語りかけています…</div>
  </div>

  <!-- 結果 -->
  <div class="result-area" id="resultArea">
    <div class="runes-display" id="runesDisplay"></div>
    <div class="reading-cards" id="readingCards"></div>
    <div class="section-divider"><span class="section-divider-label">総合リーディング</span></div>
    <div class="overall-section">
      <div class="overall-title">ルーンのメッセージ</div>
      <div class="overall-text" id="overallText"></div>
    </div>
    <div class="reset-area">
      <button class="btn-reset" onclick="resetReading()">ᚱ — 新しいリーディングを始める</button>
    </div>
  </div>

</div><!-- /container -->

<script>
// ===== 星生成 =====
(function(){
  const stars = document.getElementById('stars');
  for(let i=0;i<60;i++){
    const s=document.createElement('div');
    s.className='star';
    s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;--dur:${2+Math.random()*4}s;--delay:${Math.random()*4}s;`;
    stars.appendChild(s);
  }
})();

// ===== ルーンデータ =====
const RUNES = [
  { sym:'ᚠ', name:'フェフ',   en:'Fehu',    keys:['豊かさ','富','繁栄','流れ'],
    norm:'豊かさとエネルギーの流れを示します。受け取ることへの開放性を持ちましょう。物質的・精神的な富が流れ込む兆しです。',
    rev:'エネルギーの滞りや損失に注意。執着を手放すことで流れが戻ります。' },
  { sym:'ᚢ', name:'ウルズ',   en:'Uruz',    keys:['力','野生','健康','変化'],
    norm:'内なる野生の力と健康を示します。変化を恐れず、本能に従って進む時です。',
    rev:'エネルギー不足や体調に気をつけて。無理をせず休息を。' },
  { sym:'ᚦ', name:'サリサズ', en:'Thurisaz', keys:['試練','変容','突破','防衛'],
    norm:'困難な状況への直面を示しますが、それは変容への扉。今こそ正面から向き合う時です。',
    rev:'衝動的な行動は避けて。内省と慎重さが必要な時期です。' },
  { sym:'ᚨ', name:'アンスズ', en:'Ansuz',   keys:['言葉','知恵','メッセージ','神の声'],
    norm:'重要なメッセージや啓示が届きます。コミュニケーションと知恵の時。耳を澄ませて。',
    rev:'誤解や言葉のすれ違いに注意。よく確認してから発言を。' },
  { sym:'ᚱ', name:'ライド',   en:'Raidho',  keys:['旅','動き','リズム','正しい道'],
    norm:'旅や移動、物事の進展を示します。正しいリズムで流れに乗って進みましょう。',
    rev:'計画の遅延や方向のズレ。立ち止まって方向を確認して。' },
  { sym:'ᚲ', name:'ケン',     en:'Kenaz',   keys:['炎','創造','明晰','知識'],
    norm:'内なる炎が灯ります。創造力と洞察力が高まる時。技術や知識が実を結びます。',
    rev:'情熱の衰えや創造力の低下。何が本当に大切かを見つめ直して。' },
  { sym:'ᚷ', name:'ゲボ',     en:'Gebo',    keys:['贈り物','交換','愛','調和'],
    norm:'与えることと受け取ることの調和を示します。パートナーシップや贈り物に吉。',
    rev:'(正逆なし) 関係性のバランスを見直す時。' },
  { sym:'ᚹ', name:'ウィニョ', en:'Wunjo',   keys:['喜び','達成','調和','幸福'],
    norm:'幸福と達成の時が来ました。努力が報われ、喜びと調和がもたらされます。',
    rev:'喜びの遅延や内面的な緊張。完璧主義を手放すことで道が開けます。' },
  { sym:'ᚺ', name:'ハガラズ', en:'Hagalaz', keys:['試練','嵐','浄化','変化'],
    norm:'予期せぬ変化や試練を示します。しかし嵐の後には清らかな空が広がります。浄化の時。',
    rev:'(正逆なし) 嵐の中心に立ち、静かな眼で状況を見つめて。' },
  { sym:'ᚾ', name:'ナウシズ', en:'Nauthiz', keys:['必然','制約','耐久','学び'],
    norm:'制約や困難の中に深い学びがあります。今は踏ん張り時。必然の力に従いましょう。',
    rev:'義務や制限が重くのしかかっています。助けを求めることも勇気です。' },

// ルーンをSVGで描画（提供画像スタイルに準拠）
function drawRuneSVG(sym, size=52, color='#c9b37e') {
  const s = size / 2;
  const cx = s, cy = s;
  const sw = Math.max(2, size / 14);
  const L = (x1,y1,x2,y2) =>
    `<line x1="${cx+x1}" y1="${cy+y1}" x2="${cx+x2}" y2="${cy+y2}" stroke="${color}" stroke-width="${sw}" stroke-linecap="round"/>`;
  let paths = '';
  const h = s * 0.85;
  switch(sym) {
    case 'ᚠ': paths = L(-h*.2,-h,-h*.2,h) + L(-h*.2,-h*.3,h*.6,-h) + L(-h*.2,h*.2,h*.6,-h*.25); break;
    case 'ᚢ': paths = L(-h*.4,-h,-h*.4,h*.2) + L(h*.4,-h,h*.4,h*.2) + L(-h*.4,h*.2,h*.4,h*.2); break;
    case 'ᚦ': paths = L(0,-h,0,h) + L(0,-h*.3,h*.55,0) + L(0,h*.3,h*.55,0); break;
    case 'ᚨ': paths = L(h*.2,-h,h*.2,h) + L(h*.2,-h,-h*.5,-h*.5) + L(h*.2,-h*.15,-h*.5,h*.3); break;
    case 'ᚱ': paths = L(-h*.3,-h,-h*.3,h) + L(-h*.3,-h,h*.5,-h*.3) + L(-h*.3,-h*.15,h*.5,-h*.3) + L(-h*.3,-h*.15,h*.5,h); break;
    case 'ᚲ': paths = L(h*.3,-h,-h*.3,0) + L(-h*.3,0,h*.3,h); break;
    case 'ᚷ': paths = L(-h,-h,h,h) + L(h,-h,-h,h); break;
    case 'ᚹ': paths = L(-h*.3,-h,-h*.3,h) + L(-h*.3,-h,h*.5,-h*.25) + L(-h*.3,h*.25,h*.5,-h*.25); break;
    case 'ᚺ': paths = L(-h*.45,-h,-h*.45,h) + L(h*.45,-h,h*.45,h) + L(-h*.45,-h*.2,h*.45,h*.25); break;
    case 'ᚾ': paths = L(-h*.4,-h,-h*.4,h) + L(h*.4,-h,h*.4,h) + L(-h*.4,-h*.4,h*.4,h*.4); break;
    case 'ᛁ': paths = L(0,-h,0,h); break;
    case 'ᛃ': paths = L(-h*.4,-h,h*.4,-h*.3) + L(h*.4,-h*.3,-h*.4,h*.3) + L(-h*.4,h*.3,h*.4,h); break;
    case 'ᛇ': paths = L(0,-h,0,h) + L(0,-h*.3,-h*.5,-h) + L(0,h*.3,h*.5,h); break;
    case 'ᛈ': paths = L(-h*.3,-h,-h*.3,h) + L(-h*.3,-h,h*.5,-h) + L(h*.5,-h,h*.5,0) + L(-h*.3,0,h*.5,0); break;
    case 'ᛉ': paths = L(0,h*.1,0,h) + L(0,h*.1,-h*.65,-h) + L(0,h*.1,h*.65,-h); break;
    case 'ᛊ': paths = L(h*.3,-h,-h*.3,-h*.3) + L(-h*.3,-h*.3,h*.3,h*.3) + L(h*.3,h*.3,-h*.3,h); break;
    case 'ᛏ': paths = L(0,-h,0,h) + L(0,-h,-h*.5,-h*.25) + L(0,-h,h*.5,-h*.25); break;
    case 'ᛒ': paths = L(-h*.3,-h,-h*.3,h) + L(-h*.3,-h,h*.5,-h*.65) + L(h*.5,-h*.65,h*.5,-h*.15) + L(-h*.3,-h*.15,h*.5,-h*.15) + L(-h*.3,-h*.15,h*.5,h*.3) + L(h*.5,h*.3,h*.5,h*.75) + L(-h*.3,h*.75,h*.5,h*.75); break;
    case 'ᛖ': paths = L(-h*.45,-h,-h*.45,h) + L(h*.45,-h,h*.45,h) + L(-h*.45,-h,0,-h*.2) + L(h*.45,-h,0,-h*.2); break;
    case 'ᛗ': paths = L(-h*.45,-h,-h*.45,h) + L(h*.45,-h,h*.45,h) + L(-h*.45,-h,0,0) + L(h*.45,-h,0,0); break;
    case 'ᛚ': paths = L(-h*.3,-h,-h*.3,h*.25) + L(-h*.3,h*.25,h*.5,h); break;
    case 'ᛜ': paths = L(0,-h,h*.5,0) + L(h*.5,0,0,h) + L(0,h,-h*.5,0) + L(-h*.5,0,0,-h); break;
    case 'ᛞ': paths = L(-h*.45,-h,-h*.45,h) + L(h*.45,-h,h*.45,h) + L(-h*.45,-h,h*.45,h) + L(-h*.45,h,h*.45,-h); break;
    case 'ᛟ': paths = L(0,-h*.45,h*.45,0) + L(h*.45,0,0,h*.45) + L(0,h*.45,-h*.45,0) + L(-h*.45,0,0,-h*.45) + L(-h*.3,h*.45,h*.3,h*.45) + L(0,h*.45,0,h); break;
    default:  paths = L(0,-h,0,h); break;
  }
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${size} ${size}" class="rune-svg-container">${paths}</svg>`;
}

// ===== 状態 =====
let currentMethod = 1;
let drawn = [];

function selectMethod(el, method) {
  document.querySelectorAll('.cast-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  currentMethod = method;
}

function startCasting() {
  const q = document.getElementById('questionInput').value.trim();
  document.getElementById('inputSection').style.display = 'none';
  document.getElementById('castingArea').classList.add('active');

  const count = currentMethod === 1 ? 1 : 3;
  setTimeout(() => showResult(q, count), 1800);
}

function showResult(question, count) {
  document.getElementById('castingArea').classList.remove('active');
  document.getElementById('resultArea').classList.add('active');

  // ルーンをランダム選択
  const shuffled = [...RUNES].sort(() => Math.random() - 0.5);
  drawn = shuffled.slice(0, count).map(r => ({
    ...r,
    reversed: Math.random() < 0.3  // 30%の確率で逆位置
  }));

  // 展開名
  const layouts = {
    1: ['今のメッセージ'],
    3: ['過去', '現在', '未来'],
    norns: ['状況', '障害', '助言']
  };
  const posNames = layouts[currentMethod] || layouts[1];

  // ルーン石表示
  const display = document.getElementById('runesDisplay');
  display.innerHTML = drawn.map((r, i) => `
    <div class="rune-stone">
      <div class="stone-circle ${r.reversed ? 'reversed' : ''}">
        ${drawRuneSVG(r.sym, 52, '#c9b37e')}
      </div>
      <div class="stone-position">${posNames[i] || ''}</div>
      <div class="stone-name-ja">${r.name}</div>
      <div class="stone-reversed-badge ${r.reversed ? 'show' : ''}">逆位置</div>
    </div>
  `).join('');

  // 各ルーン解釈カード
  const cards = document.getElementById('readingCards');
  cards.innerHTML = drawn.map((r, i) => `
    <div class="reading-card">
      <div class="card-header">
        <div class="card-rune-symbol">
          ${drawRuneSVG(r.sym, 28, '#c9b37e')}
        </div>
        <div class="card-title-block">
          <div class="card-position">${posNames[i] || ''}</div>
          <div class="card-name">${r.name} <span class="card-name-en">${r.en}</span>${r.reversed ? '<span class="card-reversed">（逆位置）</span>' : ''}</div>
        </div>
      </div>
      <div class="card-keywords">
        ${r.keys.map(k => `<span class="keyword-tag">${r.reversed ? '⟳ ' : ''}${k}</span>`).join('')}
      </div>
      <div class="card-reading">${r.reversed ? r.rev : r.norm}</div>
    </div>
  `).join('');

  // 総合リーディング
  const overall = generateOverall(drawn, question, posNames);
  document.getElementById('overallText').textContent = overall;
}

function generateOverall(drawn, question, posNames) {
  if (drawn.length === 1) {
    const r = drawn[0];
    return `${r.name}のルーンが選ばれました。${r.reversed ? '逆位置として現れたこのルーンは、' : 'このルーンは、'}${r.reversed ? r.rev : r.norm}${question ? '「' + question + '」というあなたの問いに対して、' : ''}今この瞬間に必要なメッセージをもたらしています。`;
  }
  if (drawn.length === 3) {
    return `${posNames[0]}に${drawn[0].name}、${posNames[1]}に${drawn[1].name}、${posNames[2]}に${drawn[2].name}が現れました。${drawn[0].name}の${drawn[0].keys[0]}というエネルギーが背景にあり、現在は${drawn[1].name}の${drawn[1].keys[0]}という力が働いています。そして${drawn[2].name}が示す${drawn[2].keys[0]}へと流れていく流れが見えます。${question ? '「' + question + '」について、' : ''}ルーンはあなたが既にその答えを持っていることを示しています。`;
  }
  return '';
}

function resetReading() {
  document.getElementById('resultArea').classList.remove('active');
  document.getElementById('inputSection').style.display = 'block';
  document.getElementById('readingCards').innerHTML = '';
  document.getElementById('runesDisplay').innerHTML = '';
  drawn = [];
}
</script>
