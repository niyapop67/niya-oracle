<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数秘術診断｜Numerology</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Noto+Serif+JP:wght@300;400;500&family=Rajdhani:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #04060f;
  --bg2: #070b18;
  --blue-deep: #0a0e24;
  --blue: #1a2a6c;
  --cyan: #4fc3f7;
  --cyan-dim: rgba(79,195,247,0.15);
  --cyan-glow: rgba(79,195,247,0.4);
  --gold: #e8c97a;
  --gold-dim: rgba(232,201,122,0.2);
  --text: #e8eaf6;
  --text-dim: #7986cb;
  --text-muted: #3949ab;
  --violet: #7c4dff;
  --violet-dim: rgba(124,77,255,0.2);
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Serif JP', serif;
  min-height: 100vh;
  overflow-x: hidden;
}

/* Animated background */
.bg-canvas {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
}

canvas { position: absolute; inset: 0; }

.bg-overlay {
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 80% 60% at 50% 0%, rgba(26,42,108,0.6) 0%, transparent 70%),
    radial-gradient(ellipse 40% 40% at 80% 80%, rgba(124,77,255,0.15) 0%, transparent 60%),
    radial-gradient(ellipse 40% 40% at 20% 60%, rgba(79,195,247,0.1) 0%, transparent 60%);
  z-index: 0;
  pointer-events: none;
}

/* Layout */
.container {
  position: relative;
  z-index: 1;
  max-width: 680px;
  margin: 0 auto;
  padding: 56px 24px 80px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* Header */
.header {
  text-align: center;
  margin-bottom: 52px;
}

.header-icon {
  width: 64px;
  height: 64px;
  margin: 0 auto 20px;
  position: relative;
  animation: spinSlow 20s linear infinite;
}

.header-icon svg { width: 100%; height: 100%; }

@keyframes spinSlow {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

.eyebrow {
  font-family: 'Rajdhani', sans-serif;
  font-size: 11px;
  letter-spacing: 0.4em;
  color: var(--cyan);
  text-transform: uppercase;
  margin-bottom: 12px;
  opacity: 0.8;
}

h1 {
  font-family: 'Cinzel', serif;
  font-size: clamp(28px, 7vw, 48px);
  font-weight: 600;
  letter-spacing: 0.15em;
  background: linear-gradient(135deg, var(--text) 0%, var(--cyan) 50%, var(--gold) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  line-height: 1.2;
  margin-bottom: 10px;
}

.header-sub {
  font-family: 'Rajdhani', sans-serif;
  font-size: 12px;
  color: var(--text-dim);
  letter-spacing: 0.25em;
}

.divider {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 20px 0;
  width: 200px;
}

.div-line {
  flex: 1;
  height: 1px;
  background: linear-gradient(to right, transparent, var(--cyan-dim), transparent);
}

.div-dot {
  width: 4px; height: 4px;
  background: var(--cyan);
  border-radius: 50%;
  box-shadow: 0 0 8px var(--cyan);
}

/* Form */
.form-card {
  background: rgba(7,11,24,0.8);
  border: 1px solid rgba(79,195,247,0.15);
  width: 100%;
  padding: 40px;
  position: relative;
  backdrop-filter: blur(12px);
  margin-bottom: 32px;
}

.form-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(to right, transparent, var(--cyan), var(--violet), transparent);
}

.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  margin-bottom: 24px;
}

.form-group { display: flex; flex-direction: column; gap: 8px; }
.form-group.full { grid-column: 1 / -1; }

.form-label {
  font-family: 'Rajdhani', sans-serif;
  font-size: 10px;
  letter-spacing: 0.3em;
  color: var(--cyan);
  text-transform: uppercase;
  opacity: 0.8;
}

.form-input {
  background: rgba(10,14,36,0.8);
  border: 1px solid rgba(79,195,247,0.2);
  color: var(--text);
  font-family: 'Noto Serif JP', serif;
  font-size: 15px;
  padding: 13px 16px;
  outline: none;
  transition: border-color 0.3s, box-shadow 0.3s;
  border-radius: 2px;
}

.form-input::placeholder { color: var(--text-muted); font-size: 13px; }
.form-input:focus {
  border-color: rgba(79,195,247,0.5);
  box-shadow: 0 0 0 3px rgba(79,195,247,0.06), 0 0 20px rgba(79,195,247,0.1);
}

.calc-btn {
  width: 100%;
  background: transparent;
  border: 1px solid var(--cyan);
  color: var(--cyan);
  font-family: 'Cinzel', serif;
  font-size: 14px;
  letter-spacing: 0.3em;
  padding: 18px;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: all 0.4s;
}

.calc-btn::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, var(--cyan), var(--violet));
  opacity: 0;
  transition: opacity 0.4s;
}

.calc-btn:hover::before { opacity: 1; }
.calc-btn:hover { color: var(--bg); border-color: transparent; }
.calc-btn span { position: relative; z-index: 1; }
.calc-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.calc-btn:disabled::before { display: none; }

/* Computing animation */
.computing {
  display: none;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  padding: 20px 0;
}
.computing.show { display: flex; }

.compute-ring {
  width: 48px; height: 48px;
  border: 2px solid rgba(79,195,247,0.2);
  border-top-color: var(--cyan);
  border-radius: 50%;
  animation: spin 1s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.compute-text {
  font-family: 'Rajdhani', sans-serif;
  font-size: 11px;
  letter-spacing: 0.3em;
  color: var(--text-dim);
}

/* Result */
.result-wrap {
  width: 100%;
  opacity: 0;
  transform: translateY(24px);
  transition: all 0.9s cubic-bezier(0.4,0,0.2,1);
  pointer-events: none;
}
.result-wrap.show { opacity: 1; transform: translateY(0); pointer-events: auto; }

/* Number display */
.numbers-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  margin-bottom: 28px;
}

.num-card {
  background: rgba(7,11,24,0.9);
  border: 1px solid rgba(79,195,247,0.12);
  padding: 24px 16px;
  text-align: center;
  position: relative;
  cursor: pointer;
  transition: all 0.3s;
  backdrop-filter: blur(8px);
}

.num-card::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, var(--cyan-dim), var(--violet-dim));
  opacity: 0;
  transition: opacity 0.3s;
}

.num-card:hover::before, .num-card.active::before { opacity: 1; }
.num-card.active { border-color: rgba(79,195,247,0.4); }

.num-label {
  font-family: 'Rajdhani', sans-serif;
  font-size: 9px;
  letter-spacing: 0.25em;
  color: var(--text-dim);
  text-transform: uppercase;
  margin-bottom: 10px;
  position: relative;
  z-index: 1;
}

.num-value {
  font-family: 'Cinzel', serif;
  font-size: 44px;
  font-weight: 700;
  background: linear-gradient(135deg, var(--cyan), var(--gold));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  line-height: 1;
  position: relative;
  z-index: 1;
}

.num-name {
  font-size: 11px;
  color: var(--text-dim);
  margin-top: 6px;
  letter-spacing: 0.1em;
  position: relative;
  z-index: 1;
}

/* Detail card */
.detail-card {
  background: rgba(7,11,24,0.85);
  border: 1px solid rgba(79,195,247,0.15);
  padding: 36px;
  position: relative;
  backdrop-filter: blur(12px);
  margin-bottom: 20px;
}

.detail-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(to right, transparent, var(--violet), var(--cyan), transparent);
}

.detail-header {
  display: flex;
  align-items: center;
  gap: 20px;
  margin-bottom: 28px;
  padding-bottom: 24px;
  border-bottom: 1px solid rgba(79,195,247,0.08);
}

.detail-num-big {
  font-family: 'Cinzel', serif;
  font-size: 72px;
  font-weight: 700;
  background: linear-gradient(135deg, var(--cyan), var(--violet), var(--gold));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  line-height: 1;
  flex-shrink: 0;
  text-shadow: none;
  filter: drop-shadow(0 0 20px rgba(79,195,247,0.3));
}

.detail-title-group { flex: 1; }

.detail-num-label {
  font-family: 'Rajdhani', sans-serif;
  font-size: 10px;
  letter-spacing: 0.3em;
  color: var(--cyan);
  opacity: 0.7;
  margin-bottom: 6px;
}

.detail-num-title {
  font-family: 'Cinzel', serif;
  font-size: 20px;
  color: var(--text);
  letter-spacing: 0.1em;
  margin-bottom: 4px;
}

.detail-keyword {
  font-family: 'Rajdhani', sans-serif;
  font-size: 12px;
  color: var(--gold);
  letter-spacing: 0.2em;
  opacity: 0.8;
}

/* Traits */
.traits-row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 24px;
}

.trait-tag {
  font-family: 'Rajdhani', sans-serif;
  font-size: 11px;
  letter-spacing: 0.15em;
  color: var(--cyan);
  border: 1px solid rgba(79,195,247,0.3);
  padding: 5px 14px;
  border-radius: 20px;
  background: var(--cyan-dim);
}

.sec-title {
  font-family: 'Rajdhani', sans-serif;
  font-size: 10px;
  letter-spacing: 0.3em;
  color: var(--cyan);
  text-transform: uppercase;
  margin-bottom: 10px;
  opacity: 0.7;
  display: flex;
  align-items: center;
  gap: 10px;
}

.sec-title::after {
  content: '';
  flex: 1;
  height: 1px;
  background: linear-gradient(to right, rgba(79,195,247,0.2), transparent);
}

.sec-text {
  font-size: 14px;
  line-height: 2;
  color: rgba(232,234,246,0.8);
  margin-bottom: 20px;
}

.highlight-box {
  background: var(--gold-dim);
  border-left: 2px solid var(--gold);
  padding: 18px 20px;
  margin: 20px 0;
}

.highlight-text {
  font-size: 14px;
  line-height: 1.9;
  color: var(--text);
}

/* Compatibility */
.compat-row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 12px;
}

.compat-good { color: var(--cyan); border-color: rgba(79,195,247,0.3); background: var(--cyan-dim); }
.compat-bad { color: #ef9a9a; border-color: rgba(239,154,154,0.3); background: rgba(239,154,154,0.1); }

.compat-tag {
  font-family: 'Rajdhani', sans-serif;
  font-size: 12px;
  letter-spacing: 0.1em;
  border: 1px solid;
  padding: 5px 14px;
  border-radius: 20px;
}

/* Again btn */
.again-btn {
  display: block;
  margin: 28px auto 0;
  background: transparent;
  border: 1px solid rgba(79,195,247,0.3);
  color: var(--text-dim);
  font-family: 'Rajdhani', sans-serif;
  font-size: 12px;
  letter-spacing: 0.3em;
  padding: 12px 40px;
  cursor: pointer;
  text-transform: uppercase;
  transition: all 0.3s;
}

.again-btn:hover {
  border-color: var(--cyan);
  color: var(--cyan);
  box-shadow: 0 0 20px rgba(79,195,247,0.1);
}

.footer-note {
  font-family: 'Rajdhani', sans-serif;
  font-size: 10px;
  color: var(--text-muted);
  text-align: center;
  letter-spacing: 0.15em;
  margin-top: 48px;
  opacity: 0.5;
}

@media (max-width: 520px) {
  .form-grid { grid-template-columns: 1fr; }
  .numbers-row { grid-template-columns: 1fr; }
  .detail-card { padding: 24px 20px; }
  .form-card { padding: 28px 20px; }
  .detail-header { flex-direction: column; align-items: flex-start; gap: 12px; }
  .detail-num-big { font-size: 56px; }
}
</style>
</head>

<script>
// Star canvas
const canvas = document.getElementById('starCanvas');
const ctx = canvas.getContext('2d');
let stars = [];

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}

function initStars() {
  stars = [];
  for (let i = 0; i < 120; i++) {
    stars.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 1.5 + 0.2,
      o: Math.random() * 0.6 + 0.1,
      speed: Math.random() * 0.3 + 0.05,
      phase: Math.random() * Math.PI * 2
    });
  }
}

function drawStars(t) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  stars.forEach(s => {
    const opacity = s.o * (0.5 + 0.5 * Math.sin(t * s.speed + s.phase));
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(79,195,247,${opacity})`;
    ctx.fill();
  });
  requestAnimationFrame(drawStars);
}

resizeCanvas(); initStars(); requestAnimationFrame(drawStars);
window.addEventListener('resize', () => { resizeCanvas(); initStars(); });

// Kana to number conversion (Pythagorean system)
const kanaMap = {
  'あ':1,'い':1,'う':6,'え':5,'お':6,
  'か':2,'き':1,'く':2,'け':5,'こ':2,
  'さ':3,'し':3,'す':3,'せ':5,'そ':3,
  'た':4,'ち':2,'つ':4,'て':4,'と':4,
  'な':5,'に':5,'ぬ':5,'ね':5,'の':5,
  'は':8,'ひ':1,'ふ':8,'へ':5,'ほ':8,
  'ま':4,'み':4,'む':4,'め':4,'も':4,
  'や':1,'ゆ':6,'よ':7,
  'ら':2,'り':9,'る':2,'れ':9,'ろ':2,
  'わ':6,'ゐ':1,'ゑ':5,'を':6,'ん':5,
  'が':2,'ぎ':1,'ぐ':2,'げ':5,'ご':2,
  'ざ':3,'じ':3,'ず':3,'ぜ':5,'ぞ':3,
  'だ':4,'ぢ':2,'づ':4,'で':4,'ど':4,
  'ば':8,'び':1,'ぶ':8,'べ':5,'ぼ':8,
  'ぱ':8,'ぴ':1,'ぷ':8,'ぺ':5,'ぽ':8,
  'ぁ':1,'ぃ':1,'ぅ':6,'ぇ':5,'ぉ':6,
  'っ':4,'ゃ':1,'ゅ':6,'ょ':7,
};

function reduceNum(n) {
  if (n === 11 || n === 22 || n === 33) return n;
  if (n < 10) return n;
  const digits = String(n).split('').map(Number);
  return reduceNum(digits.reduce((a, b) => a + b, 0));
}

function calcLifePath(dateStr) {
  const d = dateStr.replace(/-/g, '');
  const sum = d.split('').map(Number).reduce((a, b) => a + b, 0);
  return reduceNum(sum);
}

function calcExpression(name) {
  const clean = name.replace(/\s/g, '').toLowerCase();
  let sum = 0;
  for (const c of clean) {
    sum += kanaMap[c] || 0;
  }
  return sum > 0 ? reduceNum(sum) : null;
}

function calcSoulUrge(name) {
  // Vowels in hiragana
  const vowels = ['あ','い','う','え','お','ぁ','ぃ','ぅ','ぇ','ぉ'];
  const clean = name.replace(/\s/g, '');
  let sum = 0;
  for (const c of clean) {
    if (vowels.includes(c)) sum += kanaMap[c] || 1;
  }
  return sum > 0 ? reduceNum(sum) : null;
}

let currentNum = null;
let allNumbers = {};

function calculate() {
  const name = document.getElementById('nameInput').value.trim();
  const birth = document.getElementById('birthInput').value;

  if (!birth) { alert('生年月日を入力してください'); return; }

  const btn = document.getElementById('calcBtn');
  const comp = document.getElementById('computing');
  const wrap = document.getElementById('resultWrap');

  btn.disabled = true;
  comp.classList.add('show');
  wrap.classList.remove('show');

  setTimeout(() => {
    const lp = calcLifePath(birth);
    const expr = name ? calcExpression(name) : null;
    const soul = name ? calcSoulUrge(name) : null;

    allNumbers = { lp, expr, soul };
    currentNum = lp;

    renderNumbers(lp, expr, soul);
    renderDetail(lp, 'ライフパスナンバー');

    comp.classList.remove('show');
    wrap.classList.add('show');
    btn.disabled = false;
    wrap.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, 1800);
}

function renderNumbers(lp, expr, soul) {
  const row = document.getElementById('numbersRow');
  const nums = [
    { val: lp, label: 'Life Path', name: 'ライフパス' },
    { val: expr, label: 'Expression', name: '表現数' },
    { val: soul, label: 'Soul Urge', name: 'ソウル数' },
  ];
  row.innerHTML = nums.map((n, i) => `
    <div class="num-card ${i === 0 ? 'active' : ''}" onclick="selectNumber(${n.val}, '${n.name}', this)" ${!n.val ? 'style="opacity:0.4;pointer-events:none"' : ''}>
      <div class="num-label">${n.label}</div>
      <div class="num-value">${n.val || '—'}</div>
      <div class="num-name">${n.name}</div>
    </div>
  `).join('');
}

function selectNumber(num, label, el) {
  document.querySelectorAll('.num-card').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  currentNum = num;
  renderDetail(num, label);
}

function renderDetail(num, label) {

      ${d.badWith.map(n => `<div class="compat-tag compat-bad">Number ${n}</div>`).join('')}

function reset() {
  document.getElementById('resultWrap').classList.remove('show');
  document.getElementById('nameInput').value = '';
  document.getElementById('birthInput').value = '';
  window.scrollTo({ top: 0, behavior: 'smooth' });
