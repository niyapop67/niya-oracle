<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数秘術診断｜Numerology</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Noto+Serif+JP:wght@300;400;500&family=Rajdhani:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #04060f;
  --bg2: #070b18;
  --blue-deep: #0a0e24;
  --blue: #1a2a6c;
  --cyan: #4fc3f7;
  --cyan-dim: rgba(79,195,247,0.15);
  --cyan-glow: rgba(79,195,247,0.4);
  --gold: #e8c97a;
  --gold-dim: rgba(232,201,122,0.2);
  --text: #e8eaf6;
  --text-dim: #9eb0e8;
  --text-muted: #8899dd;
  --violet: #7c4dff;
  --violet-dim: rgba(124,77,255,0.2);
  --red: #ef9a9a;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Serif JP', serif;
  min-height: 100vh;
  overflow-x: hidden;
}

.bg-canvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
canvas { position: absolute; inset: 0; }
.bg-overlay {
  position: fixed; inset: 0;
  background:
    radial-gradient(ellipse 80% 60% at 50% 0%, rgba(26,42,108,0.6) 0%, transparent 70%),
    radial-gradient(ellipse 40% 40% at 80% 80%, rgba(124,77,255,0.15) 0%, transparent 60%),
    radial-gradient(ellipse 40% 40% at 20% 60%, rgba(79,195,247,0.1) 0%, transparent 60%);
  z-index: 0; pointer-events: none;
}

.container { position: relative; z-index: 1; max-width: 680px; margin: 0 auto; padding: 56px 24px 80px; display: flex; flex-direction: column; align-items: center; }

.header { text-align: center; margin-bottom: 44px; }
.header-icon { width: 64px; height: 64px; margin: 0 auto 20px; position: relative; animation: spinSlow 20s linear infinite; }
.header-icon svg { width: 100%; height: 100%; }
@keyframes spinSlow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
.eyebrow { font-family: 'Rajdhani', sans-serif; font-size: 11px; letter-spacing: 0.4em; color: var(--cyan); text-transform: uppercase; margin-bottom: 12px; opacity: 0.8; }
h1 { font-family: 'Cinzel', serif; font-size: clamp(28px, 7vw, 48px); font-weight: 600; letter-spacing: 0.15em; background: linear-gradient(135deg, var(--text) 0%, var(--cyan) 50%, var(--gold) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; line-height: 1.2; margin-bottom: 10px; }
.header-sub { font-family: 'Rajdhani', sans-serif; font-size: 12px; color: var(--text-dim); letter-spacing: 0.25em; }
.divider { display: flex; align-items: center; gap: 12px; margin: 20px 0; width: 200px; }
.div-line { flex: 1; height: 1px; background: linear-gradient(to right, transparent, var(--cyan-dim), transparent); }
.div-dot { width: 4px; height: 4px; background: var(--cyan); border-radius: 50%; box-shadow: 0 0 8px var(--cyan); }

.form-card { background: rgba(7,11,24,0.8); border: 1px solid rgba(79,195,247,0.15); width: 100%; padding: 36px; position: relative; backdrop-filter: blur(12px); margin-bottom: 28px; }
.form-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: linear-gradient(to right, transparent, var(--cyan), var(--violet), transparent); }

.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
.form-group { display: flex; flex-direction: column; gap: 8px; }
.form-group.full { grid-column: 1 / -1; }
.form-label { font-family: 'Rajdhani', sans-serif; font-size: 10px; letter-spacing: 0.3em; color: var(--cyan); text-transform: uppercase; opacity: 0.8; }
.form-input, .form-textarea { background: rgba(15,22,55,0.95); border: 1px solid rgba(79,195,247,0.35); color: var(--text); font-family: 'Noto Serif JP', serif; font-size: 15px; padding: 13px 16px; outline: none; transition: border-color 0.3s, box-shadow 0.3s; border-radius: 2px; }
.form-textarea { resize: vertical; min-height: 76px; line-height: 1.8; }
.form-input::placeholder, .form-textarea::placeholder { color: var(--text-muted); font-size: 13px; }
.form-input:focus, .form-textarea:focus { border-color: rgba(79,195,247,0.5); box-shadow: 0 0 0 3px rgba(79,195,247,0.06), 0 0 20px rgba(79,195,247,0.1); }
.optional-note { font-family: 'Rajdhani', sans-serif; font-size: 10.5px; color: var(--text-muted); margin-top: 4px; letter-spacing: 0.05em; }

/* Consultation theme grid (reuses Tarot/Rune UI language) */
.theme-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(108px,1fr)); gap: 8px; }
.theme-btn { background: rgba(15,22,55,0.7); border: 1px solid rgba(79,195,247,0.25); color: var(--text-dim); font-family: 'Noto Serif JP', serif; font-size: 12.5px; padding: 10px 8px; cursor: pointer; transition: all 0.2s; border-radius: 2px; text-align: center; }
.theme-btn:hover { border-color: rgba(79,195,247,0.5); }
.theme-btn.active { background: rgba(79,195,247,0.15); border-color: var(--cyan); color: var(--cyan); font-weight: 600; }
.form-error { font-family: 'Rajdhani', sans-serif; font-size: 12px; color: var(--red); margin-top: 10px; display:none; letter-spacing: 0.05em; }
.form-error.show { display:block; }

.calc-btn { width: 100%; background: transparent; border: 1px solid var(--cyan); color: var(--cyan); font-family: 'Cinzel', serif; font-size: 14px; letter-spacing: 0.3em; padding: 18px; cursor: pointer; position: relative; overflow: hidden; transition: all 0.4s; margin-top: 8px; }
.calc-btn::before { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, var(--cyan), var(--violet)); opacity: 0; transition: opacity 0.4s; }
.calc-btn:hover::before { opacity: 1; }
.calc-btn:hover { color: var(--bg); border-color: transparent; }
.calc-btn span { position: relative; z-index: 1; }
.calc-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.calc-btn:disabled::before { display: none; }

.computing { display: none; flex-direction: column; align-items: center; gap: 14px; padding: 20px 0; }
.computing.show { display: flex; }
.compute-ring { width: 48px; height: 48px; border: 2px solid rgba(79,195,247,0.2); border-top-color: var(--cyan); border-radius: 50%; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.compute-text { font-family: 'Rajdhani', sans-serif; font-size: 11px; letter-spacing: 0.3em; color: var(--text-dim); }

.result-wrap { width: 100%; opacity: 0; transform: translateY(24px); transition: all 0.9s cubic-bezier(0.4,0,0.2,1); pointer-events: none; }
.result-wrap.show { opacity: 1; transform: translateY(0); pointer-events: auto; }

.question-echo { background: rgba(79,195,247,0.05); border-left: 2px solid var(--cyan); padding: 12px 16px; margin-bottom: 24px; font-size: 13px; color: var(--text-dim); line-height: 1.7; }
.question-echo b { color: var(--gold); }

.numbers-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 20px; }
.num-card { background: rgba(7,11,24,0.9); border: 1px solid rgba(79,195,247,0.12); padding: 24px 16px; text-align: center; position: relative; cursor: pointer; transition: all 0.3s; backdrop-filter: blur(8px); }
.num-card::before { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, var(--cyan-dim), var(--violet-dim)); opacity: 0; transition: opacity 0.3s; }
.num-card:hover::before, .num-card.active::before { opacity: 1; }
.num-card.active { border-color: rgba(79,195,247,0.4); }
.num-label { font-family: 'Rajdhani', sans-serif; font-size: 9px; letter-spacing: 0.25em; color: var(--text-dim); text-transform: uppercase; margin-bottom: 10px; position: relative; z-index: 1; }
.num-value { font-family: 'Cinzel', serif; font-size: 44px; font-weight: 700; background: linear-gradient(135deg, var(--cyan), var(--gold)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; line-height: 1; position: relative; z-index: 1; }
.num-name { font-size: 11px; color: var(--text-dim); margin-top: 6px; letter-spacing: 0.1em; position: relative; z-index: 1; }

.trace-note { font-family: 'Rajdhani', sans-serif; font-size: 11px; color: var(--text-muted); text-align: center; letter-spacing: 0.05em; margin-bottom: 28px; cursor: pointer; }
.trace-note:hover { color: var(--cyan); }
.trace-detail { display: none; font-family: 'Rajdhani', sans-serif; font-size: 12px; color: var(--text-dim); text-align: center; letter-spacing: 0.05em; margin-top: 6px; }
.trace-detail.show { display: block; }

.detail-card { background: rgba(7,11,24,0.85); border: 1px solid rgba(79,195,247,0.15); padding: 36px; position: relative; backdrop-filter: blur(12px); margin-bottom: 20px; }
.detail-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: linear-gradient(to right, transparent, var(--violet), var(--cyan), transparent); }
.detail-header { display: flex; align-items: center; gap: 20px; margin-bottom: 28px; padding-bottom: 24px; border-bottom: 1px solid rgba(79,195,247,0.08); }
.detail-num-big { font-family: 'Cinzel', serif; font-size: 72px; font-weight: 700; background: linear-gradient(135deg, var(--cyan), var(--violet), var(--gold)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; line-height: 1; flex-shrink: 0; filter: drop-shadow(0 0 20px rgba(79,195,247,0.3)); }
.detail-title-group { flex: 1; }
.detail-num-label { font-family: 'Rajdhani', sans-serif; font-size: 10px; letter-spacing: 0.3em; color: var(--cyan); opacity: 0.7; margin-bottom: 6px; }
.detail-num-title { font-family: 'Cinzel', serif; font-size: 20px; color: var(--text); letter-spacing: 0.1em; margin-bottom: 4px; }
.detail-keyword { font-family: 'Rajdhani', sans-serif; font-size: 12px; color: var(--gold); letter-spacing: 0.2em; opacity: 0.8; }

.traits-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
.trait-tag { font-family: 'Rajdhani', sans-serif; font-size: 11px; letter-spacing: 0.15em; color: var(--cyan); border: 1px solid rgba(79,195,247,0.3); padding: 5px 14px; border-radius: 20px; background: var(--cyan-dim); }

.sec-title { font-family: 'Rajdhani', sans-serif; font-size: 10px; letter-spacing: 0.3em; color: var(--cyan); text-transform: uppercase; margin-bottom: 10px; opacity: 0.7; display: flex; align-items: center; gap: 10px; }
.sec-title::after { content: ''; flex: 1; height: 1px; background: linear-gradient(to right, rgba(79,195,247,0.2), transparent); }
.sec-text { font-size: 14px; line-height: 2; color: rgba(232,234,246,0.85); margin-bottom: 20px; }

.highlight-box { background: var(--gold-dim); border-left: 2px solid var(--gold); padding: 18px 20px; margin: 20px 0; }
.highlight-text { font-size: 14px; line-height: 1.9; color: var(--text); }
.advice-list { list-style: none; padding: 0; margin-top: 8px; }
.advice-list li { padding: 4px 0 4px 16px; position: relative; font-size: 13.5px; line-height: 1.9; color: var(--text); }
.advice-list li::before { content: '✦'; position: absolute; left: 0; color: var(--gold); font-size: 10px; }

.compat-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
.compat-good { color: var(--cyan); border-color: rgba(79,195,247,0.3); background: var(--cyan-dim); }
.compat-bad { color: #ef9a9a; border-color: rgba(239,154,154,0.3); background: rgba(239,154,154,0.1); }
.compat-tag { font-family: 'Rajdhani', sans-serif; font-size: 12px; letter-spacing: 0.1em; border: 1px solid; padding: 5px 14px; border-radius: 20px; }

.again-btn { display: block; margin: 28px auto 0; background: transparent; border: 1px solid rgba(79,195,247,0.3); color: var(--text-dim); font-family: 'Rajdhani', sans-serif; font-size: 12px; letter-spacing: 0.3em; padding: 12px 40px; cursor: pointer; text-transform: uppercase; transition: all 0.3s; }
.again-btn:hover { border-color: var(--cyan); color: var(--cyan); box-shadow: 0 0 20px rgba(79,195,247,0.1); }

.meta-note { font-family: 'Rajdhani', sans-serif; font-size: 10px; color: var(--text-muted); text-align: center; letter-spacing: 0.1em; margin-top: 20px; opacity: 0.6; }
.footer-note { font-family: 'Rajdhani', sans-serif; font-size: 10px; color: var(--text-muted); text-align: center; letter-spacing: 0.15em; margin-top: 48px; opacity: 0.5; }

@media (max-width: 520px) {
  .form-grid { grid-template-columns: 1fr; }
  .numbers-row { grid-template-columns: 1fr; }
  .detail-card { padding: 24px 20px; }
  .form-card { padding: 28px 20px; }
  .detail-header { flex-direction: column; align-items: flex-start; gap: 12px; }
  .detail-num-big { font-size: 56px; }
}
</style>
</head>
<body>

<div class="bg-canvas"><canvas id="starCanvas"></canvas></div>
<div class="bg-overlay"></div>

<div class="container">
  <div class="header">
    <div class="header-icon">
      <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <polygon points="32,4 58,48 6,48" stroke="rgba(79,195,247,0.6)" stroke-width="1" fill="none"/>
        <polygon points="32,60 6,16 58,16" stroke="rgba(232,201,122,0.4)" stroke-width="1" fill="none"/>
        <circle cx="32" cy="32" r="8" stroke="rgba(79,195,247,0.4)" stroke-width="1" fill="none"/>
        <circle cx="32" cy="32" r="2" fill="rgba(79,195,247,0.8)"/>
      </svg>
    </div>
    <div class="eyebrow">Numerology · 数秘術</div>
    <h1>数の神託</h1>
    <div class="divider"><div class="div-line"></div><div class="div-dot"></div><div class="div-line"></div></div>
    <div class="header-sub">Your Numbers · Your Consultation</div>
  </div>

  <div class="form-card" id="formCard">
    <div class="form-grid">
      <div class="form-group">
        <div class="form-label">名前（ひらがな・任意）</div>
        <input class="form-input" type="text" id="nameInput" placeholder="やまだはなこ">
      </div>
      <div class="form-group">
        <div class="form-label">生年月日（必須）</div>
        <input class="form-input" type="date" id="birthInput">
      </div>
    </div>

    <div class="form-group full" style="margin-bottom:20px;">
      <div class="form-label">テーマを選ぶ（必須）</div>
      <div class="theme-grid" id="themeGrid"></div>
    </div>

    <div class="form-group full" style="margin-bottom:8px;">
      <div class="form-label">相談内容（必須）</div>
      <textarea class="form-textarea" id="questionInput" placeholder="例：転職を考えていますが、決め手に欠けています。どう考えればいいですか？"></textarea>
    </div>
    <div class="optional-note" style="margin-bottom:20px;">数秘術はあなた自身の傾向を読むものです。相手の気持ちなど断定できないことは、タロット/ルーンの結果と合わせてご確認ください。</div>

    <div class="form-error" id="formError">生年月日・テーマ・相談内容はすべて必須です。</div>

    <button class="calc-btn" id="calcBtn" onclick="calculate()"><span>✦ 数を解読する ✦</span></button>
    <div class="computing" id="computing">
      <div class="compute-ring"></div>
      <div class="compute-text">宇宙の数理を計算しています…</div>
    </div>
  </div>

  <div class="result-wrap" id="resultWrap">
    <div class="question-echo" id="questionEcho"></div>
    <div class="numbers-row" id="numbersRow"></div>
    <div class="trace-note" id="traceNote" onclick="toggleTrace()">計算過程を見る ▾</div>
    <div class="detail-card" id="detailCard"></div>
    <button class="again-btn" onclick="reset()">↺ Reset · 新しい相談でもう一度</button>
    <div class="meta-note" id="metaNote"></div>
  </div>

  <div class="footer-note">数秘術はピタゴラス数秘術（誕生日の全桁合計方式）に基づいています</div>
</div>

<script>
/* =========================================================
   NIYA ORACLE — NUMEROLOGY ENGINE (rule-based contextual layer)
   Spec version: 03_NUMEROLOGY_ENGINE_IMPLEMENTATION_SPEC v1.0

   Audit findings acted on (spec §36 / §2-3):
     - Life Path calculation formula was already correct and matches
       the spec's own worked example (full-date digit sum, recursive
       reduction, master numbers 11/22/33 preserved at each step).
       Kept unchanged; only added an explicit calculation trace.
     - No consultation intake existed at all. Added theme + question
       (required), matching the Tarot/Rune engines' pattern.
     - Expression Number / Soul Urge (name-based) are explicitly
       Out of Scope per spec §3. Kept as secondary/reference info
       only — NOT wired into the new contextual/consultation layer,
       and not something the "今回の答え" block draws from.
     - No calculation trace, no calculationSystem/calculationVersion
       tag, no birth-date validation beyond "not empty", no Personal
       Year. All added below.
     - Tarot/Rune cross-system synthesis (§17/18) requires an actual
       divination result and belongs wherever a combined reading is
       assembled (e.g. a future dashboard) — out of scope for this
       standalone page. The internal NumerologyResult-shaped object
       is still produced and exposed (window.__lastNumerologyResult)
       so that integration can consume it later without recomputation.
   ========================================================= */

// Star canvas (unchanged)
const canvas = document.getElementById('starCanvas');
const ctx = canvas.getContext('2d');
let stars = [];
function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
function initStars() {
  stars = [];
  for (let i = 0; i < 120; i++) {
    stars.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, r: Math.random()*1.5+0.2, o: Math.random()*0.6+0.1, speed: Math.random()*0.3+0.05, phase: Math.random()*Math.PI*2 });
  }
}
function drawStars(t) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  stars.forEach(s => {
    const opacity = s.o * (0.5 + 0.5 * Math.sin(t * s.speed + s.phase));
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(79,195,247,${opacity})`; ctx.fill();
  });
  requestAnimationFrame(drawStars);
}
resizeCanvas(); initStars(); requestAnimationFrame(drawStars);
window.addEventListener('resize', () => { resizeCanvas(); initStars(); });

// ---------- CONSULTATION THEMES ----------
const THEMES = [
  { id:'love', label:'恋愛' },
  { id:'unrequited_love', label:'片思い' },
  { id:'reconciliation', label:'復縁' },
  { id:'relationship', label:'人間関係' },
  { id:'work', label:'仕事' },
  { id:'career_change', label:'転職' },
  { id:'future_direction', label:'今後の方向性' },
  { id:'self_understanding', label:'自己理解' },
  { id:'decision', label:'決断' },
  { id:'other', label:'その他' },
];
// Maps theme -> which existing narrative field to draw from when
// composing the contextual interpretation (spec §15 theme transform).
const THEME_FIELD = {
  love:'love', unrequited_love:'love', reconciliation:'love', relationship:'love',
  work:'work', career_change:'work',
  future_direction:'personality', self_understanding:'personality', decision:'personality', other:'personality'
};
const THEME_DOMAIN_LABEL = {
  love:'恋愛面', unrequited_love:'片思いの状況', reconciliation:'復縁への向き合い方',
  relationship:'人間関係', work:'仕事面', career_change:'転職の判断',
  future_direction:'今後の方向性', self_understanding:'自分自身の理解', decision:'今回の決断', other:'今回の相談'
};
let selectedTheme = null;
function renderThemeGrid() {
  document.getElementById('themeGrid').innerHTML = THEMES.map(t =>
    `<button type="button" class="theme-btn" onclick="selectTheme('${t.id}', this)">${t.label}</button>`
  ).join('');
}
function selectTheme(id, btn) {
  selectedTheme = id;
  document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('formError').classList.remove('show');
}

// ---------- NUMBER MASTER DATA (unchanged content, kept as-is) ----------
const numData = {
  1: { title:'リーダー', keyword:'Independence · Initiation · Courage',
    traits:['独立心','リーダーシップ','創造性','強い意志','パイオニア'],
    personality:'1は全ての始まりを象徴する数。あなたは生まれながらのリーダーで、新しい道を切り開く力を持っています。独立心が強く、人に頼るより自分の力で道を切り拓くことを好みます。強い意志と行動力で、周囲を引っ張る存在です。',
    love:'恋愛では積極的にリードするタイプ。一途で情熱的ですが、相手に自分のペースを押しつけないよう注意が必要。自立した相手との関係が長続きします。',
    work:'起業家・経営者・クリエイターとして才能を発揮します。チームでは自然とリーダー的ポジションに。新しいプロジェクトのスタートを任せると力を発揮します。',
    advice:'完璧主義と孤独感に注意。時には人の助けを受け入れることで、さらに大きな力が生まれます。',
    goodWith:[3,5,9], badWith:[4,8] },
  2: { title:'調停者', keyword:'Harmony · Sensitivity · Partnership',
    traits:['協調性','直感力','繊細さ','思いやり','外交的'],
    personality:'2は陰陽の調和を象徴する数。あなたは優れた感受性と共感力を持ち、人々の間に橋を架ける役割を果たします。細やかな気遣いと直感力で、周囲の感情を敏感に読み取ることができます。',
    love:'深い感受性を持つ恋人タイプ。相手を思いやることが自然にできますが、自分の気持ちを表現するのが苦手なことも。二人だけの世界を大切にします。',
    work:'カウンセラー・外交官・チームサポーターとして輝きます。対立する意見を調和させる天才。裏方として組織を支える力があります。',
    advice:'優しさゆえに自己犠牲になりがち。自分の感情も同じくらい大切にしてください。',
    goodWith:[1,6,8], badWith:[5,9] },

const kanaToRomaji = {
  'あ':'a','い':'i','う':'u','え':'e','お':'o','か':'ka','き':'ki','く':'ku','け':'ke','こ':'ko',

  'ら':'ra','り':'ri','る':'ru','れ':'re','ろ':'ro','わ':'wa','ゐ':'i','ゑ':'e','を':'o','ん':'n',
  'が':'ga','ぎ':'gi','ぐ':'gu','げ':'ge','ご':'go','ざ':'za','じ':'ji','ず':'zu','ぜ':'ze','ぞ':'zo',
  'だ':'da','ぢ':'ji','づ':'zu','で':'de','ど':'do','ば':'ba','び':'bi','ぶ':'bu','べ':'be','ぼ':'bo',
  'ぱ':'pa','ぴ':'pi','ぷ':'pu','ぺ':'pe','ぽ':'po','ぁ':'a','ぃ':'i','ぅ':'u','ぇ':'e','ぉ':'o',
  'っ':'t','ゃ':'ya','ゅ':'yu','ょ':'yo',

  'りゃ':'rya','りゅ':'ryu','りょ':'ryo','ぎゃ':'gya','ぎゅ':'gyu','ぎょ':'gyo',
  'じゃ':'ja','じゅ':'ju','じょ':'jo','びゃ':'bya','びゅ':'byu','びょ':'byo',
  'ぴゃ':'pya','ぴゅ':'pyu','ぴょ':'pyo',
};
const romajiMap = { 'a':1,'b':2,'c':3,'d':4,'e':5,'f':8,'g':3,'h':5,'i':1,'j':1,'k':2,'l':3,'m':4,'n':5,'o':7,'p':8,'q':1,'r':9,'s':3,'t':4,'u':6,'v':6,'w':6,'x':5,'y':1,'z':7 };
const romajiVowels = ['a','e','i','o','u'];
function isRomaji(name) { return /^[a-zA-Z\s]+$/.test(name.trim()); }
function hiraganaToRomaji(str) {
  let result = '', i = 0;
  while (i < str.length) {
    if (i+1 < str.length && kanaToRomaji[str[i]+str[i+1]]) { result += kanaToRomaji[str[i]+str[i+1]]; i += 2; }
    else if (kanaToRomaji[str[i]]) { result += kanaToRomaji[str[i]]; i++; }
    else { result += str[i]; i++; }
  }
  return result;
}
function calcExpression(name) {
  let clean = name.replace(/\s/g, '').toLowerCase();
  if (!isRomaji(name)) clean = hiraganaToRomaji(clean);
  let sum = 0;
  for (const c of clean) sum += romajiMap[c] || 0;
  return sum > 0 ? reduceNum(sum) : null;
}
function calcSoulUrge(name) {
  let clean = name.replace(/\s/g, '').toLowerCase();
  if (!isRomaji(name)) clean = hiraganaToRomaji(clean);
  let sum = 0;
  for (const c of clean) if (romajiVowels.includes(c)) sum += romajiMap[c] || 1;
  return sum > 0 ? reduceNum(sum) : null;
}

// ---------- CALCULATION ENGINE (spec §4-9) ----------
// Tradition: Pythagorean, full-date digit-sum method (matches spec's
// own worked example). Master numbers 11/22/33 are checked and
// preserved at EVERY reduction step, not only the final one. This
// policy is applied consistently to Life Path and Personal Year.
const CALC_SYSTEM = 'pythagorean-date-v1';
const CALC_VERSION = '1.0';
const MASTER_NUMBERS = [11, 22, 33];

function reduceWithTrace(n, steps) {
  if (MASTER_NUMBERS.includes(n)) return n;
  if (n < 10) return n;
  const digits = String(n).split('').map(Number);
  const next = digits.reduce((a,b) => a+b, 0);
  steps.push(`${digits.join('+')}=${next}`);
  return reduceWithTrace(next, steps);
}
function reduceNum(n) { return reduceWithTrace(n, []); }

function calcLifePath(isoDate) {
  const digits = isoDate.replace(/-/g, '').split('').map(Number);
  const firstSum = digits.reduce((a,b) => a+b, 0);
  const steps = [`${digits.join('+')}=${firstSum}`];
  const result = reduceWithTrace(firstSum, steps);
  return {
    value: result,
    trace: { source:'life_path', input: isoDate, steps, result, preservedMasterNumber: MASTER_NUMBERS.includes(result) }
  };
}

// Personal Year (recommended, spec §12). targetYear is stored
// explicitly with the reading — never inferred by AI, never silently
// recomputed against "today" on later views of a saved reading.
function calcPersonalYear(birthMonth, birthDay, targetYear) {
  const mSteps = [], dSteps = [], ySteps = [];
  const m = reduceWithTrace(birthMonth, mSteps);
  const d = reduceWithTrace(birthDay, dSteps);
  const yDigits = String(targetYear).split('').map(Number);
  const ySum = yDigits.reduce((a,b)=>a+b,0);
  ySteps.push(`${yDigits.join('+')}=${ySum}`);
  const y = reduceWithTrace(ySum, ySteps);

  const totalSteps = [];
  totalSteps.push(`月${birthMonth}→${m}, 日${birthDay}→${d}, 年${targetYear}→${y}`);
  const total = m + d + y;
  totalSteps.push(`${m}+${d}+${y}=${total}`);
  const finalSteps = [];
  const result = reduceWithTrace(total, finalSteps);
  return {
    value: result,
    year: targetYear,
    trace: { source:'personal_year', input:`${birthMonth}/${birthDay}/${targetYear}`, steps:[...totalSteps, ...finalSteps], result, preservedMasterNumber: MASTER_NUMBERS.includes(result) }
  };
}

// ---------- BIRTH DATE VALIDATION (spec §10/§32) ----------
function validateBirthDate(isoDate) {
  if (!isoDate) return 'missing';
  const d = new Date(isoDate + 'T00:00:00');
  if (isNaN(d.getTime())) return 'invalid';
  const [y] = isoDate.split('-').map(Number);
  if (y < 1900) return 'invalid';
  if (d.getTime() > Date.now()) return 'future';
  return null;
}

// ---------- CONTEXTUAL INTERPRETATION (spec §14/§15) ----------
function buildContextualInterpretation(number, theme) {
  const d = numData[number];
  const field = THEME_FIELD[theme] || 'personality';
  const domainLabel = THEME_DOMAIN_LABEL[theme] || '今回の相談';
  const base = d[field];
  return `あなたの数秘術ではライフパス${number}（${d.title}）の性質が強く出ており、${domainLabel}についても、${base}という傾向が関係していそうです。`;
}

// "今回の答え" — framed as the person's own tendency in handling the
// situation, never as an absolute claim about outcomes or other
// people's feelings (spec §16/§18/§20).
function buildTendencyAnswer(number, theme) {
  const d = numData[number];
  const domainLabel = THEME_DOMAIN_LABEL[theme] || '今回の相談';
  const conclusion = `${domainLabel}において、あなたは${d.title}（ライフパス${number}）らしい向き合い方をしやすい傾向があります。`;
  const reason = `${d.personality}`;
  const action = `具体的には、${d.advice}`;
  return { conclusion, reason, action };
}

// ---------- STATE ----------
let currentReading = null;

function makeReadingId() { return 'nm_' + Date.now().toString(36) + '_' + Math.floor(Math.random()*1e6).toString(36); }

function calculate() {
  const name = document.getElementById('nameInput').value.trim();
  const birth = document.getElementById('birthInput').value;
  const question = document.getElementById('questionInput').value.trim();
  const errEl = document.getElementById('formError');

  const dateError = validateBirthDate(birth);
  if (dateError || !selectedTheme || !question) {
    let msg = '生年月日・テーマ・相談内容はすべて必須です。';
    if (dateError === 'future') msg = '生年月日には未来の日付を入力できません。';
    else if (dateError === 'invalid') msg = '生年月日が正しく入力されていません。';
    errEl.textContent = msg;
    errEl.classList.add('show');
    errEl.scrollIntoView({ behavior:'smooth', block:'center' });
    return;
  }
  errEl.classList.remove('show');

  const btn = document.getElementById('calcBtn');
  const comp = document.getElementById('computing');
  const wrap = document.getElementById('resultWrap');
  btn.disabled = true;
  comp.classList.add('show');
  wrap.classList.remove('show');

  setTimeout(() => {
    const [y, m, dNum] = birth.split('-').map(Number);
    const lifePath = calcLifePath(birth);
    const targetYear = new Date().getFullYear();
    const personalYear = calcPersonalYear(m, dNum, targetYear);

    // Secondary/reference only — not used in contextual/answer logic.
    const expr = name ? calcExpression(name) : null;
    const soul = name ? calcSoulUrge(name) : null;

    currentReading = {
      readingId: makeReadingId(),
      calculationSystem: CALC_SYSTEM,
      calculationVersion: CALC_VERSION,
      birthDate: birth,
      lifePath, personalYear,
      referenceOnly: { expression: expr, soulUrge: soul },
      consultation: { theme: selectedTheme, question, context: null }
    };
    window.__lastNumerologyResult = currentReading; // for future Tarot/Rune integration

    renderQuestionEcho();
    renderNumbers();
    renderTrace();
    renderDetail(lifePath.value, 'ライフパスナンバー');

    comp.classList.remove('show');
    wrap.classList.add('show');
    btn.disabled = false;
    document.getElementById('metaNote').textContent =
      `reading ${currentReading.readingId} · ${CALC_SYSTEM} v${CALC_VERSION}`;
    wrap.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, 1500);
}

function renderQuestionEcho() {
  const { theme, question } = currentReading.consultation;
  const themeLabel = THEMES.find(t => t.id === theme)?.label || theme;
  document.getElementById('questionEcho').innerHTML =
    `テーマ：<b>${themeLabel}</b><br>ご相談：${escapeHtml(question)}`;
}

function renderNumbers() {
  const row = document.getElementById('numbersRow');
  const { lifePath, personalYear, referenceOnly } = currentReading;
  const nums = [
    { val: lifePath.value, label:'Life Path', name:'ライフパス' },
    { val: personalYear.value, label:`Personal Year ${personalYear.year}`, name:'パーソナルイヤー' },
    { val: referenceOnly.expression, label:'Expression (参考)', name:'表現数' },
  ];
  row.innerHTML = nums.map((n, i) => `
    <div class="num-card ${i === 0 ? 'active' : ''}" onclick="selectNumber(${n.val}, '${n.name}', this)" ${!n.val && n.val !== 0 ? 'style="opacity:0.4;pointer-events:none"' : ''}>

      <div class="num-value">${n.val ?? '—'}</div>
      <div class="num-name">${n.name}</div>
    </div>

}

function selectNumber(num, label, el) {
  if (!numData[num]) return;
  document.querySelectorAll('.num-card').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  renderDetail(num, label);
}

let traceVisible = false;
function renderTrace() {
  const note = document.getElementById('traceNote');
  const { lifePath, personalYear } = currentReading;
  note.dataset.html =
    `ライフパス：${lifePath.trace.steps.join(' → ')}` +
    `<br>パーソナルイヤー（${personalYear.year}年）：${personalYear.trace.steps.join(' → ')}`;
  note.textContent = '計算過程を見る ▾';
  const existing = document.getElementById('traceDetail');
  if (existing) existing.remove();
  const div = document.createElement('div');
  div.className = 'trace-detail';
  div.id = 'traceDetail';
  div.innerHTML = note.dataset.html;
  note.insertAdjacentElement('afterend', div);
  traceVisible = false;
}
function toggleTrace() {
  traceVisible = !traceVisible;
  document.getElementById('traceDetail').classList.toggle('show', traceVisible);
  document.getElementById('traceNote').textContent = traceVisible ? '計算過程を隠す ▴' : '計算過程を見る ▾';
}

      <div class="detail-num-big">${num}</div>
      <div class="detail-title-group">
        <div class="detail-num-label">${label} · Number ${num}</div>
        <div class="detail-num-title">${d.title}</div>
        <div class="detail-keyword">${d.keyword}</div>
      </div>
    </div>

    <div class="traits-row">${d.traits.map(t => `<div class="trait-tag">${t}</div>`).join('')}</div>

    ${contextualBlock}

    <div class="sec-title">Personality · 性格（一般的傾向）</div>
    <div class="sec-text">${d.personality}</div>

    <div class="sec-title">Love · 恋愛</div>
    <div class="sec-text">${d.love}</div>

    <div class="sec-title">Career · 仕事・使命</div>
    <div class="sec-text">${d.work}</div>

    ${answerBlock}

    <div class="sec-title">Compatibility · 相性（参考）</div>
    <div class="compat-row">
      <span style="font-family:'Rajdhani',sans-serif;font-size:10px;letter-spacing:.2em;color:var(--text-dim);align-self:center;">Good</span>
      ${d.goodWith.map(n => `<div class="compat-tag compat-good">Number ${n}</div>`).join('')}
      <span style="font-family:'Rajdhani',sans-serif;font-size:10px;letter-spacing:.2em;color:var(--text-dim);align-self:center;margin-left:8px;">注意</span>
      ${d.badWith.map(n => `<div class="compat-tag compat-bad">Number ${n}</div>`).join('')}
    </div>
  `;
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function reset() {
  currentReading = null;
  document.getElementById('resultWrap').classList.remove('show');
  document.getElementById('nameInput').value = '';
  document.getElementById('birthInput').value = '';
  document.getElementById('questionInput').value = '';
  selectedTheme = null;
  document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ---------- INIT ----------
renderThemeGrid();
</script>
</body>
</html>
